<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRA guide</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f7; --panel: #ffffff; --panel-2: #f8f9fb; --ink: #161a23; --ink-2: #394150;
    --muted: #626b7a; --faint: #8b93a1; --line: #e3e6eb; --line-2: #d2d7df;
    --accent: #4c5fd5; --accent-ink: #ffffff; --accent-soft: #eceffd;
    --ok: #1e8449; --warn: #b45309; --bad: #c8322f;
    --code: #f1f3f6; --log-bg: #11151f; --log-ink: #cdd5e2;
    --c1: #4c5fd5; --c2: #0e7490; --c3: #c2410c; --c4: #a21caf; --c5: #15803d;
    --me: #eceffd; --me-ink: #1d2766;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --radius: 12px; --top: 56px;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1117; --panel: #161a22; --panel-2: #1b2029; --ink: #e7eaf0; --ink-2: #c3c9d4;
      --muted: #99a2b1; --faint: #6f7888; --line: #262c38; --line-2: #343b4a;
      --accent: #8b9cff; --accent-ink: #0c0f1f; --accent-soft: #1f2547;
      --ok: #5fd08a; --warn: #f0b454; --bad: #ff7b72;
      --code: #1d222c; --log-bg: #0a0d13; --log-ink: #c3cbd8;
      --c1: #8b9cff; --c2: #5ccfe6; --c3: #fb923c; --c4: #e879f9; --c5: #5fd08a;
      --me: #232a4f; --me-ink: #dfe4ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }

  /* --- base ----------------------------------------------------------------------- */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  h2 { font-size: 13px; margin: 0; }
  h3 { font-size: 13px; margin: 0; font-weight: 600; }
  p { margin: 0 0 8px; }
  a { color: var(--accent); }
  code { font-family: var(--mono); font-size: 12px; background: var(--code); padding: 1px 5px; border-radius: 5px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }

  label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin: 0 0 4px; }
  input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--panel);
           border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; min-height: 34px;
           transition: border-color .12s, box-shadow .12s; }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent);
           box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  textarea { font-family: var(--mono); font-size: 12px; resize: vertical; line-height: 1.45; }
  input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; min-height: 0; margin: 0; }
  button { font: inherit; font-weight: 500; border: 1px solid var(--line-2); background: var(--panel);
           color: var(--ink); border-radius: 8px; padding: 0 12px; min-height: 32px; cursor: pointer;
           white-space: nowrap; transition: background .12s, border-color .12s, color .12s; }
  button:hover:not(:disabled) { background: var(--panel-2); border-color: var(--faint); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); border-color: transparent; }
  button.danger { color: var(--bad); }
  button.ghost { border-color: transparent; background: transparent; }
  button.sm { min-height: 28px; padding: 0 10px; font-size: 13px; }
  button.lg { min-height: 38px; padding: 0 18px; }
  button:disabled { opacity: .45; cursor: default; }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 13px;
                font-weight: 400; margin: 0; cursor: pointer; }
  .help { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 4px; }
  .help:empty { display: none; }
  .help.error { color: var(--bad); }
  .help.ok { color: var(--ok); }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px 1px 7px; border-radius: 999px;
          font-size: 12px; font-weight: 500; line-height: 1.6; color: var(--muted);
          background: color-mix(in srgb, currentColor 11%, transparent); white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-ready, .s-done { color: var(--ok); } .s-failed, .s-cancelled { color: var(--bad); }
  .s-training, .s-running { color: var(--accent); } .s-queued { color: var(--muted); }
  .s-training::before, .s-running::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .tag { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
         padding: 1px 6px; border-radius: 5px; color: var(--muted); background: var(--code); vertical-align: 1px; }
  .tag.mock { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }
  .tag.rec { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }

  /* --- top bar ---------------------------------------------------------------------- */
  .topbar { height: var(--top); display: flex; align-items: center; gap: 14px; padding: 0 18px;
            background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; flex: none; }
  .brand b { display: block; font-size: 14px; line-height: 1.1; }
  .brand span { display: block; font-size: 11px; color: var(--muted); line-height: 1.2; }
  .spacer { flex: 1; }
  .health { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
            max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .health::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .health.up::before { background: var(--ok); }
  .health.down::before { background: var(--bad); }
  .topbar a.button { display: inline-flex; align-items: center; text-decoration: none; color: var(--ink);
                     border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; min-height: 28px; font-size: 13px; }
  .topbar a.button:hover { background: var(--panel-2); }

  /* --- the two halves ----------------------------------------------------------------- */
  .halves { display: grid; grid-template-columns: minmax(360px, 480px) minmax(0, 1fr); height: calc(100vh - var(--top)); }
  .agent { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  .board { overflow-y: auto; padding: 20px 22px 40px; min-width: 0; }
  @media (max-width: 960px) {
    .halves { grid-template-columns: minmax(0, 1fr); height: auto; }
    .agent { height: 78vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .board { overflow: visible; padding: 16px; }
    .health { display: none; }
  }
  @media (max-width: 560px) {
    .topbar { padding: 0 16px; gap: 8px; }
    .brand span { display: none; }
    .agent-head { flex-wrap: wrap; row-gap: 4px; }
    .model-chip { max-width: 100%; order: 5; }
    .pipeline .stage b { font-size: 11px; }
  }
  .topbar a.button, .topbar button { white-space: nowrap; }

  /* --- the agent: header, model picker, transcript, action, composer ------------------------ */
  .agent-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .agent-head h2 { font-size: 14px; white-space: nowrap; }
  .agent-head .tag { white-space: nowrap; }
  .model-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 9px; font-size: 12px;
                max-width: 250px; border-radius: 999px; color: var(--muted); }
  .model-chip span { overflow: hidden; text-overflow: ellipsis; }
  .model-chip::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .model-chip.up::before { background: var(--ok); }
  .model-chip.down::before { background: var(--warn); }
  .settings { padding: 12px 16px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2);
              display: grid; gap: 10px; }
  .settings .row { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
  .settings .inline { display: flex; gap: 6px; }
  .settings .inline input { flex: 1; }

  .transcript { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px;
                scroll-behavior: smooth; }
  .msg { max-width: 100%; }
  .msg .who { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
  .msg .who .by { font-weight: 400; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bubble { padding: 10px 13px; border-radius: 4px 12px 12px 12px; background: var(--panel-2);
            border: 1px solid var(--line); overflow-wrap: anywhere; }
  .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 20px; }
  .bubble li { margin: 2px 0; }
  .msg.me { align-self: flex-end; max-width: 85%; }
  .msg.me .who { justify-content: flex-end; }
  .msg.me .bubble { background: var(--me); color: var(--me-ink); border-color: transparent; border-radius: 12px 4px 12px 12px; }
  .msg .note { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .msg .note.warn { color: var(--warn); }
  .msg.event { align-self: center; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .msg.event::before, .msg.event::after { content: ""; width: 24px; height: 1px; background: var(--line-2); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .action { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--panel); max-height: 55%; overflow-y: auto; }
  .action:empty { display: none; }
  .action .ask { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em;
                 margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .action .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
  .seg button { border: 0; background: transparent; min-height: 26px; color: var(--muted); font-size: 13px; }
  .seg button.active { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .dataset-pane { margin-top: 10px; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center;
          min-height: 110px; border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 14px; cursor: pointer;
          color: var(--muted); font-size: 13px; background: var(--panel-2); transition: border-color .12s, background .12s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop b { color: var(--ink); }
  .options { display: grid; gap: 6px; }
  .option { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left;
            padding: 9px 12px; min-height: 0; white-space: normal; font-weight: 400; border-radius: 10px; }
  .option input { grid-row: span 2; }
  .option b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .option .side { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .option .sub { grid-column: 2 / -1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .option.chosen, .option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .option:disabled .sub { white-space: normal; }
  .choice { grid-template-columns: minmax(0, 1fr) auto; padding: 11px 13px; }
  .choice .sub { grid-column: 1 / -1; white-space: normal; }
  .choice .time { font-weight: 600; font-variant-numeric: tabular-nums; }

  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  .composer textarea { font-family: inherit; font-size: 14px; min-height: 38px; max-height: 140px; resize: none; }
  .composer button { min-height: 38px; }

  .gate { margin: auto 0; padding: 24px 20px; }
  .gate h3 { font-size: 16px; margin-bottom: 6px; }

  /* --- the board -------------------------------------------------------------------------- */
  .board-inner { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-head .muted { font-size: 12px; }
  .grid2 { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 1200px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .fresh { animation: arrive .5s ease-out; }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* The pipeline: where the process is, drawn as connected steps. */
  .pipeline { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; }
  .stage { position: relative; padding: 2px 6px 0 0; min-width: 0; }
  .stage .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700;
                background: var(--code); color: var(--faint); border: 2px solid var(--panel); position: relative; z-index: 1; }
  .stage::before { content: ""; position: absolute; left: 22px; right: 0; top: 12px; height: 2px; background: var(--line); }
  .stage:last-child::before { display: none; }
  .stage.done::before { background: var(--accent); }
  .stage.done .dot { background: var(--accent); color: var(--accent-ink); }
  .stage.now .dot { background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
                    animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 12%, transparent); } }
  .stage b { display: block; font-size: 12px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage span { display: block; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage:not(.done):not(.now) b { color: var(--faint); font-weight: 500; }

  .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); margin-top: 16px; }
  .tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .tile span { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .tile b { display: block; font-size: 19px; font-weight: 650; margin-top: 1px; font-variant-numeric: tabular-nums;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile small { display: block; font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meter { height: 5px; border-radius: 5px; background: var(--code); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .6s ease; }
  .meter.big { height: 10px; margin: 4px 0 6px; }
  .meter.live i { background-image: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent);
                  background-size: 60px 100%; background-repeat: no-repeat; animation: sheen 1.6s linear infinite; background-color: var(--accent); }
  @keyframes sheen { from { background-position: -60px 0; } to { background-position: calc(100% + 60px) 0; } }

  .empty-state { text-align: center; padding: 34px 20px; color: var(--muted); }
  .empty-state svg { width: 120px; height: 72px; margin-bottom: 8px; }
  .empty-state b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; background: var(--panel-2); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.clip { max-width: 0; }
  td.clip div { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .scroll { overflow-x: auto; max-height: 360px; overflow-y: auto; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  tr.pick { cursor: pointer; }
  tr.pick:hover td { background: var(--panel-2); }
  tr.picked td { background: var(--accent-soft); }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--code); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chip i { font-style: normal; color: var(--faint); margin-left: 4px; }
  .problems { margin: 0; padding-left: 18px; color: var(--warn); font-size: 13px; }

  pre.log { background: var(--log-bg); color: var(--log-ink); border-radius: 8px; margin: 0; padding: 12px 14px;
            font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; height: 260px; overflow-y: auto; }
  .activity { font: 12px/1.45 var(--mono); max-height: 260px; overflow-y: auto; display: grid; gap: 1px; }
  .act { display: grid; grid-template-columns: 62px 44px minmax(0, 1fr) auto; gap: 8px; padding: 3px 6px; border-radius: 5px; }
  .act:nth-child(odd) { background: var(--panel-2); }
  .act .t { color: var(--faint); }
  .act .m { color: var(--muted); font-weight: 600; }
  .act .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .act .r { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .act.ok .r { color: var(--ok); } .act.err .r, .act.err .p { color: var(--bad); }
  .act.pending .r::after { content: "…"; animation: pulse 1s infinite; }
  .act.info .m { color: var(--accent); }

  svg.chart { fill: var(--muted); font-size: 10px; font-family: system-ui, sans-serif; width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 3px; margin-right: 5px; vertical-align: 3px; }
  .note-box { margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; background: color-mix(in srgb, var(--warn) 9%, var(--panel));
              border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); color: var(--ink-2); }
  .sample-q { font-weight: 600; margin-bottom: 4px; }
  .sample-a { white-space: pre-wrap; color: var(--ink-2); }
  .result { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .result:last-child { border-bottom: 0; }
  .result-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .result-head .num { margin-left: auto; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true">
      <rect width="26" height="26" rx="7" fill="var(--accent)"/>
      <path d="M7 16.5c2.2-5 4.2-7.5 6-7.5s3.8 2.5 6 7.5" stroke="var(--accent-ink)" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <circle cx="13" cy="9" r="2.3" fill="var(--accent-ink)"/>
      <circle cx="7" cy="17" r="2" fill="var(--accent-ink)"/>
      <circle cx="19" cy="17" r="2" fill="var(--accent-ink)"/>
    </svg>
    <div><b>LoRA guide</b><span>train LoRAs with an assistant</span></div>
  </div>
  <div class="spacer"></div>
  <span id="health" class="health" title="The async API server"></span>
  <a class="button" href="/demo" target="_blank" rel="noopener">Console ↗</a>
  <button type="button" class="sm ghost" id="changeKey" hidden>Change key</button>
</header>

<div class="halves">
  <!-- left: the agent -->
  <section class="agent" aria-label="The guide">
    <div class="agent-head">
      <h2>Your guide</h2>
      <span id="mockTag" class="tag mock" hidden>practice run</span>
      <span class="spacer"></span>
      <button type="button" class="sm ghost model-chip" id="modelChip" title="Which model the guide talks through"><span>…</span></button>
      <button type="button" class="sm ghost" id="restart" title="Forget this conversation and start again">Start over</button>
    </div>
    <div class="settings" id="settings" hidden>
      <div class="row">
        <div>
          <label for="provider">Provider</label>
          <select id="provider"></select>
        </div>
        <div>
          <label for="model">Model</label>
          <div class="inline">
            <input id="model" list="modelList" placeholder="the provider's default" autocomplete="off">
            <button type="button" class="sm" id="refreshModels" title="Ask the provider which models it has">↻</button>
          </div>
          <datalist id="modelList"></datalist>
        </div>
      </div>
      <div id="baseUrlRow">
        <label for="baseUrl">Endpoint</label>
        <input id="baseUrl" placeholder="http://host:1234/v1" autocomplete="off">
      </div>
      <p class="help" id="providerHelp"></p>
      <label class="check"><input type="checkbox" id="mock"> Practice run — train nothing, finish in seconds (no GPU needed)</label>
    </div>

    <div class="transcript" id="transcript" aria-live="polite"></div>
    <div class="action" id="action"></div>
    <form class="composer" id="composer">
      <textarea id="say" rows="1" placeholder="Ask me anything, or answer in your own words…" aria-label="Message"></textarea>
      <button type="submit" class="primary" id="send">Send</button>
    </form>
  </section>

  <!-- right: what is happening -->
  <main class="board" aria-label="Progress">
    <div class="board-inner" id="board"></div>
  </main>
</div>

<script>
"use strict";

// --- state -------------------------------------------------------------------------
//
// The page holds the whole conversation; the server's /agent endpoints keep
// nothing. S is saved to this browser after every change, so a reload -- in the
// middle of a training, say -- picks up where it was.

const STAGES = [
  ["intro", "Welcome"], ["dataset", "Dataset"], ["analysis", "Review"],
  ["wait", "How long"], ["training", "Training"], ["done", "Done"]];
const STAGE_OF = { confirm: "wait" };
const FINAL = ["ready", "failed", "cancelled", "missing"];

let key = "";
let config = null;
let S = fresh();
let busy = false;
let pollTimer = null, tickTimer = null;
let activity = [];                  // the API calls this page made, newest last
let logFor = null;                  // the LoRA whose log is shown
let details = {};                   // LoRA id -> the last GET /loras/{id}
let logText = {};                   // LoRA id -> its log lines
let queuedSince = null;             // when the first LoRA was seen still queued
let pendingFile = null;             // an upload read, not yet analysed
let datasetMode = "paste";

function fresh() {
  return { stage: "intro", transcript: [], dataset: null, analysis: null, sharedFile: null,
           choices: null, recommended: null, epochs: null, estimate: null, plan: null,
           loras: [], startedAt: null, finishedAt: null, stamps: {}, mock: null, agent: null,
           debriefed: false };
}

const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    if (name === "class") node.className = value;
    else if (name === "html") node.innerHTML = value;
    else if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
    else node.setAttribute(name, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : String(child));
  }
  return node;
}

function remember(name, value) {
  try { localStorage.setItem("gep-agent-" + name, typeof value === "string" ? value : JSON.stringify(value)); } catch (_) { /* private mode */ }
}
function recall(name, parse = false) {
  try {
    const raw = localStorage.getItem("gep-agent-" + name);
    return parse ? (raw ? JSON.parse(raw) : null) : (raw || "");
  } catch (_) { return parse ? null : ""; }
}
// The API key is the demo page's, so one key serves both pages.
function recallKey() { try { return localStorage.getItem("gep-api-key") || ""; } catch (_) { return ""; } }
function rememberKey(value) { try { localStorage.setItem("gep-api-key", value); } catch (_) { /* private mode */ } }

function save() {
  // A pasted dataset over a megabyte is not kept; a restored session before
  // the training asks for it again rather than failing on a missing one.
  const copy = Object.assign({}, S);
  if (copy.dataset && copy.dataset.text && copy.dataset.text.length > 1e6) copy.dataset = Object.assign({}, copy.dataset, { text: null });
  remember("session", copy);
}

const fmt = (value, digits = 3) => (value === null || value === undefined || Number.isNaN(value)) ? "–" : Number(value).toFixed(digits);
const clock = (date) => new Date(date || Date.now()).toTimeString().slice(0, 8);
function duration(seconds) {
  if (seconds === null || seconds === undefined || !Number.isFinite(seconds)) return "–";
  seconds = Math.max(0, Math.round(seconds));
  if (seconds < 60) return `${seconds}s`;
  const m = Math.floor(seconds / 60), s = seconds % 60;
  if (m < 60) return `${m}m ${String(s).padStart(2, "0")}s`;
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
}
const colour = (index) => `var(--c${(index % 5) + 1})`;
const pill = (status) => el("span", { class: "pill s-" + status }, status);

// --- the API, and a record of every call ------------------------------------------------

async function api(method, path, body) {
  const entry = { at: Date.now(), method, path, status: null, ms: null };
  activity.push(entry);
  if (activity.length > 400) activity.shift();
  drawActivity();
  const started = performance.now();
  let response, data = null;
  try {
    response = await fetch(path, {
      method,
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    try { data = await response.json(); } catch (_) { /* empty body */ }
  } catch (error) {
    entry.status = "down"; entry.ms = performance.now() - started; drawActivity();
    throw new Error("The API server cannot be reached. Is it running? (run_api_server.bat)");
  }
  entry.status = response.status; entry.ms = performance.now() - started;
  drawActivity();
  if (!response.ok) {
    const error = new Error((data && data.error) || response.status + " " + response.statusText);
    error.status = response.status;
    throw error;
  }
  return data;
}

// Something the page did that is not a call: shown in the activity log too.
function event(text) {
  activity.push({ at: Date.now(), method: "•", path: text, status: "info", ms: null });
  drawActivity();
}

// --- light Markdown: the only formatting the prompts allow --------------------------------

function md(text) {
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, "$1<i>$2</i>");
  const out = [];
  let list = null, para = [];
  const flush = () => {
    if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>");
    para = [];
    if (list) out.push(`<${list.tag}>` + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`);
    list = null;
  };
  for (const raw of String(text || "").replace(/\r/g, "").split("\n")) {
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/), number = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (!line.trim()) { flush(); continue; }
    if (bullet || number) {
      const tag = bullet ? "ul" : "ol";
      if (para.length || (list && list.tag !== tag)) flush();
      if (!list) list = { tag, items: [] };
      list.items.push((bullet || number)[1]);
      continue;
    }
    if (list) flush();
    para.push(line.replace(/^#+\s*/, ""));
  }
  flush();
  return out.join("");
}

// --- the transcript ---------------------------------------------------------------------

function agentSays(message, extra = {}) {
  S.transcript.push(Object.assign({ who: "agent", text: message.text, by: message.by, note: message.note,
                                    warn: Boolean(message.fallback && message.note), at: Date.now() }, extra));
  save();
  drawTranscript();
}
function userSays(text) {
  S.transcript.push({ who: "me", text, at: Date.now() });
  save();
  drawTranscript();
}
function marker(text) {
  S.transcript.push({ who: "event", text, at: Date.now() });
  save();
  drawTranscript();
}
const words = (name) => (config && config.words && config.words[name]) || "";
const plain = (text) => ({ text, by: "built-in wording", note: null });

// What the model is sent as the conversation so far.
function history() {
  return S.transcript.filter((m) => m.who !== "event")
    .map((m) => ({ role: m.who === "me" ? "user" : "assistant", content: m.text }));
}

let thinking = false;
function drawTranscript() {
  const box = $("transcript");
  box.replaceChildren(...S.transcript.map((m) => {
    if (m.who === "event") return el("div", { class: "msg event" }, m.text);
    const me = m.who === "me";
    return el("div", { class: "msg" + (me ? " me" : "") },
      el("div", { class: "who" }, me ? "You" : "Guide",
         !me && m.by ? el("span", { class: "by", title: m.by }, "· " + m.by) : null,
         el("span", { class: "by" }, clock(m.at).slice(0, 5))),
      el("div", { class: "bubble", html: md(m.text) }),
      m.note ? el("div", { class: "note" + (m.warn ? " warn" : "") }, m.note) : null);
  }), ...(thinking ? [el("div", { class: "msg" }, el("div", { class: "who" }, "Guide"),
    el("div", { class: "bubble" }, el("span", { class: "typing", "aria-label": "thinking" }, el("i"), el("i"), el("i"))))] : []));
  box.scrollTop = box.scrollHeight;
}

// One step of the conversation at a time: nothing else can be pressed while
// the guide is answering.
async function step(work) {
  if (busy) return;
  busy = true; thinking = true;
  drawTranscript(); drawAction(); $("send").disabled = true;
  try {
    await work();
  } catch (error) {
    agentSays(plain("Something went wrong: " + error.message), { note: "The step can be tried again.", warn: true });
  } finally {
    busy = false; thinking = false;
    $("send").disabled = false;
    drawTranscript(); drawAction(); drawBoard();
  }
}

function setStage(stage) {
  S.stage = stage;
  S.stamps[STAGE_OF[stage] || stage] = S.stamps[STAGE_OF[stage] || stage] || Date.now();
  save();
  drawAction(); drawBoard();
}

// --- the steps --------------------------------------------------------------------------

function agentChoice() {
  return { provider: $("provider").value, model: $("model").value.trim() || undefined,
           base_url: $("baseUrlRow").hidden ? undefined : ($("baseUrl").value.trim() || undefined) };
}
const mock = () => S.mock === null ? $("mock").checked : S.mock;

function intro() {
  step(async () => {
    S.stamps.intro = Date.now();
    const reply = await api("POST", "/agent/intro", { agent: agentChoice(), mock: $("mock").checked });
    agentSays(reply.message);
    setStage("intro");
  });
}

function notYet() {
  userSays("Not yet.");
  agentSays(plain(words("not_yet")));
}

function yes() {
  userSays("Yes, let's start!");
  agentSays(plain(words("ask_dataset")));
  setStage("dataset");
}

function datasetPayload() {
  if (datasetMode === "demo") {
    const chosen = document.querySelector('input[name="demo"]:checked');
    if (!chosen) throw new Error("Pick one of the demo datasets first.");
    return { file: chosen.value };
  }
  if (datasetMode === "upload") {
    if (!pendingFile) throw new Error("Choose or drop a file first.");
    return { text: pendingFile.text, name: pendingFile.name };
  }
  const text = $("paste").value;
  if (!text.trim()) throw new Error("Paste some records into the box first.");
  return { text, name: "pasted" };
}

function analyse() {
  let dataset;
  try { dataset = datasetPayload(); }
  catch (error) { $("datasetHelp").textContent = error.message; $("datasetHelp").className = "help error"; return; }
  const lines = dataset.text ? dataset.text.split(/\r?\n/).filter((l) => l.trim()).length : null;
  userSays(dataset.file ? `Let's use the demo dataset **${dataset.file}**.`
    : dataset.name === "pasted" ? `Here's my dataset (${lines} pasted line${lines === 1 ? "" : "s"}).`
    : `Here's my file **${dataset.name}** (${lines} line${lines === 1 ? "" : "s"}).`);
  step(async () => {
    event("reading the dataset");
    let reply;
    try {
      reply = await api("POST", "/agent/analyse", { agent: agentChoice(), dataset });
    } catch (error) {
      if (error.status === 400) { agentSays(plain(error.message + "\n\n" + words("instructions").dataset)); return; }
      throw error;
    }
    S.dataset = dataset;
    S.analysis = reply.analysis;
    S.sharedFile = reply.shared_file;
    agentSays(reply.message);
    setStage(reply.analysis.usable ? "analysis" : "dataset");
  });
}

function anotherDataset() {
  userSays("I'd like to choose another dataset.");
  agentSays(plain(words("another_dataset")));
  S.analysis = null; S.dataset = null;
  setStage("dataset");
}

function askWait(again = false) {
  if (!again) userSays("Use this dataset.");
  S.mock = $("mock").checked;
  step(async () => {
    const reply = await api("POST", "/agent/wait", { agent: agentChoice(), records: S.analysis.records,
                                                     mock: mock(), history: history() });
    S.choices = reply.choices;
    S.recommended = reply.recommended;
    agentSays(reply.message);
    setStage("wait");
  });
}

// A wait chosen, by button or in words: the plan comes back from the agent,
// read back before anything starts.
async function planFor(epochs) {
  if (!S.dataset || (!S.dataset.file && !S.dataset.text)) {
    agentSays(plain("I no longer have your dataset in this browser -- please give it to me again."));
    setStage("dataset");
    return;
  }
  const reply = await api("POST", "/agent/plan", { dataset: S.dataset, epochs, mock: mock() });
  S.epochs = reply.epochs;
  S.estimate = reply.estimate;
  S.plan = reply.trainings;
  agentSays(reply.message);
  setStage("confirm");
}

function chooseWait(choice) {
  userSays(`${choice.label} — ${choice.epochs} epochs (${choice.time}).`);
  step(() => planFor(choice.epochs));
}

async function interpretWait(text) {
  const reply = await api("POST", "/agent/interpret", { agent: agentChoice(), records: S.analysis.records,
                                                        text, mock: mock() });
  if (!reply.epochs) return false;            // not an answer: a question, for the guide
  agentSays(reply.message);
  await planFor(reply.epochs);
  return true;
}

function changeWait() {
  userSays("Let me pick a different wait.");
  S.plan = null;
  setStage("wait");
}

function startTraining() {
  userSays("Start training!");
  step(async () => {
    const queued = [];
    for (const body of S.plan) {
      event(`queueing ${body.name}`);
      try {
        const reply = await api("POST", "/loras", body);
        queued.push({ id: reply.lora.id, name: reply.lora.name, rank: body.settings.rank,
                      queue_position: reply.training.queue_position });
      } catch (error) {
        agentSays(plain(`I couldn't queue **${body.name}**: ${error.message}`));
      }
    }
    if (!queued.length) { setStage("confirm"); return; }
    S.loras = queued;
    S.startedAt = Date.now();
    S.finishedAt = null;
    S.debriefed = false;
    details = {}; logText = {}; queuedSince = null;
    logFor = queued[0].id;
    marker(`training queued · ${queued.length} LoRA${queued.length === 1 ? "" : "s"}`);
    setStage("training");
    const reply = await api("POST", "/agent/started", { agent: agentChoice(), trainings: queued, epochs: S.epochs,
                                                        estimate: S.estimate, mock: mock(), history: history() });
    agentSays(reply.message);
    poll();
  });
}

function stopTraining() {
  userSays("Please stop the training.");
  step(async () => {
    for (const one of S.loras) {
      const d = details[one.id];
      if (d && FINAL.includes(d.status)) continue;
      try { await api("POST", `/loras/${one.id}/cancel`); } catch (error) { event(`${one.name}: ${error.message}`); }
    }
    agentSays(plain(words("stopped")));
    poll();
  });
}

async function debrief() {
  S.debriefed = true;
  S.finishedAt = S.finishedAt || Date.now();
  marker("training finished");
  await step(async () => {
    drawBoard();
    const reply = await api("POST", "/agent/debrief", { agent: agentChoice(), loras: S.loras.map((one) => one.id),
                                                        mock: mock(), history: history() });
    agentSays(reply.message);
    setStage("done");
  });
}

function trainAgain() {
  userSays("Let's train again with the same data.");
  S.loras = []; S.plan = null; S.epochs = null; S.estimate = null; S.startedAt = null; S.finishedAt = null;
  S.stamps.training = null; S.stamps.done = null; S.debriefed = false;
  details = {}; logText = {};
  askWait(true);                               // the estimates again, for today's practice-run setting
}

function newDataset() {
  userSays("Let's start with a new dataset.");
  const transcript = S.transcript;
  S = fresh();
  S.transcript = transcript;
  S.stamps.intro = Date.now();
  details = {}; logText = {}; pendingFile = null;
  marker("new dataset");
  agentSays(plain(words("ask_dataset")));
  setStage("dataset");
}

function startOver() {
  clearTimeout(pollTimer);
  S = fresh();
  details = {}; logText = {}; pendingFile = null; datasetMode = "paste";
  save();
  drawTranscript(); drawBoard();
  if (key && config) intro();
}

// Words typed into the composer: an answer to the current step where one fits,
// otherwise a question for the guide.
function send(text) {
  userSays(text);
  step(async () => {
    if ((S.stage === "wait" || S.stage === "confirm") && S.analysis && await interpretWait(text)) return;
    const reply = await api("POST", "/agent/chat", { agent: agentChoice(), message: text,
                                                     stage: S.stage, context: chatContext(), history: history().slice(0, -1) });
    agentSays(reply.message);
  });
}

function chatContext() {
  const context = {};
  if (S.analysis) context.dataset = { name: S.analysis.name, records: S.analysis.records, stats: S.analysis.stats,
                                      problems: S.analysis.problems };
  if (S.plan) context.plan = { loras: S.plan.map((p) => ({ name: p.name, rank: p.settings.rank })), epochs: S.epochs,
                               estimate: S.estimate && S.estimate.time, mock: mock() };
  if (S.loras.length) context.progress = S.loras.map((one) => {
    const d = details[one.id] || {}, p = d.progress || {};
    return { name: one.name, status: d.status, step: p.step ?? d.steps, of: p.of ?? d.max_steps,
             loss: p.loss ?? d.final_loss };
  });
  return context;
}

// --- watching the training ------------------------------------------------------------------

async function poll() {
  clearTimeout(pollTimer);
  if (!S.loras.length) return;
  for (const one of S.loras) {
    const known = details[one.id];
    if (known && FINAL.includes(known.status) && known._settled) continue;
    try {
      const { lora } = await api("GET", `/loras/${one.id}`);
      const before = known && known.status;
      // One more read after it settles: the worker closes the training row a moment later.
      lora._settled = FINAL.includes(lora.status) && before === lora.status;
      details[one.id] = lora;
      if (before && before !== lora.status) {
        event(`${one.name}: ${before} → ${lora.status}`);
        if (lora.status === "training" && logFor !== one.id && (!details[logFor] || FINAL.includes(details[logFor].status))) logFor = one.id;
      }
    } catch (error) {
      if (error.status === 404) details[one.id] = { status: "missing", _settled: true, name: one.name };
    }
  }
  if (logFor !== null) {
    try { logText[logFor] = (await api("GET", `/loras/${logFor}/log?lines=120`)).lines; } catch (_) { /* gone */ }
  }
  const queued = S.loras.every((one) => (details[one.id] || {}).status === "queued");
  queuedSince = queued ? (queuedSince || Date.now()) : null;
  drawBoard();
  const done = S.loras.every((one) => details[one.id] && FINAL.includes(details[one.id].status));
  // The debrief waits its turn if the guide is busy answering something else.
  if (done && !S.debriefed) { if (busy) pollTimer = setTimeout(poll, 1000); else debrief(); return; }
  if (!done) pollTimer = setTimeout(poll, 1500);
}

// Time: elapsed since the plan was queued, and what is left -- the running
// LoRA's own pace for its remaining steps, the estimate for the ones behind it.
function timing() {
  if (!S.startedAt) return { elapsed: null, left: null, fraction: 0 };
  const now = S.finishedAt || Date.now();
  let left = 0, doneSteps = 0, allSteps = 0;
  const est = S.estimate || {};
  for (const one of S.loras) {
    const d = details[one.id] || {}, p = d.progress || {};
    const of = p.of || d.max_steps || est.steps || 1;
    allSteps += of;
    if (FINAL.includes(d.status)) { doneSteps += of; continue; }
    const step = p.step || 0;
    doneSteps += step;
    if (d.status === "training" && step > 0 && p.seconds) left += p.seconds / step * (of - step);
    else left += est.seconds_per_lora || 0;
  }
  const fraction = allSteps ? doneSteps / allSteps : 0;
  return { elapsed: (now - S.startedAt) / 1000, left: S.finishedAt ? 0 : left, fraction };
}

// --- the left side: what the current step asks for ----------------------------------------------

function drawAction() {
  const box = $("action");
  if (!key || !config) return box.replaceChildren();
  const lock = busy;
  const ask = (text) => el("div", { class: "ask" }, text, busy ? el("span", { class: "typing" }, el("i"), el("i"), el("i")) : null);
  const stage = S.stage;
  let content = [];
  if (!S.transcript.length) content = [];
  else if (stage === "intro") content = [ask("Ready to start?"),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: yes, disabled: lock }, "Yes, let's start"),
      el("button", { class: "lg", onclick: notYet, disabled: lock }, "Not yet"))];
  else if (stage === "dataset") content = datasetControls(lock, ask);
  else if (stage === "analysis") content = [ask("Happy with this dataset?"),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: () => askWait(), disabled: lock }, "Use this dataset"),
      el("button", { class: "lg", onclick: anotherDataset, disabled: lock }, "Choose another"))];
  else if (stage === "wait") content = [ask("How long can you wait?"),
    el("div", { class: "options" }, (S.choices || []).map((choice) =>
      el("button", { type: "button", class: "option choice", disabled: lock, onclick: () => chooseWait(choice) },
        el("b", {}, choice.label, S.recommended === choice.id ? el("span", { class: "tag rec", style: "margin-left:8px" }, "suggested") : null),
        el("span", { class: "time" }, choice.time),
        el("span", { class: "sub" }, `${choice.epochs} epochs · ${choice.estimate.steps} steps per LoRA — ${choice.blurb}`)))),
    el("p", { class: "help" }, "…or type your own answer below, like “about an hour” or “5 epochs”.")];
  else if (stage === "confirm") content = [ask("Start the training?"),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: startTraining, disabled: lock }, "Start training"),
      el("button", { class: "lg", onclick: changeWait, disabled: lock }, "Change"))];
  else if (stage === "training") {
    const { fraction } = timing();

async function readFile(file) {
  if (!file) return;
  if (file.size > 60 * 1024 * 1024) { pendingFile = null; drawAction(); $("datasetHelp").textContent = `${file.name} is over 60 MB.`; return; }
  const text = await file.text();
  pendingFile = { name: file.name, size: file.size, text, lines: text.split(/\r?\n/).filter((l) => l.trim()).length };
  event(`read ${file.name} (${pendingFile.lines} lines) in the browser`);
  drawAction();
}

// --- charts: hand-drawn SVG, coloured through the page's variables --------------------------

function drawing(width, height) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("class", "chart");
  const add = (tag, attrs, text) => {
    const node = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text !== undefined) node.textContent = text;
    svg.append(node);
    return node;
  };
  return { svg, add };
}
function hint(text) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", "title");
  node.textContent = text;
  return node;
}

function histogramChart(bins) {
  const W = 420, H = 150, L = 30, R = 8, T = 8, B = 24;
  const { svg, add } = drawing(W, H);
  if (!bins.length) return svg;
  const top = Math.max(...bins.map((b) => b.count), 1);
  const bw = (W - L - R) / bins.length;
  for (const k of [0, 0.5, 1]) {
    const y = T + (1 - k) * (H - T - B);
    add("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: "var(--line)", "stroke-dasharray": k ? "3 4" : "" });
    add("text", { x: L - 6, y: y + 3, "text-anchor": "end" }, Math.round(top * k));
  }
  bins.forEach((b, i) => {
    const h = b.count / top * (H - T - B);
    add("rect", { x: L + i * bw + 1.5, y: H - B - h, width: Math.max(1, bw - 3), height: Math.max(0, h), rx: 3, fill: "var(--c2)", opacity: .8 })
      .append(hint(`${b.low}–${b.high} words: ${b.count} answer(s)`));
  });
  add("text", { x: L, y: H - 8 }, bins[0].low + " words");
  add("text", { x: W - R, y: H - 8, "text-anchor": "end" }, bins[bins.length - 1].high + " words");
  return svg;
}

function waitChart(choices, longest) {
  const W = 900, row = 30, L = 130, R = 110;
  const H = row * choices.length + 6;
  const { svg, add } = drawing(W, H);
  const chosen = S.epochs;
  choices.forEach((c, i) => {
    const y = 4 + i * row;
    const w = Math.max(3, c.estimate.seconds / longest * (W - L - R));
    const on = chosen === c.epochs;
    add("text", { x: L - 10, y: y + 15, "text-anchor": "end", fill: on ? "var(--ink)" : "var(--muted)", "font-weight": on ? 600 : 400, "font-size": 12 }, c.label);
    add("rect", { x: L, y: y + 4, width: W - L - R, height: 16, rx: 4, fill: "var(--code)" });
    add("rect", { x: L, y: y + 4, width: w, height: 16, rx: 4, fill: on ? "var(--accent)" : "var(--c1)", opacity: on ? 1 : .45 })
      .append(hint(`${c.epochs} epochs · ${c.estimate.steps} steps per LoRA · ${c.time}`));
    add("text", { x: L + w + 8, y: y + 15, "font-size": 11 }, `${c.epochs} ep · ${duration(c.estimate.seconds)}`);
  });
  return svg;
}

function lossChart(series) {
  const W = 560, H = 240, L = 40, R = 12, T = 10, B = 26;
  const { svg, add } = drawing(W, H);
  const all = series.flatMap((s) => s.points);
  const last = Math.max(...all.map((p) => p.step), 1);
  const top = Math.max(...all.map((p) => p.loss)) * 1.08 || 1;
  const x = (step) => L + (step / last) * (W - L - R);
  const y = (v) => T + (1 - v / top) * (H - T - B);
  for (const k of [0, 0.25, 0.5, 0.75, 1]) {
    add("line", { x1: L, x2: W - R, y1: y(top * k), y2: y(top * k), stroke: "var(--line)", "stroke-dasharray": k ? "3 4" : "" });
    add("text", { x: L - 6, y: y(top * k) + 3, "text-anchor": "end" }, (top * k).toFixed(top * k >= 10 ? 0 : 2));
  }
  for (const s of series) {
    if (!s.points.length) continue;
    add("polyline", { fill: "none", stroke: s.colour, "stroke-width": 2, "stroke-linejoin": "round",
                      points: s.points.map((p) => `${x(p.step)},${y(p.loss)}`).join(" ") });
    const end = s.points[s.points.length - 1];
    add("circle", { cx: x(end.step), cy: y(end.loss), r: 3.5, fill: s.colour })
      .append(hint(`${s.name}\nstep ${end.step} · loss ${fmt(end.loss, 4)}`));
  }
  add("text", { x: L, y: H - 8 }, "step 0");
  add("text", { x: W - R, y: H - 8, "text-anchor": "end" }, "step " + last);
  return svg;
}

// --- the model the guide talks through ------------------------------------------------------

function fillProviders() {
  const saved = recall("agent", true) || {};
  $("provider").replaceChildren(...config.providers.map((p) =>
    el("option", { value: p.name }, p.label + (p.ready ? "" : ` — needs ${p.key_env}`))));
  $("provider").value = config.providers.some((p) => p.name === saved.provider) ? saved.provider : config.default.provider;
  $("model").value = saved.provider === $("provider").value ? (saved.model || "") : (config.default.model || "");
  $("baseUrl").value = saved.provider === $("provider").value ? (saved.base_url || "") : "";
  $("mock").checked = recall("mock") ? recall("mock") === "1" : config.mock;
  providerChanged(false);
}

function provider() { return config.providers.find((p) => p.name === $("provider").value); }

function providerChanged(clear = true) {
  const p = provider();
  if (clear) { $("model").value = ""; $("baseUrl").value = ""; }
  $("baseUrlRow").hidden = !(p.local && p.kind === "openai");
  $("baseUrl").placeholder = p.base_url || "";
  $("model").placeholder = p.model ? p.model : p.kind === "scripted" ? "no model" : "the first model it lists";
  $("model").disabled = p.kind === "scripted";
  $("refreshModels").disabled = p.kind === "scripted";
  rememberAgent();
  loadModels();
}

function rememberAgent() {
  remember("agent", { provider: $("provider").value, model: $("model").value.trim(), base_url: $("baseUrl").value.trim() });
  drawChip();
}

let modelState = { ok: null, text: "" };
async function loadModels() {
  const p = provider();
  if (p.kind === "scripted") { modelState = { ok: true, text: "The guide uses its built-in wording; no model is asked." }; return drawChip(); }
  if (!p.ready) { modelState = { ok: false, text: `Set ${p.key_env} in the environment the API server runs in, then restart it. Until then the guide uses its built-in wording.` }; return drawChip(); }
  modelState = { ok: null, text: "Asking for its models…" }; drawChip();
  const query = new URLSearchParams({ provider: p.name });
  if (!$("baseUrlRow").hidden && $("baseUrl").value.trim()) query.set("base_url", $("baseUrl").value.trim());
  try {
    const reply = await api("GET", "/agent/models?" + query);
    $("modelList").replaceChildren(...reply.models.map((m) => el("option", { value: m })));
    const using = $("model").value.trim() || reply.default || reply.models[0];
    modelState = { ok: true, using, text: `${reply.models.length} model(s) at ${reply.base_url}.` + (using ? ` Talking to ${using}.` : "") };
  } catch (error) {
    modelState = { ok: false, text: error.message + " — the guide falls back to its built-in wording." };
  }
  drawChip();
}

function drawChip() {
  const p = provider();
  if (!p) return;
  const model = $("model").value.trim() || (p.kind === "scripted" ? "" : modelState.using || p.model || "auto");
  $("modelChip").querySelector("span").textContent = p.label.replace(/ \(.*\)$/, "") + (model ? " · " + model : "");
  $("modelChip").className = "sm ghost model-chip " + (modelState.ok === true ? "up" : modelState.ok === false ? "down" : "");
  $("modelChip").title = modelState.text;
  $("providerHelp").textContent = modelState.text;
  $("providerHelp").className = "help" + (modelState.ok === false ? " error" : "");
  $("mockTag").hidden = !(S.mock === null ? $("mock").checked : S.mock);
}

// --- health, key, start -------------------------------------------------------------------------

async function refreshHealth() {
  try {
    const health = await (await fetch("/health")).json();
    const loaded = health.models.filter((m) => m.loaded);
    $("health").textContent = loaded.length ? "API up · " + loaded.map((m) => m.base_model).join(", ") + " loaded" : "API up";
    $("health").className = "health up";
  } catch (_) {
    $("health").textContent = "API unreachable";
    $("health").className = "health down";
  }
}

function keyGate(message) {
  $("action").replaceChildren();
  $("transcript").replaceChildren(el("div", { class: "gate" },
    el("h3", {}, "Hi! Let's get you connected"),
    el("p", { class: "muted" }, "I train LoRAs through this server's API, so I need your API key. Create one on the server with ",
      el("code", {}, "python -m async_api.users add <name>"), "."),
    el("form", { onsubmit: (e) => { e.preventDefault(); useKey($("keyInput").value.trim()); } },
      el("label", { for: "keyInput" }, "API key"),
      el("div", { style: "display:flex;gap:8px" },
        el("input", { id: "keyInput", type: "password", autocomplete: "off", placeholder: "paste it here" }),
        el("button", { class: "primary", type: "submit" }, "Connect"))),
    el("p", { class: message ? "help error" : "help", id: "keyHelp" }, message || "It is kept in this browser only, shared with the console page.")));
  $("composer").hidden = true;
  $("changeKey").hidden = true;
  drawBoard();
  setTimeout(() => $("keyInput") && $("keyInput").focus(), 0);
}

async function useKey(value) {
  key = value;
  if (!key) return keyGate("Paste a key first.");
  try {
    config = await api("GET", "/agent/config");
  } catch (error) {
    key = "";
    return keyGate(error.status === 401 ? "That key is not known to this server." : error.message);
  }
  rememberKey(key);
  $("changeKey").hidden = false;
  $("composer").hidden = false;
  fillProviders();
  const saved = recall("session", true);
  if (saved && saved.transcript && saved.transcript.length) {
    S = Object.assign(fresh(), saved);
    drawTranscript(); drawAction(); drawBoard();
    if (S.loras.length && S.stage === "training") { marker("reconnected — watching the training again"); poll(); }
    else if (S.loras.length) poll();
  } else {
    drawBoard();
    intro();
  }
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("say").value.trim();
  if (!text || busy || !config) return;
  $("say").value = "";
  $("say").style.height = "";
  send(text);
});
$("say").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("say").addEventListener("input", () => { $("say").style.height = ""; $("say").style.height = Math.min(140, $("say").scrollHeight) + "px"; });
$("modelChip").addEventListener("click", () => { $("settings").hidden = !$("settings").hidden; });
$("provider").addEventListener("change", () => providerChanged(true));
$("model").addEventListener("change", () => { rememberAgent(); loadModels(); });
$("baseUrl").addEventListener("change", () => { rememberAgent(); loadModels(); });
$("refreshModels").addEventListener("click", loadModels);
$("mock").addEventListener("change", () => {
  remember("mock", $("mock").checked ? "1" : "0");
  if (!S.loras.length) S.mock = null;           // it counts from the next step, until a training starts
  drawChip(); drawBoard();
});
$("restart").addEventListener("click", () => { if (!busy) startOver(); });
$("changeKey").addEventListener("click", () => { clearTimeout(pollTimer); keyGate(); });

// The clock on the right keeps moving between polls.
tickTimer = setInterval(() => { if (S.startedAt && !S.finishedAt) { drawBoard(); if (S.stage === "training") drawAction(); } }, 1000);
refreshHealth();
setInterval(refreshHealth, 10000);
const stored = recallKey();
if (stored) useKey(stored); else keyGate();
</script>
</body>
</html>
