      el("div", { class: "buttons" },
        el("button", { class: "danger", onclick: stopTraining, disabled: lock }, "Stop training"))];
  } else if (stage === "done") content = [ask("What next?"),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: goBlend, disabled: lock }, "Blend them"),
      el("button", { class: "lg", onclick: trainAgain, disabled: lock }, "Train again"),
      el("button", { class: "lg ghost", onclick: newDataset, disabled: lock }, "New dataset"))];
  else if (stage === "blend") content = blendControls(lock, ask);
  else if (stage === "blend_confirm") content = [ask("Start the search?"),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: startBlend, disabled: lock }, "Start the search"),
      el("button", { class: "lg", onclick: changeBlend, disabled: lock }, "Change")),
    el("p", { class: "help" }, words("blend_hint"))];
  else if (stage === "blending") {
    const p = (S.blend.status || {}).progress || {};
    const fraction = p.generations_expected ? (p.generations_scored || 0) / p.generations_expected : 0;
    content = [ask("Searching — nothing to do but watch"),
      el("div", { class: "meter big live" }, el("i", { style: `width:${Math.max(2, fraction * 100)}%` })),
      el("div", { class: "buttons" },
        el("button", { class: "danger", onclick: stopBlendNow, disabled: lock }, "Stop the search"))];
  } else if (stage === "blended") content = searchFinished() ? [ask("What next?"),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: testAll, disabled: lock }, "Test all blends"),
      el("button", { class: "lg", onclick: skipTesting, disabled: lock }, "Skip testing"),
      el("button", { class: "lg", onclick: blendAgain, disabled: lock }, "Search again"),
      el("button", { class: "lg ghost", onclick: pickSearch, disabled: lock }, "Use another search"))]
    // A search that did not finish has nothing to test yet: carry it on, or use one that did.
    : [ask(`The search is ${(S.blend.status || { job: {} }).job.status || "not finished"}`),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: resumeSearch, disabled: lock || !S.blend.job }, "Resume the search"),
      el("button", { class: "lg", onclick: pickSearch, disabled: lock }, "Use a finished search"),
      el("button", { class: "lg", onclick: blendAgain, disabled: lock }, "Search again"))];
  else if (stage === "searches") content = searchPicker(lock, ask);
  else if (stage === "testing") {
    const f = testForm || {};
    const fraction = f.blends ? (f.tested || 0) / f.blends : 0;
    content = [ask("Testing — nothing to do but watch"),
      el("div", { class: "meter big live" }, el("i", { style: `width:${Math.max(2, fraction * 100)}%` })),
      el("p", { class: "help" }, f.blends ? `${f.tested || 0} of ${f.blends} blends tested` : "Waiting for the worker…"),
      el("div", { class: "buttons" },
        el("button", { class: "danger", onclick: stopTestingNow, disabled: lock }, "Stop the testing"))];
  } else if (stage === "tested") content = [ask("Which blend is the best?"),
    blendPicker(lock), verifyQuestions(lock),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: verifyNow, disabled: lock || !pickedBlend() }, "Verify it"),
      el("button", { class: "lg", onclick: goLiveNow, disabled: lock || !pickedBlend() }, "Go live now"),
      untested() ? el("button", { class: "lg ghost", onclick: testAll, disabled: lock }, "Test all blends") : null),
    el("p", { class: "help" }, words("release_hint"))];
  else if (stage === "verifying") content = [ask("Verifying — nothing to do but watch"),
    el("div", { class: "meter big live" }, el("i", { style: "width:100%" })),

  else if (stage === "verified") content = [ask("Which model goes live?"),
    blendPicker(lock),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: goLiveNow, disabled: lock || !pickedBlend() }, "Go live"),
      el("button", { class: "lg", onclick: verifyAnother, disabled: lock }, "Verify another")),
    el("p", { class: "help" }, words("release_hint"))];
  else if (stage === "live") {
    const L = S.release.live || {};
    const input = el("textarea", { id: "livePrompt", rows: 3, disabled: lock || L.asking,
                                   placeholder: "Ask the live blend something…" });
    input.value = drawAction.live || "";
    input.addEventListener("input", (e) => { drawAction.live = e.target.value; });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) askLive(); });
    content = [ask(`Blend #${(L.deployment || {}).individual ?? "?"} is live — try it`), input,
      el("div", { class: "buttons" },
        el("button", { class: "primary lg", onclick: askLive, disabled: lock || L.asking }, L.asking ? "Answering…" : "Ask it"),
        el("button", { class: "lg", onclick: chooseAgain, disabled: lock }, "Choose another"),
        el("button", { class: "lg danger", onclick: takeDown, disabled: lock || !L.deployment }, "Take it down")),
      el("p", { class: "help" }, "Ctrl+Enter asks. The answer streams in on the right.")];
  }
  box.replaceChildren(...content);
}

// Whether the search on screen got to its end -- only then can its blends be
// tested, verified and put live (the API refuses anything else).
const searchFinished = () => Boolean(S.blend.job && S.blend.status && S.blend.status.job.status === "done");

// The user's finished searches, any of which the rest of the guide can work on.
function searchPicker(lock, ask) {
  const jobs = S.searches || [];
  if (!jobs.length) return [ask("Your finished searches"), el("p", { class: "muted" }, words("no_searches")),
    el("div", { class: "buttons" }, el("button", { class: "lg", onclick: backFromSearches, disabled: lock }, "Back"))];
  const chosen = drawAction.search ?? jobs[0].id;
  return [ask("Which search?"),
    el("div", { class: "options scroll", style: "max-height:300px" }, jobs.map((job) => {
      const best = (job.summary || {}).best, conf = (job.summary || {}).settings || {};
      return el("label", { class: "option" },
        el("input", { type: "radio", name: "search", checked: job.id === chosen, disabled: lock,
                      onchange: () => { drawAction.search = job.id; } }),
        el("b", {}, `job ${job.id} · ${job.label || "no label"}`,
          conf.TEMPLATE === "template_code_mocked.py" ? el("span", { class: "tag mock", style: "margin-left:6px" }, "mock") : null),
        el("span", { class: "side" }, best ? `best ${fmt(best.fitness)}` : "no score"),
        el("span", { class: "sub" }, `finished ${(job.finished_at || "").replace("T", " ").slice(0, 16)}` +
          ` · ${1 + (conf.GENERATIONS || 0)} rounds × ${conf.COUNT ?? "?"} blends`));
    })),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: () => useSearch(drawAction.search ?? jobs[0].id), disabled: lock }, "Use this search"),
      el("button", { class: "lg", onclick: backFromSearches, disabled: lock }, "Back"))];
}

function pickSearch() {
  userSays("Let me pick one of my finished searches.");
  step(async () => {
    S.searchesFrom = S.stage;
    S.searches = (await api("GET", "/jobs?status=done")).jobs.filter((job) => job.summary);
    drawAction.search = null;
    agentSays(plain(words(S.searches.length ? "pick_search" : "no_searches")));
    setStage("searches");
  });
}

function backFromSearches() {
  setStage(S.searchesFrom && S.searchesFrom !== "searches" ? S.searchesFrom : "blend");
}

// Adopt one of the user's jobs as the search on screen, then read it back the
// way a search that just finished is: the watch sees it done and debriefs it.
function useSearch(id) {
  const job = (S.searches || []).find((one) => one.id === id);
  if (!job) return;
  userSays(`Use search ${job.id}${job.label ? " (" + job.label + ")" : ""}.`);
  resetBlend();
  Object.assign(S.blend, { job: { id: job.id, label: job.label, queue_position: null },
                           status: { job, progress: null }, startedAt: null, finishedAt: null, debriefed: false });
  marker(`using search · job ${job.id}`);
  setStage("blending");
  pollBlend();
}

// POST /jobs/{id}/resume: a stopped, cancelled or failed search carried on.
function resumeSearch() {
  userSays("Resume the search.");
  step(async () => {
    const job = S.blend.job;
    try {
      await api("POST", `/jobs/${job.id}/resume`);
    } catch (error) {
      if (error.status !== 409) throw error;
      agentSays(plain(`I can't resume it: ${error.message}`));
      return;
    }
    resetRelease();
    Object.assign(S.blend, { result: null, debriefed: false, finishedAt: null, startedAt: S.blend.startedAt || Date.now() });
    marker(`search resumed · job ${job.id}`);
    agentSays(plain(words("blend_resumed")));
    setStage("blending");
    pollBlend();
  });
}

// A testing pass could still add scores: some blend that ran has none yet.
function untested() {
  const f = S.release.found;
  return f && f.testing.records && f.testing.tested < f.testing.blends;
}

// The search's blends to choose from, best on the new questions first.
function blendPicker(lock) {
  const found = S.release.found;
  if (!found) return el("p", { class: "muted" }, "Reading the search's blends…");
  const picked = releaseOf().individual;
  return el("div", { class: "options scroll", style: "max-height:260px" }, found.blends.map((one) => {
    const bad = one.state === "BAD";
    return el("label", { class: "option" + (bad ? " blocked" : ""), title: bad ? "PEFT cannot build this one" : one.chromosome },
      el("input", { type: "radio", name: "pick", checked: one.number === picked, disabled: lock || bad,
                    onchange: () => pickBlend(one.number) }),
      el("b", {}, `#${one.number} `, el("span", { class: "muted", style: "font-weight:400" }, one.formula)),
      el("span", { class: "side" }, one.tested === null ? "not tested" : `tested ${fmt(one.tested)}`),
      el("span", { class: "sub" }, `search ${fmt(one.quality)} · ${one.loras.join(", ") || "–"}`));
  }));
}

// What the verification asks: one of the search's own splits, a demo
// dataset, or the data one of the blend's LoRAs was trained on.
function verifyQuestions(lock) {
  const found = S.release.found || { splits: {} }, r = releaseOf(), limits = config.release;
  const value = !r.questions ? "" : r.questions.split ? "split:" + r.questions.split
    : r.questions.file ? "file:" + r.questions.file : "lora:" + r.questions.lora;

  const select = el("select", { id: "vSource", disabled: lock, onchange: (e) => {
    const [kind, ...rest] = e.target.value.split(":"), name = rest.join(":");
    setRelease({ questions: !kind ? null : { [kind]: kind === "lora" ? Number(name) : name } });
  } },
    el("option", { value: "" }, "the default (validation, else testing)"),
    el("optgroup", { label: "The search's own questions" },
      Object.entries(found.splits).map(([split, records]) => el("option", { value: "split:" + split }, `${split} — ${records}`))),
    el("optgroup", { label: "A demo dataset" },
      (config.datasets || []).filter((one) => one.usable).map((one) => el("option", { value: "file:" + one.file }, one.file))),
    mine.length ? el("optgroup", { label: "A LoRA's own training data" },
      mine.map((one) => el("option", { value: "lora:" + one.id }, one.name))) : null);
  select.value = value;
  return el("div", { class: "knobs", style: "grid-template-columns: minmax(0, 2fr) minmax(0, 1fr)" },
    el("div", {}, el("label", { for: "vSource" }, "Verify on"), select),
    el("div", {}, el("label", { for: "vCount" }, "Questions"),
      el("input", { id: "vCount", type: "number", min: 1, max: limits.max_questions, step: 1, disabled: lock,
                    value: r.count ?? "", placeholder: r.questions && !r.questions.split ? String(limits.questions) : "all",
                    onchange: (e) => { const v = Math.round(Number(e.target.value));
                                       setRelease({ count: e.target.value === "" ? null : v >= 1 && v <= limits.max_questions ? v : r.count }); } })));
}

// The planned LoRAs' names, each editable before the training starts. The
// guide's name says what it learned, on what and when (settings.LORA_NAME);
// an edit is kept by rank, so a plan read back again keeps it.
const LORA_NAME = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;
function nameControls(lock) {
  if (!S.plan || !S.plan.length) return null;
  const rows = S.plan.map((body, i) => {
    const input = el("input", { id: "lname" + i, value: body.name, disabled: lock, autocomplete: "off", spellcheck: "false",
                                style: "font-family: var(--mono); font-size: 12px", "aria-label": `Name of the rank ${body.settings.rank} LoRA` });
    input.addEventListener("change", (e) => renameLora(i, e.target));
    return el("div", {}, el("label", { for: "lname" + i }, `Rank ${body.settings.rank}`), input);
  });
  return el("div", {}, el("div", { class: "knobs", style: "grid-template-columns: minmax(0, 1fr)" }, rows),
    el("p", { class: "help", id: "nameHelp" }, "The names are yours to change: letters, digits, '.', '_' or '-', up to 64."));
}

function renameLora(index, input) {
  const name = input.value.trim(), body = S.plan[index];
  const clash = S.plan.some((other, i) => i !== index && other.name === name);
  if (!LORA_NAME.test(name) || clash) {
    $("nameHelp").textContent = clash ? `Two LoRAs cannot both be called ${name}.`
      : "A name is 1–64 letters, digits, '.', '_' or '-', starting with a letter or digit.";
    $("nameHelp").className = "help error";
    input.value = body.name;
    return;
  }
  if (name === body.name) return;
  event(`renamed ${body.name} → ${name}`);
  body.name = name;
  S.nameEdits = Object.assign({}, S.nameEdits, { [body.settings.rank]: name });
  save();
  drawAction(); drawBoard();
}

// The blend step's controls: the user's ready LoRAs to tick (one base model,
// at most five), and the search's size.
function blendControls(lock, ask) {
  const b = blendOf(), limits = config.blend;
  const picked = S.blend.available.filter((one) => b.loras.includes(one.id));
  const model = picked.length ? picked[0].base_model : null;
  const list = S.blend.available.length ? S.blend.available.map((one) => {
    const on = b.loras.includes(one.id);
    const blocked = !on && ((model && one.base_model !== model) || b.loras.length >= limits.slots);
    return el("label", { class: "option" + (blocked ? " blocked" : ""),
                         title: blocked ? (model && one.base_model !== model ? "trained on another base model" : "a blend has five places") : one.dataset || "" },
      el("input", { type: "checkbox", checked: on, disabled: lock || blocked, onchange: (e) => toggleLora(one.id, e.target.checked) }),
      el("b", {}, one.name, one.practice_run ? el("span", { class: "tag mock", style: "margin-left:6px" }, "mock") : null),
      el("span", { class: "side" }, `rank ${one.rank ?? "?"}`),
      el("span", { class: "sub" }, `${one.base_model || "?"}${typeof one.final_loss === "number" ? ` · loss ${fmt(one.final_loss)}` : ""}${one.records ? ` · ${one.records} conversations` : ""}`));
  }) : [el("p", { class: "muted" }, "You have no ready LoRAs yet — train some first.")];
  const knob = (name, label, min, max) => el("div", {},
    el("label", { for: "k_" + name }, label),
    el("input", { id: "k_" + name, type: "number", min, max, step: 1, value: b[name], disabled: lock,
                  onchange: (e) => { const v = Math.round(Number(e.target.value)); if (v >= min && v <= max) setBlend({ [name]: v }); else e.target.value = b[name]; } }));
  return [ask("Which LoRAs shall I blend?"),
    el("div", { class: "options" }, list),
    el("div", { class: "knobs" },
      knob("generations", "Rounds after the first", 1, limits.max_generations),
      knob("population", "Blends each round", limits.min_population, limits.max_population),
      knob("questions", "Questions judged on", 1, limits.max_questions)),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: planBlendNow, disabled: lock || !b.loras.length }, "Plan the search"),
      el("button", { class: "lg", onclick: pickSearch, disabled: lock }, "Use a finished search"),
      el("button", { class: "lg ghost", onclick: newDataset, disabled: lock }, "Train more LoRAs")),
    el("p", { class: "help" }, words("blend_hint"))];
}

function datasetControls(lock, ask) {
  const tabs = el("div", { class: "seg", role: "tablist" }, [["paste", "Paste"], ["upload", "Upload a file"], ["demo", "Demo datasets"]]
    .map(([mode, label]) => el("button", { type: "button", class: datasetMode === mode ? "active" : "", disabled: lock,
                                           onclick: () => { datasetMode = mode; drawAction(); } }, label)));
  let pane;
  if (datasetMode === "paste") {
    pane = el("div", { class: "dataset-pane" },
      el("textarea", { id: "paste", rows: 7, spellcheck: "false", disabled: lock,
        placeholder: '{"messages": [{"role": "user", "content": "…"}, {"role": "assistant", "content": "…"}]}\n…one conversation per line. A JSON array, or CSV with question and answer columns, works too.' }),
      el("p", { class: "help" }, "One conversation per line. The assistant's turns are what the LoRAs learn."));
    const saved = drawAction.paste;
    if (saved) pane.querySelector("textarea").value = saved;
    pane.querySelector("textarea").addEventListener("input", (e) => { drawAction.paste = e.target.value; });
  } else if (datasetMode === "upload") {
    const input = el("input", { type: "file", accept: ".json,.jsonl,.csv,.tsv,.txt", hidden: true, onchange: (e) => readFile(e.target.files[0]) });
    const drop = el("label", { class: "drop" }, input,
      pendingFile ? [el("b", {}, pendingFile.name), el("span", {}, `${(pendingFile.size / 1024).toFixed(1)} KB · ${pendingFile.lines} lines — click to choose another`)]
        : [el("b", {}, "Drop a file here, or click to choose"), el("span", {}, ".jsonl / .json / .csv — up to 60 MB")]);
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); readFile(e.dataTransfer.files[0]); });
    pane = el("div", { class: "dataset-pane" }, drop);
  } else {
    const sets = (config.datasets || []);
    pane = el("div", { class: "dataset-pane options" }, sets.length ? sets.map((set) =>
      el("label", { class: "option", title: set.usable ? set.first || "" : "No answers to learn in this file" },
        el("input", { type: "radio", name: "demo", value: set.file, disabled: !set.usable || lock,
                      checked: drawAction.demo === set.file, onchange: () => { drawAction.demo = set.file; } }),
        el("b", {}, set.file),
        el("span", { class: "side" }, set.usable ? `${set.records} conversations` : "not trainable"),
        el("span", { class: "sub" }, set.usable ? (set.keywords.length ? set.keywords.join(" · ") : set.format)
                                                : "It has no assistant turns for a LoRA to learn."))) :
      el("p", { class: "muted" }, "The server has no shared datasets."));
  }
  return [ask("Give me your dataset"), tabs, pane,
    el("p", { class: "help", id: "datasetHelp" }),
    el("div", { class: "buttons" }, el("button", { class: "primary lg", onclick: analyse, disabled: lock }, "Analyse"))];
}

async function readFile(file) {
  if (!file) return;
  if (file.size > 60 * 1024 * 1024) { pendingFile = null; drawAction(); $("datasetHelp").textContent = `${file.name} is over 60 MB.`; return; }
  const text = await file.text();
  pendingFile = { name: file.name, size: file.size, text, lines: text.split(/\r?\n/).filter((l) => l.trim()).length };
  event(`read ${file.name} (${pendingFile.lines} lines) in the browser`);
  drawAction();
}

// --- the right side ------------------------------------------------------------------------

function drawBoard() {
  if (!key) return $("board").replaceChildren(card("Nothing yet", null, el("div", { class: "empty-state" },
    el("b", {}, "Waiting for your API key"), el("p", {}, "Paste it on the left to begin."))));
  const cards = [helped("pipeline", pipelineCard())];
  const addCard = (block, node) => cards.push(helped(block, node));
  if (RELEASE_STAGES.includes(S.stage)) {
    const R = S.release;
    if (R.live) addCard("live", liveCard());
    if (R.verification) addCard("verification", verificationCard());
    if (R.found) addCard("blends", blendsCard());
    if (R.testing) addCard("testing", testingCard());
    if (S.blend.result) addCard("best_blend", bestBlendCard());
    if (S.blend.job) addCard("search", searchCard());
  } else if (BLEND_STAGES.includes(S.stage)) {
    if (S.blend.job) addCard("search", searchCard());
    if (S.blend.result) addCard("best_blend", bestBlendCard());
    addCard("blend_plan", blendPlanCard());
  }
  if (S.loras.length) addCard("training", trainingCard());
  if (S.stage === "done" || S.loras.some((one) => (details[one.id] || {}).status === "ready")) addCard("results", resultsCard());
  if (S.preview) addCard("preview", previewCard());
  if (S.plan || S.choices || changes().length) addCard("plan", planCard());
  if (S.analysis) addCard("dataset", datasetCard());
  if (!S.analysis && !BLEND_STAGES.includes(S.stage)) addCard("welcome", welcomeCard());
  addCard("activity", activityCard());
  // Keep the log's scroll position when it is redrawn every second and a half.
  const log = document.querySelector("pre.log");
  const stuck = log ? log.scrollTop + log.clientHeight >= log.scrollHeight - 20 : true;
  const keep = log ? log.scrollTop : 0;
  $("board").replaceChildren(...cards);
  const again = document.querySelector("pre.log");
  if (again) again.scrollTop = stuck ? again.scrollHeight : keep;
}

function card(title, side, ...body) {
  return el("section", { class: "card" }, el("div", { class: "card-head" }, el("h3", {}, title), side ? el("span", { class: "muted" }, side) : null), ...body);
}

function pipelineCard() {
  const now = STAGE_OF[S.stage] || S.stage;
  const index = STAGES.findIndex(([id]) => id === now);
  const pipeline = el("div", { class: "pipeline", style: `--stages:${STAGES.length}` }, STAGES.map(([id, label], i) => {
    const finished = ["done", "blended", "live"].includes(id) && S.stage === id
      || ({ testing: "tested", verifying: "verified" })[id] === S.stage;
    const state = i < index || finished ? "done" : i === index ? "now" : "";
    const stamp = S.stamps[id];
    return el("div", { class: "stage " + state },
      el("div", { class: "dot" }, state === "done" ? "✓" : String(i + 1)),
      el("b", {}, label), el("span", {}, stamp ? clock(stamp).slice(0, 5) : state === "now" ? "now" : " "));
  }));
  if (RELEASE_STAGES.includes(S.stage)) return card("Where we are", S.mock || $("mock").checked ? "practice run" : null, pipeline, releaseTiles());
  if (BLEND_STAGES.includes(S.stage)) return card("Where we are", S.mock || $("mock").checked ? "practice run" : null, pipeline, blendTiles());
  const t = timing();
  const est = S.estimate;
  const statuses = S.loras.map((one) => (details[one.id] || {}).status);
  const tiles = [
    ["Dataset", S.analysis ? S.analysis.records : "–", S.analysis ? (S.analysis.name || "pasted") : "not given yet"],
    ["Plan", S.plan ? `${S.plan.length} × ${S.epochs}` : "–", S.plan ? "LoRAs × epochs" : "not chosen yet"],
    ["Estimate", est ? duration(est.seconds) : "–", est ? est.source : "after the wait is chosen"],
    ["Elapsed", t.elapsed === null ? "–" : duration(t.elapsed), S.startedAt ? "since queued at " + clock(S.startedAt).slice(0, 5) : "not started"],
    ["Left", t.left === null ? "–" : S.finishedAt ? "done" : "~" + duration(t.left), S.loras.length ? `${Math.round(t.fraction * 100)}% of all steps` : "–"],
    ["LoRAs", S.loras.length ? `${statuses.filter((s) => s === "ready").length}/${S.loras.length}` : "–",
     S.loras.length ? statuses.map((s) => s || "…").join(" · ") : "ready / planned"],
  ];
  return card("Where we are", S.mock || $("mock").checked ? "practice run" : null, pipeline,
    el("div", { class: "tiles" }, tiles.map(([name, value, sub]) =>
      el("div", { class: "tile" }, el("span", {}, name), el("b", { title: String(value) }, value), el("small", { title: sub }, sub)))));

function tilesOf(rows) {

    el("div", { class: "tile" }, el("span", {}, name), el("b", { title: String(value) }, value), el("small", { title: sub }, sub))));
}

function blendTiles() {
  const B = S.blend, b = blendOf(), p = (B.status || {}).progress || {};
  const est = B.plan ? B.plan.estimate : B.estimate;
  const now = B.finishedAt || Date.now();
  const history = (jobDetail && jobDetail.fitness_history) || [];
  const bestNow = history.length ? Math.max(...history.map((h) => h.best || 0)) : null;
  return tilesOf([
    ["LoRAs", b.loras.length || "–", B.plan ? `${B.plan.loras.map((one) => one.name).join(", ")}` : "ticked on the left"],
    ["Search", `${1 + b.generations} × ${b.population}`, "rounds × blends"],
    ["Questions", B.plan ? B.plan.questions : b.questions, B.plan ? `from ${B.plan.source}` : "each blend is judged on"],
    ["Estimate", est ? duration(est.seconds) : "–", est ? est.source : "after the plan"],
    ["Elapsed", B.startedAt ? duration((now - B.startedAt) / 1000) : "–", B.job ? `job ${B.job.id}` : "not started"],
    ["Rounds", p.generations_expected ? `${p.generations_scored || 0}/${p.generations_expected}` : "–",
     B.status ? B.status.job.status : "scored / planned"],
    ["Best score", bestNow === null ? "–" : fmt(bestNow), B.plan && B.plan.mock ? "practice run: random" : "0 to 1, from the judge"],

// What the search will blend: each LoRA, the places it takes, and the search's size.

    el("div", { class: "scroll" }, el("table", {},

function scoreScatter(blends, picked) {
  const W = 300, H = 220, L = 34, R = 10, T = 10, B = 26;
  const { svg, add } = drawing(W, H);
  const x = (v) => L + Math.max(0, Math.min(1, v || 0)) * (W - L - R);
  const y = (v) => T + (1 - Math.max(0, Math.min(1, v || 0))) * (H - T - B);
  for (const k of [0, 0.5, 1]) {
    add("line", { x1: L, x2: W - R, y1: y(k), y2: y(k), stroke: "var(--line)", "stroke-dasharray": k ? "3 4" : "" });
    add("text", { x: L - 6, y: y(k) + 3, "text-anchor": "end" }, k.toFixed(1));
    add("text", { x: x(k), y: H - 8, "text-anchor": "middle" }, k.toFixed(1));
  }
  add("line", { x1: x(0), y1: y(0), x2: x(1), y2: y(1), stroke: "var(--line-2)" });
  for (const one of blends.filter((b) => b.tested !== null && b.quality !== null)) {
    const mine = one.number === picked;
    add("circle", { cx: x(one.quality), cy: y(one.tested), r: mine ? 6 : 4, fill: mine ? "var(--c3)" : "var(--c1)",
                    opacity: mine ? 1 : .75 }).append(hint(`#${one.number} · search ${fmt(one.quality)} · tested ${fmt(one.tested)}`));
  }
  return svg;
}

  return card("Verification", `#${V.id} · blend #${row.number ?? "?"}` + (plan ? ` · ${plan.count} question(s) from ${plan.questions_from}` : ""),
    el("div", { class: "result-head" }, pill(row.status || "queued"),
      plan ? el("span", { class: "muted small" }, `against ${plan.against.join(", ")}, each alone`) : null),
    el("div", { class: "meter big" + (done ? (row.status === "done" ? " done" : " stopped") : " live") }, el("i", { style: `width:${done ? 100 : 40}%` })),

    rep ? el("div", { class: "grid2", style: "margin-top:12px" },
      el("div", {}, sub("verification.means", "Average score"),

// --- charts: hand-drawn SVG, coloured through the page's variables --------------------------

function drawing(width, height) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("class", "chart");
  const add = (tag, attrs, text) => {
    const node = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text !== undefined) node.textContent = text;
    svg.append(node);
    return node;
  };
  return { svg, add };
}
function hint(text) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", "title");
  node.textContent = text;
  return node;
}

function histogramChart(bins) {
  const W = 420, H = 150, L = 30, R = 8, T = 8, B = 24;
  const { svg, add } = drawing(W, H);
  if (!bins.length) return svg;
  const top = Math.max(...bins.map((b) => b.count), 1);
  const bw = (W - L - R) / bins.length;
  for (const k of [0, 0.5, 1]) {
    const y = T + (1 - k) * (H - T - B);
    add("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: "var(--line)", "stroke-dasharray": k ? "3 4" : "" });
    add("text", { x: L - 6, y: y + 3, "text-anchor": "end" }, Math.round(top * k));
  }
  bins.forEach((b, i) => {
    const h = b.count / top * (H - T - B);
    add("rect", { x: L + i * bw + 1.5, y: H - B - h, width: Math.max(1, bw - 3), height: Math.max(0, h), rx: 3, fill: "var(--c2)", opacity: .8 })
      .append(hint(`${b.low}–${b.high} words: ${b.count} answer(s)`));
  });
  add("text", { x: L, y: H - 8 }, bins[0].low + " words");
  add("text", { x: W - R, y: H - 8, "text-anchor": "end" }, bins[bins.length - 1].high + " words");
  return svg;
}

function waitChart(choices, longest) {
  const W = 900, row = 30, L = 130, R = 110;
  const H = row * choices.length + 6;
  const { svg, add } = drawing(W, H);
  const chosen = S.epochs;
  choices.forEach((c, i) => {
    const y = 4 + i * row;
    const w = Math.max(3, c.estimate.seconds / longest * (W - L - R));
    const on = chosen === c.epochs;
    add("text", { x: L - 10, y: y + 15, "text-anchor": "end", fill: on ? "var(--ink)" : "var(--muted)", "font-weight": on ? 600 : 400, "font-size": 12 }, c.label);
    add("rect", { x: L, y: y + 4, width: W - L - R, height: 16, rx: 4, fill: "var(--code)" });
    add("rect", { x: L, y: y + 4, width: w, height: 16, rx: 4, fill: on ? "var(--accent)" : "var(--c1)", opacity: on ? 1 : .45 })
      .append(hint(`${c.epochs} epochs · ${c.estimate.steps} steps per LoRA · ${c.time}`));
    add("text", { x: L + w + 8, y: y + 15, "font-size": 11 }, `${c.epochs} ep · ${duration(c.estimate.seconds)}`);
  });
  return svg;
}

function lossChart(series) {
  const W = 560, H = 240, L = 40, R = 12, T = 10, B = 26;
  const { svg, add } = drawing(W, H);
  const all = series.flatMap((s) => s.points);
  const last = Math.max(...all.map((p) => p.step), 1);
  const top = Math.max(...all.map((p) => p.loss)) * 1.08 || 1;
  const x = (step) => L + (step / last) * (W - L - R);
  const y = (v) => T + (1 - v / top) * (H - T - B);
  for (const k of [0, 0.25, 0.5, 0.75, 1]) {
    add("line", { x1: L, x2: W - R, y1: y(top * k), y2: y(top * k), stroke: "var(--line)", "stroke-dasharray": k ? "3 4" : "" });
    add("text", { x: L - 6, y: y(top * k) + 3, "text-anchor": "end" }, (top * k).toFixed(top * k >= 10 ? 0 : 2));
  }
  for (const s of series) {
    if (!s.points.length) continue;
    add("polyline", { fill: "none", stroke: s.colour, "stroke-width": 2, "stroke-linejoin": "round",
                      points: s.points.map((p) => `${x(p.step)},${y(p.loss)}`).join(" ") });
    const end = s.points[s.points.length - 1];
    add("circle", { cx: x(end.step), cy: y(end.loss), r: 3.5, fill: s.colour })
      .append(hint(`${s.name}\nstep ${end.step} · loss ${fmt(end.loss, 4)}`));
  }
  add("text", { x: L, y: H - 8 }, "step 0");
  add("text", { x: W - R, y: H - 8, "text-anchor": "end" }, "step " + last);
  return svg;
}

function fitnessChart(history) {
  const W = 560, H = 220, L = 36, R = 12, T = 10, B = 26;
  const { svg, add } = drawing(W, H);
  const n = history.length;
  const x = (i) => L + (n > 1 ? i / (n - 1) : 0.5) * (W - L - R);
  const y = (v) => T + (1 - Math.max(0, Math.min(1, v || 0))) * (H - T - B);
  for (const k of [0, 0.25, 0.5, 0.75, 1]) {
    add("line", { x1: L, x2: W - R, y1: y(k), y2: y(k), stroke: "var(--line)", "stroke-dasharray": k ? "3 4" : "" });
    add("text", { x: L - 6, y: y(k) + 3, "text-anchor": "end" }, k.toFixed(2));
  }
  for (const [key, colourName] of [["mean", "var(--c2)"], ["best", "var(--c1)"]]) {
    add("polyline", { fill: "none", stroke: colourName, "stroke-width": 2, "stroke-linejoin": "round",
                      points: history.map((h, i) => `${x(i)},${y(h[key])}`).join(" ") });
    history.forEach((h, i) => add("circle", { cx: x(i), cy: y(h[key]), r: 3, fill: colourName })
      .append(hint(`round ${h.generation} · ${key} ${fmt(h[key])}`)));
  }
  add("text", { x: L, y: H - 8 }, "round " + history[0].generation);
  add("text", { x: W - R, y: H - 8, "text-anchor": "end" }, "round " + history[n - 1].generation);
  return svg;
}

    el("option", { value: p.name }, p.label + (p.ready ? "" : ` — needs ${p.key_env}`))));
  $("provider").value = config.providers.some((p) => p.name === saved.provider) ? saved.provider : config.default.provider;
  $("model").value = saved.provider === $("provider").value ? (saved.model || "") : (config.default.model || "");
  $("baseUrl").value = saved.provider === $("provider").value ? (saved.base_url || "") : "";
  $("mock").checked = recall("mock") ? recall("mock") === "1" : config.mock;
  providerChanged(false);
}

function provider() { return config.providers.find((p) => p.name === $("provider").value); }

function providerChanged(clear = true) {
  const p = provider();
  if (clear) { $("model").value = ""; $("baseUrl").value = ""; }
  $("baseUrlRow").hidden = !(p.local && p.kind === "openai");
  $("baseUrl").placeholder = p.base_url || "";
  $("model").placeholder = p.model ? p.model : p.kind === "scripted" ? "no model" : "the first model it lists";
  $("model").disabled = p.kind === "scripted";
  $("refreshModels").disabled = p.kind === "scripted";
  rememberAgent();
  loadModels();
}

function rememberAgent() {
  remember("agent", { provider: $("provider").value, model: $("model").value.trim(), base_url: $("baseUrl").value.trim() });
  drawChip();
}

let modelState = { ok: null, text: "" };
async function loadModels() {
  const p = provider();
  if (p.kind === "scripted") { modelState = { ok: true, text: "The guide uses its built-in wording; no model is asked." }; return drawChip(); }
  if (!p.ready) { modelState = { ok: false, text: `Set ${p.key_env} in the environment the API server runs in, then restart it. Until then the guide uses its built-in wording.` }; return drawChip(); }
  modelState = { ok: null, text: "Asking for its models…" }; drawChip();
  const query = new URLSearchParams({ provider: p.name });
  if (!$("baseUrlRow").hidden && $("baseUrl").value.trim()) query.set("base_url", $("baseUrl").value.trim());
  try {
    const reply = await api("GET", "/agent/models?" + query);
    $("modelList").replaceChildren(...reply.models.map((m) => el("option", { value: m })));
    const using = $("model").value.trim() || reply.default || reply.models[0];
    modelState = { ok: true, using, text: `${reply.models.length} model(s) at ${reply.base_url}.` + (using ? ` Talking to ${using}.` : "") };
  } catch (error) {
    modelState = { ok: false, text: error.message + " — the guide falls back to its built-in wording." };
  }
  drawChip();
}

function drawChip() {
  const p = provider();
  if (!p) return;
  const model = $("model").value.trim() || (p.kind === "scripted" ? "" : modelState.using || p.model || "auto");
  $("modelChip").querySelector("span").textContent = p.label.replace(/ \(.*\)$/, "") + (model ? " · " + model : "");
  $("modelChip").className = "sm ghost model-chip " + (modelState.ok === true ? "up" : modelState.ok === false ? "down" : "");
  $("modelChip").title = modelState.text;
  $("providerHelp").textContent = modelState.text;
  $("providerHelp").className = "help" + (modelState.ok === false ? " error" : "");
  $("mockTag").hidden = !(S.mock === null ? $("mock").checked : S.mock);
}

// --- health, key, start -------------------------------------------------------------------------

async function refreshHealth() {
  try {
    const health = await (await fetch("/health")).json();
    const loaded = health.models.filter((m) => m.loaded);
    $("health").textContent = loaded.length ? "API up · " + loaded.map((m) => m.base_model).join(", ") + " loaded" : "API up";
    $("health").className = "health up";
  } catch (_) {
    $("health").textContent = "API unreachable";
    $("health").className = "health down";
  }
}

function keyGate(message) {
  $("action").replaceChildren();
  $("transcript").replaceChildren(el("div", { class: "gate" },
    el("h3", {}, "Hi! Let's get you connected"),
    el("p", { class: "muted" }, "I train LoRAs through this server's API, so I need your API key. Create one on the server with ",
      el("code", {}, "python -m async_api.users add <name>"), "."),
    el("form", { onsubmit: (e) => { e.preventDefault(); useKey($("keyInput").value.trim()); } },
      el("label", { for: "keyInput" }, "API key"),
      el("div", { style: "display:flex;gap:8px" },
        el("input", { id: "keyInput", type: "password", autocomplete: "off", placeholder: "paste it here" }),
        el("button", { class: "primary", type: "submit" }, "Connect"))),
    el("p", { class: message ? "help error" : "help", id: "keyHelp" }, message || "It is kept in this browser only, shared with the console page.")));
  $("composer").hidden = true;
  $("changeKey").hidden = true;
  drawBoard();
  setTimeout(() => $("keyInput") && $("keyInput").focus(), 0);
}

async function useKey(value) {
  key = value;
  if (!key) return keyGate("Paste a key first.");
  try {
    config = await api("GET", "/agent/config");
  } catch (error) {
    key = "";
    return keyGate(error.status === 401 ? "That key is not known to this server." : error.message);
  }
  // A server older than this page has no /agent/help: no question marks, nothing else lost.
  try { helpBlocks = (await api("GET", "/agent/help")).blocks || {}; } catch (_) { helpBlocks = {}; }
  $("guideHelp").replaceChildren(...[qm("guide", "Your guide")].filter(Boolean));
  rememberKey(key);
  $("changeKey").hidden = false;
  $("composer").hidden = false;
  fillProviders();
  let saved = recall(sessionName(), true);
  if (!saved) {
    // Kept under one name for everyone before it was kept per key: the first
    // key to arrive takes it over, and it is gone from the shared name.
    saved = recall("session", true);
    try { localStorage.removeItem("gep-agent-session"); } catch (_) { /* private mode */ }
  }
  const wanted = linkedJob();
  if (saved && saved.transcript && saved.transcript.length) {
    S = Object.assign(fresh(), saved);
    drawTranscript(); drawAction(); drawBoard();
    S.blend = Object.assign(freshBlend(), S.blend || {});
    S.release = Object.assign(freshRelease(), S.release || {});
    if (S.loras.length && S.stage === "training") { marker("reconnected — watching the training again"); poll(); }
    else if (S.loras.length) poll();
    if (S.blend.job && S.stage === "blending") { marker("reconnected — watching the search again"); pollBlend(); }
    else if (S.blend.job) pollBlend();
    if (S.release.testing && S.stage === "testing") { marker("reconnected — watching the testing again"); pollTest(); }
    if (S.release.verification && S.stage === "verifying") { marker("reconnected — watching the verification again"); pollVerify(); }
    if (S.release.live) S.release.live.asking = false;
    if (wanted && !(S.blend.job && S.blend.job.id === wanted)) await openJob(wanted);
    else linkToJob();
  } else {
    S = fresh();
    drawTranscript(); drawBoard();
    // A link to a search that is not theirs is said so, then the welcome.
    if (!wanted || !(await openJob(wanted))) intro();
  }
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("say").value.trim();
  if (!text || busy || !config) return;
  $("say").value = "";
  $("say").style.height = "";
  send(text);
});
$("say").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("say").addEventListener("input", () => { $("say").style.height = ""; $("say").style.height = Math.min(140, $("say").scrollHeight) + "px"; });
$("modelChip").addEventListener("click", () => { $("settings").hidden = !$("settings").hidden; });
$("provider").addEventListener("change", () => providerChanged(true));
$("model").addEventListener("change", () => { rememberAgent(); loadModels(); });
$("baseUrl").addEventListener("change", () => { rememberAgent(); loadModels(); });
$("refreshModels").addEventListener("click", loadModels);
$("mock").addEventListener("change", () => {
  remember("mock", $("mock").checked ? "1" : "0");
  if (!S.loras.length) S.mock = null;           // it counts from the next step, until a training starts
  drawChip(); drawBoard();
});
$("restart").addEventListener("click", () => { if (!busy) startOver(); });
$("changeKey").addEventListener("click", () => {
  clearTimeout(pollTimer); clearTimeout(blendTimer); clearTimeout(testTimer); clearTimeout(verifyTimer); keyGate();
});

// The clock on the right keeps moving between polls.
tickTimer = setInterval(() => {
  if (S.startedAt && !S.finishedAt && S.stage === "training") { drawBoard(); drawAction(); }
  else if (S.blend.startedAt && !S.blend.finishedAt && S.stage === "blending") drawBoard();
}, 1000);
refreshHealth();
setInterval(refreshHealth, 10000);
const stored = recallKey();
if (stored) useKey(stored); else keyGate();
</script>
</body>
</html>
