<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRA guide</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f7; --panel: #ffffff; --panel-2: #f8f9fb; --ink: #161a23; --ink-2: #394150;
    --muted: #626b7a; --faint: #8b93a1; --line: #e3e6eb; --line-2: #d2d7df;
    --accent: #4c5fd5; --accent-ink: #ffffff; --accent-soft: #eceffd;
    --ok: #1e8449; --warn: #b45309; --bad: #c8322f;
    --code: #f1f3f6; --log-bg: #11151f; --log-ink: #cdd5e2;
    --c1: #4c5fd5; --c2: #0e7490; --c3: #c2410c; --c4: #a21caf; --c5: #15803d;
    --me: #eceffd; --me-ink: #1d2766;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --radius: 12px; --top: 56px;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1117; --panel: #161a22; --panel-2: #1b2029; --ink: #e7eaf0; --ink-2: #c3c9d4;
      --muted: #99a2b1; --faint: #6f7888; --line: #262c38; --line-2: #343b4a;
      --accent: #8b9cff; --accent-ink: #0c0f1f; --accent-soft: #1f2547;
      --ok: #5fd08a; --warn: #f0b454; --bad: #ff7b72;
      --code: #1d222c; --log-bg: #0a0d13; --log-ink: #c3cbd8;
      --c1: #8b9cff; --c2: #5ccfe6; --c3: #fb923c; --c4: #e879f9; --c5: #5fd08a;
      --me: #232a4f; --me-ink: #dfe4ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }

  /* --- base ----------------------------------------------------------------------- */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  h2 { font-size: 13px; margin: 0; }
  h3 { font-size: 13px; margin: 0; font-weight: 600; }
  p { margin: 0 0 8px; }
  a { color: var(--accent); }
  code { font-family: var(--mono); font-size: 12px; background: var(--code); padding: 1px 5px; border-radius: 5px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }

  label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin: 0 0 4px; }
  input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--panel);
           border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; min-height: 34px;
           transition: border-color .12s, box-shadow .12s; }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent);
           box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  textarea { font-family: var(--mono); font-size: 12px; resize: vertical; line-height: 1.45; }
  input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; min-height: 0; margin: 0; }
  button { font: inherit; font-weight: 500; border: 1px solid var(--line-2); background: var(--panel);
           color: var(--ink); border-radius: 8px; padding: 0 12px; min-height: 32px; cursor: pointer;
           white-space: nowrap; transition: background .12s, border-color .12s, color .12s; }
  button:hover:not(:disabled) { background: var(--panel-2); border-color: var(--faint); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); border-color: transparent; }
  button.danger { color: var(--bad); }
  button.ghost { border-color: transparent; background: transparent; }
  button.sm { min-height: 28px; padding: 0 10px; font-size: 13px; }
  button.lg { min-height: 38px; padding: 0 18px; }
  button:disabled { opacity: .45; cursor: default; }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 13px;
                font-weight: 400; margin: 0; cursor: pointer; }
  .help { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 4px; }
  .help:empty { display: none; }
  .help.error { color: var(--bad); }
  .help.ok { color: var(--ok); }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px 1px 7px; border-radius: 999px;
          font-size: 12px; font-weight: 500; line-height: 1.6; color: var(--muted);
          background: color-mix(in srgb, currentColor 11%, transparent); white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-ready, .s-done { color: var(--ok); } .s-failed, .s-cancelled { color: var(--bad); }
  .s-training, .s-running { color: var(--accent); } .s-queued { color: var(--muted); }
  .s-training::before, .s-running::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .tag { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
         padding: 1px 6px; border-radius: 5px; color: var(--muted); background: var(--code); vertical-align: 1px; }
  .tag.mock { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }
  .tag.rec { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }

  /* --- top bar ---------------------------------------------------------------------- */
  .topbar { height: var(--top); display: flex; align-items: center; gap: 14px; padding: 0 18px;
            background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; flex: none; }
  .brand b { display: block; font-size: 14px; line-height: 1.1; }
  .brand span { display: block; font-size: 11px; color: var(--muted); line-height: 1.2; }
  .spacer { flex: 1; }
  .health { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
            max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .health::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .health.up::before { background: var(--ok); }
  .health.down::before { background: var(--bad); }
  .topbar a.button { display: inline-flex; align-items: center; text-decoration: none; color: var(--ink);
                     border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; min-height: 28px; font-size: 13px; }
  .topbar a.button:hover { background: var(--panel-2); }

  /* --- the two halves ----------------------------------------------------------------- */
  .halves { display: grid; grid-template-columns: minmax(360px, 480px) minmax(0, 1fr); height: calc(100vh - var(--top)); }
  .agent { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  .board { overflow-y: auto; padding: 20px 22px 40px; min-width: 0; }
  @media (max-width: 960px) {
    .halves { grid-template-columns: minmax(0, 1fr); height: auto; }
    .agent { height: 78vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .board { overflow: visible; padding: 16px; }
    .health { display: none; }
  }
  @media (max-width: 560px) {
    .topbar { padding: 0 16px; gap: 8px; }
    .brand span { display: none; }
    .agent-head { flex-wrap: wrap; row-gap: 4px; }
    .model-chip { max-width: 100%; order: 5; }
    .pipeline .stage b { font-size: 11px; }
  }
  .topbar a.button, .topbar button { white-space: nowrap; }

  /* --- the agent: header, model picker, transcript, action, composer ------------------------ */
  .agent-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .agent-head h2 { font-size: 14px; white-space: nowrap; }
  .agent-head .tag { white-space: nowrap; }
  .model-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 9px; font-size: 12px;
                max-width: 250px; border-radius: 999px; color: var(--muted); }
  .model-chip span { overflow: hidden; text-overflow: ellipsis; }
  .model-chip::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .model-chip.up::before { background: var(--ok); }
  .model-chip.down::before { background: var(--warn); }
  .settings { padding: 12px 16px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2);
              display: grid; gap: 10px; }
  .settings .row { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
  .settings .inline { display: flex; gap: 6px; }
  .settings .inline input { flex: 1; }

  .transcript { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px;
                scroll-behavior: smooth; }
  .msg { max-width: 100%; }
  .msg .who { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
  .msg .who .by { font-weight: 400; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bubble { padding: 10px 13px; border-radius: 4px 12px 12px 12px; background: var(--panel-2);
            border: 1px solid var(--line); overflow-wrap: anywhere; }
  .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 20px; }
  .bubble li { margin: 2px 0; }
  .msg.me { align-self: flex-end; max-width: 85%; }
  .msg.me .who { justify-content: flex-end; }
  .msg.me .bubble { background: var(--me); color: var(--me-ink); border-color: transparent; border-radius: 12px 4px 12px 12px; }
  .msg .note { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .msg .note.warn { color: var(--warn); }
  .msg.event { align-self: center; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .msg.event::before, .msg.event::after { content: ""; width: 24px; height: 1px; background: var(--line-2); }
  .msg.event.tool { align-self: flex-start; color: var(--accent); background: var(--accent-soft); padding: 3px 10px;
                    border-radius: 999px; font-size: 12px; max-width: 100%; }
  .msg.event.tool::before, .msg.event.tool::after { display: none; }
  .msg.event.tool.failed { color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, var(--panel)); }
  .msg.event .gear { font-size: 13px; }
  .selection-note { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; font-size: 13px; background: var(--accent-soft);
                    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); color: var(--ink); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .action { border-top: 1px solid var(--line); padding: 14px 16px; background: var(--panel); max-height: 55%; overflow-y: auto; }
  .action:empty { display: none; }
  .action .ask { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em;
                 margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .action .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
  .seg button { border: 0; background: transparent; min-height: 26px; color: var(--muted); font-size: 13px; }
  .seg button.active { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .dataset-pane { margin-top: 10px; }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center;
          min-height: 110px; border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 14px; cursor: pointer;
          color: var(--muted); font-size: 13px; background: var(--panel-2); transition: border-color .12s, background .12s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop b { color: var(--ink); }
  .options { display: grid; gap: 6px; }
  .option { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left;
            padding: 9px 12px; min-height: 0; white-space: normal; font-weight: 400; border-radius: 10px; }
  .option input { grid-row: span 2; }
  .option b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .option .side { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .option .sub { grid-column: 2 / -1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .option.chosen, .option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .option:disabled .sub { white-space: normal; }
  .choice { grid-template-columns: minmax(0, 1fr) auto; padding: 11px 13px; }
  .choice .sub { grid-column: 1 / -1; white-space: normal; }
  .choice .time { font-weight: 600; font-variant-numeric: tabular-nums; }

  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  .composer textarea { font-family: inherit; font-size: 14px; min-height: 38px; max-height: 140px; resize: none; }
  .composer button { min-height: 38px; }

  .gate { margin: auto 0; padding: 24px 20px; }
  .gate h3 { font-size: 16px; margin-bottom: 6px; }

  /* --- the board -------------------------------------------------------------------------- */
  .board-inner { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-head .muted { font-size: 12px; }
  .grid2 { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 1200px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .fresh { animation: arrive .5s ease-out; }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* The pipeline: where the process is, drawn as connected steps. */
  .pipeline { display: grid; grid-template-columns: repeat(var(--stages, 6), minmax(0, 1fr)); gap: 0; }
  .stage { position: relative; padding: 2px 6px 0 0; min-width: 0; }
  .stage .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700;
                background: var(--code); color: var(--faint); border: 2px solid var(--panel); position: relative; z-index: 1; }
  .stage::before { content: ""; position: absolute; left: 22px; right: 0; top: 12px; height: 2px; background: var(--line); }
  .stage:last-child::before { display: none; }
  .stage.done::before { background: var(--accent); }
  .stage.done .dot { background: var(--accent); color: var(--accent-ink); }
  .stage.now .dot { background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
                    animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 12%, transparent); } }
  .stage b { display: block; font-size: 12px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage span { display: block; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage:not(.done):not(.now) b { color: var(--faint); font-weight: 500; }

  .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); margin-top: 16px; }
  .tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .tile span { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .tile b { display: block; font-size: 19px; font-weight: 650; margin-top: 1px; font-variant-numeric: tabular-nums;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile small { display: block; font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meter { height: 5px; border-radius: 5px; background: var(--code); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .6s ease; }
  .meter.big { height: 10px; margin: 4px 0 6px; }
  .meter.done i { background: var(--ok); }
  .meter.stopped i { background: var(--bad); }
  .meter.live i { background-image: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent);
                  background-size: 60px 100%; background-repeat: no-repeat; animation: sheen 1.6s linear infinite; background-color: var(--accent); }
  @keyframes sheen { from { background-position: -60px 0; } to { background-position: calc(100% + 60px) 0; } }

  .empty-state { text-align: center; padding: 34px 20px; color: var(--muted); }
  .empty-state svg { width: 120px; height: 72px; margin-bottom: 8px; }
  .empty-state b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; background: var(--panel-2); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.clip { max-width: 0; }
  td.clip div { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .scroll { overflow-x: auto; max-height: 360px; overflow-y: auto; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  tr.pick { cursor: pointer; }
  tr.pick:hover td { background: var(--panel-2); }
  tr.picked td { background: var(--accent-soft); }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--code); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chip i { font-style: normal; color: var(--faint); margin-left: 4px; }
  .problems { margin: 0; padding-left: 18px; color: var(--warn); font-size: 13px; }

  pre.log { background: var(--log-bg); color: var(--log-ink); border-radius: 8px; margin: 0; padding: 12px 14px;
            font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; height: 260px; overflow-y: auto; }
  .activity { font: 12px/1.45 var(--mono); max-height: 260px; overflow-y: auto; display: grid; gap: 1px; }
  .act { display: grid; grid-template-columns: 62px 44px minmax(0, 1fr) auto; gap: 8px; padding: 3px 6px; border-radius: 5px; }
  .act:nth-child(odd) { background: var(--panel-2); }
  .act .t { color: var(--faint); }
  .act .m { color: var(--muted); font-weight: 600; }
  .act .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .act .r { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .act.ok .r { color: var(--ok); } .act.err .r, .act.err .p { color: var(--bad); }
  .act.pending .r::after { content: "…"; animation: pulse 1s infinite; }
  .act.info .m { color: var(--accent); }

  svg.chart { fill: var(--muted); font-size: 10px; font-family: system-ui, sans-serif; width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 3px; margin-right: 5px; vertical-align: 3px; }
  .note-box { margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; background: color-mix(in srgb, var(--warn) 9%, var(--panel));
              border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); color: var(--ink-2); }
  .sample-q { font-weight: 600; margin-bottom: 4px; }
  .sample-a { white-space: pre-wrap; color: var(--ink-2); }
  .result { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .result:last-child { border-bottom: 0; }
  .result-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .result-head .num { margin-left: auto; color: var(--muted); font-size: 12px; }
  .option.blocked { opacity: .5; }
  .knobs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .knobs label { font-size: 11px; }
  .formula { font: 13px/1.6 var(--mono); background: var(--code); border-radius: 8px; padding: 10px 12px;
             overflow-wrap: anywhere; margin: 0 0 10px; }

  /* "What is this?": a question mark on every block the guide can explain (ui_help.py). */
  button.qm { display: inline-grid; place-items: center; width: 20px; height: 20px; min-height: 0; padding: 0;
              margin-left: 6px; border: 0; border-radius: 50%; background: transparent; color: var(--faint);
              vertical-align: -5px; cursor: help; transition: color .15s, background .15s, transform .15s; }
  button.qm svg { width: 16px; height: 16px; display: block; }
  .card:hover .card-head button.qm, .action:hover .ask button.qm, .agent-head:hover button.qm { color: var(--muted); }
  button.qm:hover:not(:disabled), button.qm:focus-visible { color: var(--accent); background: var(--accent-soft);
              border-color: transparent; transform: scale(1.12); }
  button.qm:hover svg .qm-dot { animation: nudge .5s ease-in-out; }
  @keyframes nudge { 50% { transform: translateY(-1px); } }
  .explained { animation: explained 1.8s ease-out; border-radius: 10px; }
  @keyframes explained { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); }
                         25% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 25%, transparent); }
                         100% { box-shadow: 0 0 0 0 transparent; } }
  .slot-tag { display: inline-block; min-width: 26px; text-align: center; font: 600 11px var(--mono); padding: 1px 6px;
              border-radius: 5px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true">
      <rect width="26" height="26" rx="7" fill="var(--accent)"/>
      <path d="M7 16.5c2.2-5 4.2-7.5 6-7.5s3.8 2.5 6 7.5" stroke="var(--accent-ink)" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <circle cx="13" cy="9" r="2.3" fill="var(--accent-ink)"/>
      <circle cx="7" cy="17" r="2" fill="var(--accent-ink)"/>
      <circle cx="19" cy="17" r="2" fill="var(--accent-ink)"/>
    </svg>
    <div><b>LoRA guide</b><span>train LoRAs and blend them, with an assistant</span></div>
  </div>
  <div class="spacer"></div>
  <span id="health" class="health" title="The async API server"></span>
  <a class="button" href="/runs.html" title="Every search you have run">Your runs</a>
  <a class="button" href="/demo" target="_blank" rel="noopener">Console ↗</a>
  <button type="button" class="sm ghost" id="changeKey" hidden>Change key</button>
</header>

<div class="halves">
  <!-- left: the agent -->
  <section class="agent" aria-label="The guide">
    <div class="agent-head">
      <h2>Your guide<span id="guideHelp"></span></h2>
      <span id="mockTag" class="tag mock" hidden>practice run</span>
      <span class="spacer"></span>
      <button type="button" class="sm ghost model-chip" id="modelChip" title="Which model the guide talks through"><span>…</span></button>
      <button type="button" class="sm ghost" id="restart" title="Forget this conversation and start again">Start over</button>
    </div>
    <div class="settings" id="settings" hidden>
      <div class="row">
        <div>
          <label for="provider">Provider</label>
          <select id="provider"></select>
        </div>
        <div>
          <label for="model">Model</label>
          <div class="inline">
            <input id="model" list="modelList" placeholder="the provider's default" autocomplete="off">
            <button type="button" class="sm" id="refreshModels" title="Ask the provider which models it has">↻</button>
          </div>
          <datalist id="modelList"></datalist>
        </div>
      </div>
      <div id="baseUrlRow">
        <label for="baseUrl">Endpoint</label>
        <input id="baseUrl" placeholder="http://host:1234/v1" autocomplete="off">
      </div>
      <p class="help" id="providerHelp"></p>
      <label class="check"><input type="checkbox" id="mock"> Practice run — train nothing, finish in seconds (no GPU needed)</label>
    </div>

    <div class="transcript" id="transcript" aria-live="polite"></div>
    <div class="action" id="action"></div>
    <form class="composer" id="composer">
      <textarea id="say" rows="1" placeholder="Ask me anything, or tell me what to change…" aria-label="Message"></textarea>
      <button type="submit" class="primary" id="send">Send</button>
    </form>
  </section>

  <!-- right: what is happening -->
  <main class="board" aria-label="Progress">
    <div class="board-inner" id="board"></div>
  </main>
</div>

<script>
"use strict";

// --- state -------------------------------------------------------------------------
//
// The page holds the whole conversation; the server's /agent endpoints keep
// nothing. S is saved to this browser after every change, so a reload -- in the
// middle of a training, say -- picks up where it was.

const STAGES = [
  ["intro", "Welcome"], ["dataset", "Dataset"], ["analysis", "Review"],
  ["wait", "How long"], ["training", "Training"], ["done", "Trained"],
  ["blend", "Blend"], ["blending", "Search"], ["blended", "Best blend"],
  ["testing", "Test"], ["verifying", "Verify"], ["live", "Live"]];
const STAGE_OF = { confirm: "wait", blend_confirm: "blend", searches: "blend", tested: "testing", verified: "verifying" };
const FINAL = ["ready", "failed", "cancelled", "missing"];
// A job that will not change again on its own (registry.FINISHED).
const JOB_FINAL = ["done", "failed", "cancelled", "stopped", "deleted"];
// After the search: testing its blends, verifying one, putting one live.
const RELEASE_STAGES = ["testing", "tested", "verifying", "verified", "live"];
const BLEND_STAGES = ["blend", "blend_confirm", "blending", "blended", "searches", ...RELEASE_STAGES];

let key = "";
let config = null;
let S = fresh();
let busy = false;
let pollTimer = null, tickTimer = null;
let activity = [];                  // the API calls this page made, newest last
let logFor = null;                  // the LoRA whose log is shown
let details = {};                   // LoRA id -> the last GET /loras/{id}
let logText = {};                   // LoRA id -> its log lines
let queuedSince = null;             // when the first LoRA was seen still queued
let pendingFile = null;             // an upload read, not yet analysed
let datasetMode = "paste";
let blendTimer = null;              // the search's poll
let jobDetail = null;               // the last GET /jobs/{id}: its fitness history
let jobLog = [];                    // the search's console
let testTimer = null, verifyTimer = null;
let testForm = null;                // the last GET /jobs/{id}/test: how many blends tested
let verifyLog = [];                 // the verification's console
let helpBlocks = {};                // GET /agent/help: the blocks with a question mark

// One id per conversation, sent with every call: a provider that routes and
// caches by conversation (OpenCode Go's x-opencode-session) is told which one.
// randomUUID needs a secure context; a page served over plain http on the LAN
// is not one.
function conversationId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
}

function fresh() {
  return { conversation: conversationId(), stage: "intro", transcript: [], dataset: null, analysis: null, sharedFile: null,
           choices: null, recommended: null, epochs: null, estimate: null, plan: null,
           loras: [], startedAt: null, finishedAt: null, stamps: {}, mock: null, agent: null,
           debriefed: false, readyLoras: 0,
           nameEdits: {},              // rank -> a LoRA name the person typed
           searches: null, searchesFrom: null,   // the user's finished jobs, to pick one
           // What the chat has set up (planner.session_of): the part of the
           // dataset in use, ranks, epochs, options, and `blend` -- which of
           // the user's LoRAs a search combines, and its size. The server
           // checks it on every call; the page only keeps it.
           session: {}, preview: null,
           // The second half: the user's ready LoRAs, the search's plan (the
           // POST /jobs body, read back), the job it became and what it found.
           blend: freshBlend(),
           // The third: the search's blends tested, one verified, one live.
           // What the person chose (the blend, the questions) is the
           // session's `release` part; this is what the API gave back.
           release: freshRelease() };
}

function freshBlend() {
  return { available: [], estimate: null, plan: null, job: null, status: null, result: null,
           startedAt: null, finishedAt: null, debriefed: false };
}

function freshRelease() {
  return { testing: null, found: null, verification: null, plan: null, report: null, live: null };
}

const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    if (name === "class") node.className = value;
    else if (name === "html") node.innerHTML = value;
    else if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
    else node.setAttribute(name, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : String(child));
  }
  return node;
}

function remember(name, value) {
  try { localStorage.setItem("gep-agent-" + name, typeof value === "string" ? value : JSON.stringify(value)); } catch (_) { /* private mode */ }
}
function recall(name, parse = false) {
  try {
    const raw = localStorage.getItem("gep-agent-" + name);
    return parse ? (raw ? JSON.parse(raw) : null) : (raw || "");
  } catch (_) { return parse ? null : ""; }
}
// The API key is the demo page's, so one key serves both pages.
function recallKey() { try { return localStorage.getItem("gep-api-key") || ""; } catch (_) { return ""; } }
function rememberKey(value) { try { localStorage.setItem("gep-api-key", value); } catch (_) { /* private mode */ } }

// The conversation is kept per API key, so two people sharing a browser each
// get their own back and never see the other's. The name is a hash of the key,
// not the key: the key itself is only ever stored once, as gep-api-key.
function sessionName() {
  let hash = 0x811c9dc5;
  for (let i = 0; i < key.length; i++) hash = Math.imul(hash ^ key.charCodeAt(i), 0x01000193) >>> 0;
  return "session-" + hash.toString(16);
}

function save() {
  // A pasted dataset over a megabyte is not kept; a restored session before
  // the training asks for it again rather than failing on a missing one.
  const copy = Object.assign({}, S);
  if (copy.dataset && copy.dataset.text && copy.dataset.text.length > 1e6) copy.dataset = Object.assign({}, copy.dataset, { text: null });
  if (key) remember(sessionName(), copy);
  linkToJob();
}

// The address says which search is on screen (/agent?job=N), so a reload, a
// bookmark or the runs page brings it back. Only the owner's key can read it:
// anyone else's gets "no search of yours".
function linkToJob() {
  const url = new URL(location.href), id = S.blend && S.blend.job && S.blend.job.id;
  if (String(id || "") === (url.searchParams.get("job") || "")) return;
  if (id) url.searchParams.set("job", id); else url.searchParams.delete("job");
  history.replaceState(null, "", url);
}

const linkedJob = () => {
  const id = Number(new URLSearchParams(location.search).get("job"));
  return Number.isInteger(id) && id > 0 ? id : null;
};

// /agent?job=N: that search of the user's, opened here -- read back the way a
// search that just finished is, or watched if it is still running. The rest
// of the conversation stays; only the search part is replaced.
async function openJob(id) {
  let found;
  try {
    found = (await api("GET", `/jobs/${id}`)).job;
  } catch (error) {
    if (error.status !== 404) throw error;
    agentSays(plain(`There is no search ${id} of yours to open.`));
    return false;
  }
  resetBlend();
  Object.assign(S.blend, { job: { id: found.id, label: found.label, queue_position: found.queue_position || null },
                           status: { job: found, progress: null }, startedAt: null, finishedAt: null, debriefed: false });
  marker(`opened search · job ${found.id}${found.label ? " · " + found.label : ""}`);
  setStage("blending");
  pollBlend();
  return true;
}

const fmt = (value, digits = 3) => (value === null || value === undefined || Number.isNaN(value)) ? "–" : Number(value).toFixed(digits);
const clock = (date) => new Date(date || Date.now()).toTimeString().slice(0, 8);
function duration(seconds) {
  if (seconds === null || seconds === undefined || !Number.isFinite(seconds)) return "–";
  seconds = Math.max(0, Math.round(seconds));
  if (seconds < 60) return `${seconds}s`;
  const m = Math.floor(seconds / 60), s = seconds % 60;
  if (m < 60) return `${m}m ${String(s).padStart(2, "0")}s`;
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
}
const colour = (index) => `var(--c${(index % 5) + 1})`;
const pill = (status) => el("span", { class: "pill s-" + status }, status);

// --- the API, and a record of every call ------------------------------------------------

async function api(method, path, body) {
  const entry = { at: Date.now(), method, path, status: null, ms: null };
  activity.push(entry);
  if (activity.length > 400) activity.shift();
  drawActivity();
  const started = performance.now();
  let response, data = null;
  try {
    response = await fetch(path, {
      method,
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    try { data = await response.json(); } catch (_) { /* empty body */ }
  } catch (error) {
    entry.status = "down"; entry.ms = performance.now() - started; drawActivity();
    throw new Error("The API server cannot be reached. Is it running? (run_api_server.bat)");
  }
  entry.status = response.status; entry.ms = performance.now() - started;
  drawActivity();
  if (!response.ok) {
    // The page is read from disk on every request, the routes only when the
    // server starts: a server older than the page is missing endpoints.
    const stale = response.status === 404 && data && /^no such endpoint/.test(data.error || "");
    const error = new Error(stale ? `${data.error} — the API server is older than this page. Restart it (run_api_server.bat, or python -m async_api.server) and try again.`
                                  : (data && data.error) || response.status + " " + response.statusText);
    error.status = response.status;
    throw error;
  }
  return data;
}

// Something the page did that is not a call: shown in the activity log too.
function event(text) {
  activity.push({ at: Date.now(), method: "•", path: text, status: "info", ms: null });
  drawActivity();
}

// --- light Markdown: the only formatting the prompts allow --------------------------------

function md(text) {
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, "$1<i>$2</i>");
  const out = [];
  let list = null, para = [];
  const flush = () => {
    if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>");
    para = [];
    if (list) out.push(`<${list.tag}>` + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`);
    list = null;
  };
  for (const raw of String(text || "").replace(/\r/g, "").split("\n")) {
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/), number = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (!line.trim()) { flush(); continue; }
    if (bullet || number) {
      const tag = bullet ? "ul" : "ol";
      if (para.length || (list && list.tag !== tag)) flush();
      if (!list) list = { tag, items: [] };
      list.items.push((bullet || number)[1]);
      continue;
    }
    if (list) flush();
    para.push(line.replace(/^#+\s*/, ""));
  }
  flush();
  return out.join("");
}

// --- the transcript ---------------------------------------------------------------------

function agentSays(message, extra = {}) {
  S.transcript.push(Object.assign({ who: "agent", text: message.text, by: message.by, note: message.note,
                                    warn: Boolean(message.fallback && message.note), at: Date.now() }, extra));
  save();
  drawTranscript();
}
function userSays(text) {
  S.transcript.push({ who: "me", text, at: Date.now() });
  save();
  drawTranscript();
}
function marker(text) {
  S.transcript.push({ who: "event", text, at: Date.now() });
  save();
  drawTranscript();
}
// One tool the chat ran, as a line in the transcript and in the activity log.
function toolMarker(done) {
  S.transcript.push({ who: "event", tool: true, ok: done.ok, text: done.summary, at: Date.now() });
  event(`tool ${done.tool}(${JSON.stringify(done.arguments)}) ${done.ok ? "ok" : "refused"}`);
  save();
  drawTranscript();
}
const words = (name) => (config && config.words && config.words[name]) || "";
const plain = (text) => ({ text, by: "built-in wording", note: null });

// What the model is sent as the conversation so far. Not called history():
// that would hide the browser's own window.history, which linkToJob() needs.
function pastTurns() {
  return S.transcript.filter((m) => m.who !== "event")
    .map((m) => ({ role: m.who === "me" ? "user" : "assistant", content: m.text }));
}

let thinking = false;
function drawTranscript() {
  const box = $("transcript");
  box.replaceChildren(...S.transcript.map((m) => {
    if (m.who === "event") return el("div", { class: "msg event" + (m.tool ? " tool" : "") + (m.tool && !m.ok ? " failed" : "") },
      m.tool ? el("span", { class: "gear", "aria-hidden": "true" }, "\u2699") : null, m.text);
    const me = m.who === "me";
    return el("div", { class: "msg" + (me ? " me" : "") },
      el("div", { class: "who" }, me ? "You" : "Guide",
         !me && m.by ? el("span", { class: "by", title: m.by }, "· " + m.by) : null,
         el("span", { class: "by" }, clock(m.at).slice(0, 5))),
      el("div", { class: "bubble", html: md(m.text) }),
      m.note ? el("div", { class: "note" + (m.warn ? " warn" : "") }, m.note) : null);
  }), ...(thinking ? [el("div", { class: "msg" }, el("div", { class: "who" }, "Guide"),
    el("div", { class: "bubble" }, el("span", { class: "typing", "aria-label": "thinking" }, el("i"), el("i"), el("i"))))] : []));
  box.scrollTop = box.scrollHeight;
}

// One step of the conversation at a time: nothing else can be pressed while
// the guide is answering.
async function step(work) {
  if (busy) return;
  busy = true; thinking = true;
  drawTranscript(); drawAction(); $("send").disabled = true;
  try {
    await work();
  } catch (error) {
    agentSays(plain("Something went wrong: " + error.message), { note: "The step can be tried again.", warn: true });
  } finally {
    busy = false; thinking = false;
    $("send").disabled = false;
    drawTranscript(); drawAction(); drawBoard();
  }
}

function setStage(stage) {
  S.stage = stage;
  S.stamps[STAGE_OF[stage] || stage] = S.stamps[STAGE_OF[stage] || stage] || Date.now();
  save();
  drawAction(); drawBoard();
}

// --- "what is this?" ------------------------------------------------------------------------
//
// A question mark on every block the guide can explain -- the ones GET
// /agent/help lists (ui_help.py), so none is drawn with nothing behind it.
// Pressing one asks POST /agent/help about that block, with the text it shows
// right now, and the answer lands in the conversation like any other.

const QM_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true">' +
  '<circle cx="8" cy="8" r="7" fill="currentColor" opacity=".12"/>' +
  '<circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.3"/>' +
  '<path d="M6.2 6.3a1.85 1.85 0 1 1 2.6 1.7c-.5.25-.8.6-.8 1.15v.35" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
  '<circle class="qm-dot" cx="8" cy="11.5" r=".95" fill="currentColor"/></svg>';

// What the person is taken to have asked: the button's tooltip, and their line.
const helpQuestion = (block, title) => block === "controls" ? `What do I do at “${title}”?` : `What is “${title}”?`;

function qm(block, title) {
  if (!helpBlocks[block]) return null;
  const question = helpQuestion(block, title);
  return el("button", { type: "button", class: "qm", "data-help": block, title: question,
                        "aria-label": question, disabled: busy, html: QM_SVG,
                        onclick: (e) => { e.stopPropagation(); explain(block, title, e.currentTarget); } });
}

// A card with its question mark in the heading.
function helped(block, node) {
  const head = node.querySelector(".card-head h3");
  const button = head && qm(block, head.textContent);
  if (button) head.append(button);
  return node;
}

// A heading inside a card, with its own question mark.
function sub(block, title, style = "margin-bottom:8px", ...extra) {
  return el("h3", { style }, title, ...extra, qm(block, [title, ...extra].map((one) => one.textContent ?? one).join("")));
}

// The part of the page a question mark belongs to, and the text it shows:
// a card, a heading and what follows it up to the next heading, the step's
// controls, or the guide's own header.
function helpBox(button) {
  const inside = (selector) => button.closest(selector);
  if (inside(".card-head")) return [inside("section.card")];
  if (inside(".ask")) return [$("action")];
  if (inside(".agent-head")) return [inside(".agent-head")];
  const heading = inside("h3"), parent = heading.parentElement;
  if (!parent.classList.contains("card")) return [parent];
  const nodes = [heading];
  for (let next = heading.nextElementSibling; next && next.tagName !== "H3"; next = next.nextElementSibling) nodes.push(next);
  return nodes;
}

function explain(block, title, button) {
  if (busy || !config) return;
  const nodes = helpBox(button);
  // A chart's numbers are in its hover titles, which innerText leaves out.
  const shown = nodes.map((node) => [node.innerText || node.textContent || "",
    ...[...node.querySelectorAll("svg title")].map((one) => one.textContent.replace(/\n/g, " · "))].join("\n")).join("\n").trim();
  for (const node of nodes) { node.classList.remove("explained"); void node.offsetWidth; node.classList.add("explained"); }
  setTimeout(() => nodes.forEach((node) => node.classList.remove("explained")), 1900);
  const past = pastTurns();
  userSays(helpQuestion(block, title));
  // On a narrow screen the guide sits above the board: bring the answer into view.
  if (window.matchMedia("(max-width: 960px)").matches) $("transcript").scrollIntoView({ behavior: "smooth", block: "start" });
  event(`what is ${block}?`);
  step(async () => {
    const reply = await api("POST", "/agent/help", { agent: agentChoice(), block, title, shown, stage: S.stage, history: past });
    agentSays(reply.message);
  });
}

// --- the steps --------------------------------------------------------------------------

function agentChoice() {
  return { provider: $("provider").value, model: $("model").value.trim() || undefined,
           base_url: $("baseUrlRow").hidden ? undefined : ($("baseUrl").value.trim() || undefined),
           conversation: S.conversation };
}
const mock = () => S.mock === null ? $("mock").checked : S.mock;
// The session as the server is sent it: the page's practice-run setting wins.
const session = () => Object.assign({}, S.session, { mock: mock() });

function intro() {
  step(async () => {
    S.stamps.intro = Date.now();
    const reply = await api("POST", "/agent/intro", { agent: agentChoice(), mock: $("mock").checked });
    S.readyLoras = reply.ready_loras || 0;
    agentSays(reply.message);
    setStage("intro");
  });
}

function notYet() {
  userSays("Not yet.");
  agentSays(plain(words("not_yet")));
}

function yes() {
  userSays("Yes, let's start!");
  agentSays(plain(words("ask_dataset")));
  setStage("dataset");
}

function datasetPayload() {
  if (datasetMode === "demo") {
    const chosen = document.querySelector('input[name="demo"]:checked');
    if (!chosen) throw new Error("Pick one of the demo datasets first.");
    return { file: chosen.value };
  }
  if (datasetMode === "upload") {
    if (!pendingFile) throw new Error("Choose or drop a file first.");
    return { text: pendingFile.text, name: pendingFile.name };
  }
  const text = $("paste").value;
  if (!text.trim()) throw new Error("Paste some records into the box first.");
  return { text, name: "pasted" };
}

function analyse() {
  let dataset;
  try { dataset = datasetPayload(); }
  catch (error) { $("datasetHelp").textContent = error.message; $("datasetHelp").className = "help error"; return; }
  const lines = dataset.text ? dataset.text.split(/\r?\n/).filter((l) => l.trim()).length : null;
  userSays(dataset.file ? `Let's use the demo dataset **${dataset.file}**.`
    : dataset.name === "pasted" ? `Here's my dataset (${lines} pasted line${lines === 1 ? "" : "s"}).`
    : `Here's my file **${dataset.name}** (${lines} line${lines === 1 ? "" : "s"}).`);
  step(() => readDataset(dataset));
}

// A dataset read in -- from the controls, or because the chat asked for a
// demo one. A new dataset is used whole: the part chosen of the last one
// means nothing here.
async function readDataset(dataset) {
  event("reading the dataset");
  const whole = Object.assign({}, session(), { selection: {} });
  let reply;
  try {
    reply = await api("POST", "/agent/analyse", { agent: agentChoice(), dataset, session: whole });
  } catch (error) {
    if (error.status === 400) { agentSays(plain(error.message + "\n\n" + words("instructions").dataset)); return; }
    throw error;
  }
  S.session = Object.assign({}, S.session, { selection: {} });
  S.dataset = dataset;
  S.analysis = reply.analysis;
  S.sharedFile = reply.shared_file;
  S.plan = null; S.choices = null; S.preview = null;
  agentSays(reply.message);
  setStage(reply.analysis.usable ? "analysis" : "dataset");
}

function anotherDataset() {
  userSays("I'd like to choose another dataset.");
  agentSays(plain(words("another_dataset")));
  S.analysis = null; S.dataset = null; S.preview = null;
  setStage("dataset");
}

function askWait(again = false) {
  if (!again) userSays("Use this dataset.");
  S.mock = $("mock").checked;
  step(() => fetchWait(false));
}

// The wait's options, timed for the plan as it stands. Quietly, when the chat
// changed the plan and the options on screen need their times again.
async function fetchWait(quiet) {
  const reply = await api("POST", "/agent/wait", { agent: agentChoice(), records: S.analysis.records,
                                                   mock: mock(), history: pastTurns(), session: session(), quiet });
  S.choices = reply.choices;
  S.recommended = reply.recommended;
  if (quiet) return;
  agentSays(reply.message);
  setStage("wait");
}

// A wait chosen, by button or in the chat: the plan comes back from the agent,
// read back before anything starts.
async function planFor(epochs) {
  if (!S.dataset || (!S.dataset.file && !S.dataset.text)) {
    agentSays(plain("I no longer have your dataset in this browser — please give it to me again."));
    setStage("dataset");
    return;
  }
  const reply = await api("POST", "/agent/plan", { dataset: S.dataset, epochs, mock: mock(), session: session() });
  S.epochs = reply.epochs;
  S.session = Object.assign({}, S.session, { epochs: reply.epochs });
  S.estimate = reply.estimate;
  S.plan = reply.trainings;
  // Names the person already edited stay theirs across a plan read back again.
  for (const body of S.plan) {
    const edited = (S.nameEdits || {})[body.settings.rank];
    if (edited && !S.plan.some((other) => other !== body && other.name === edited)) body.name = edited;
  }
  agentSays(reply.message);
  setStage("confirm");
}

function chooseWait(choice) {
  userSays(`${choice.label} — ${choice.epochs} epochs (${choice.time}).`);
  step(() => planFor(choice.epochs));
}

function changeWait() {
  userSays("Let me pick a different wait.");
  S.plan = null;
  setStage("wait");
}

function startTraining() {
  userSays("Start training!");
  step(queueTraining);
}

// The plan on screen, sent to the API's own POST /loras one LoRA at a time.
async function queueTraining() {
  const queued = [];
  for (const body of S.plan) {
    event(`queueing ${body.name}`);
    try {
      const reply = await api("POST", "/loras", body);
      queued.push({ id: reply.lora.id, name: reply.lora.name, rank: body.settings.rank,
                    queue_position: reply.training.queue_position });
    } catch (error) {
      agentSays(plain(`I couldn't queue **${body.name}**: ${error.message}`));
    }
  }
  if (!queued.length) { setStage("confirm"); return; }
  S.loras = queued;
  S.startedAt = Date.now();
  S.finishedAt = null;
  S.debriefed = false;
  details = {}; logText = {}; queuedSince = null;
  logFor = queued[0].id;
  marker(`training queued · ${queued.length} LoRA${queued.length === 1 ? "" : "s"}`);
  setStage("training");
  const reply = await api("POST", "/agent/started", { agent: agentChoice(), trainings: queued, epochs: S.epochs,
                                                      estimate: S.estimate, mock: mock(), history: pastTurns() });
  agentSays(reply.message);
  poll();
}

function stopTraining() {
  userSays("Please stop the training.");
  step(stopRun);
}

async function stopRun() {
  for (const one of S.loras) {
    const d = details[one.id];
    if (d && FINAL.includes(d.status)) continue;
    try { await api("POST", `/loras/${one.id}/cancel`); } catch (error) { event(`${one.name}: ${error.message}`); }
  }
  agentSays(plain(words("stopped")));
  poll();
}

async function debrief() {
  S.debriefed = true;
  S.finishedAt = S.finishedAt || Date.now();
  marker("training finished");
  await step(async () => {
    drawBoard();
    const reply = await api("POST", "/agent/debrief", { agent: agentChoice(), loras: S.loras.map((one) => one.id),
                                                        mock: mock(), history: pastTurns() });
    // The LoRAs just trained are the ones to offer for blending, not an older pick.
    S.session = Object.assign({}, S.session, { blend: Object.assign({}, S.session.blend || {}, { loras: [] }) });
    agentSays(reply.message);
    setStage("done");
  });
}

// Forget the last training (not the dataset, nor what the chat set up).
function resetRun() {
  clearTimeout(pollTimer);
  S.loras = []; S.plan = null; S.startedAt = null; S.finishedAt = null;
  S.stamps.training = null; S.stamps.done = null; S.debriefed = false;
  details = {}; logText = {};
}

function trainAgain() {
  userSays("Let's train again with the same data.");
  resetRun();
  S.epochs = null; S.estimate = null;
  S.session = Object.assign({}, S.session, { epochs: null });
  askWait(true);                               // the estimates again, for today's practice-run setting
}

function newDataset() {
  userSays("Let's start with a new dataset.");
  const transcript = S.transcript, conversation = S.conversation;
  S = fresh();
  S.transcript = transcript; S.conversation = conversation;      // the same conversation, a new dataset
  S.stamps.intro = Date.now();
  details = {}; logText = {}; pendingFile = null;
  marker("new dataset");
  agentSays(plain(words("ask_dataset")));
  setStage("dataset");
}

function startOver() {
  clearTimeout(pollTimer); clearTimeout(blendTimer); clearTimeout(testTimer); clearTimeout(verifyTimer);
  jobDetail = null; jobLog = []; testForm = null; verifyLog = [];
  S = fresh();
  details = {}; logText = {}; pendingFile = null; datasetMode = "paste";
  save();
  drawTranscript(); drawBoard();
  if (key && config) intro();
}

// Words typed into the composer go to the guide, which may act on them with
// its tools: the reply says what changed, and what the page must now do.
function send(text) {
  userSays(text);
  step(async () => {
    const reply = await api("POST", "/agent/chat", {
      agent: agentChoice(), message: text, stage: S.stage, session: session(),
      dataset: S.dataset || undefined, context: chatContext(), history: pastTurns().slice(0, -1) });
    await applyChat(reply);
  });
}

// What a chat reply changed, carried out in order -- through the same calls
// the buttons make, so the chat can do nothing a button could not.
async function applyChat(reply) {
  // A name asked for in the chat replaces the ones edited by hand.
  if (reply.session && reply.session.name !== (S.session || {}).name) S.nameEdits = {};
  S.session = reply.session || S.session;
  for (const done of reply.steps || []) toolMarker(done);
  if (reply.analysis) S.analysis = reply.analysis;
  if (reply.preview) S.preview = { records: reply.preview, at: Date.now() };
  agentSays(reply.message);
  for (const action of reply.actions || []) {
    if (action.type === "mock") {
      $("mock").checked = action.on;
      remember("mock", action.on ? "1" : "0");
      S.mock = action.on;
      drawChip();
    } else if (action.type === "dataset") {
      datasetMode = "demo";
      drawAction.demo = action.file;
      await readDataset({ file: action.file });
    } else if (action.type === "choose_dataset") {
      resetRun();
      S.analysis = null; S.dataset = null; S.choices = null; S.preview = null;
      setStage("dataset");
    } else if (action.type === "choices") {
      await fetchWait(true);
    } else if (action.type === "plan") {
      if (S.stage === "done") resetRun();
      await planFor(action.epochs);
    } else if (action.type === "start") {
      if (S.stage === "confirm" && S.plan) await queueTraining();
    } else if (action.type === "stop") {
      await stopRun();
    } else if (action.type === "blend") {
      if (S.stage === "blended" || RELEASE_STAGES.includes(S.stage)) resetBlend();
      await enterBlend(true);
    } else if (action.type === "blend_plan") {
      await planBlend();
    } else if (action.type === "start_blend") {
      if (S.stage === "blend_confirm" && S.blend.plan) await queueBlend();
    } else if (action.type === "stop_blend") {
      await stopBlend();
    } else if (action.type === "start_testing") {
      await startTesting();
    } else if (action.type === "stop_testing") {
      await stopTesting();
    } else if (action.type === "start_verification") {
      await startVerification();
    } else if (action.type === "go_live") {
      await goLive();
    }
  }
  save();
}

function chatContext() {
  const context = {};
  if (S.analysis) context.dataset = { name: S.analysis.name, records: S.analysis.records, stats: S.analysis.stats,
                                      problems: S.analysis.problems };
  if (S.plan) context.plan = { loras: S.plan.map((p) => ({ name: p.name, rank: p.settings.rank })), epochs: S.epochs,
                               estimate: S.estimate && S.estimate.time, mock: mock() };
  if (S.loras.length) context.progress = S.loras.map((one) => {
    const d = details[one.id] || {}, p = d.progress || {};
    return { name: one.name, status: d.status, step: p.step ?? d.steps, of: p.of ?? d.max_steps,
             loss: p.loss ?? d.final_loss };
  });
  const B = S.blend;
  if (BLEND_STAGES.includes(S.stage)) {
    context.my_loras = B.available.map((one) => ({ id: one.id, name: one.name, rank: one.rank, base_model: one.base_model }));
    if (B.plan) context.search_plan = { loras: B.plan.loras.map((one) => one.name), places: B.plan.slots,
                                        questions: B.plan.questions, testing: B.plan.testing, source: B.plan.source,
                                        estimate: B.plan.estimate.time, mock: B.plan.mock };
    if (B.job) context.search = { job: B.job.id, label: B.job.label, status: B.status && B.status.job.status,
                                  progress: B.status && B.status.progress, best: B.result && B.result.best };
  }
  const R = S.release;
  if (R.found) context.blends = R.found.blends.slice(0, 20).map((one) => ({
    number: one.number, formula: one.formula, search_score: one.quality, tested_score: one.tested,
    loras: one.loras, can_be_built: one.state !== "BAD" }));
  if (R.found) context.testing = R.found.testing;
  if (R.report && R.report.report) context.verification = R.report.report;
  // Which blend is live, never its key: a model is not shown a secret.
  if (R.live) context.live = { individual: R.live.deployment.individual, deployment: R.live.deployment.id };
  return context;
}

// --- the second half: combining the LoRAs ------------------------------------------------

function goBlend() {
  userSays("Let's blend my LoRAs.");
  if (S.stage === "blended" || RELEASE_STAGES.includes(S.stage)) resetBlend();
  step(() => enterBlend(false));
}

// The blend step: the user's ready LoRAs and the pick. Quietly when the chat
// sent the page here and has already said why.
async function enterBlend(quiet) {
  const prefer = S.loras.filter((one) => (details[one.id] || {}).status === "ready").map((one) => one.id);
  const reply = await api("POST", "/agent/blend/intro", { agent: agentChoice(), session: session(), prefer,
                                                          history: pastTurns(), quiet });
  S.blend.available = reply.available;
  S.blend.estimate = reply.estimate;
  S.session = Object.assign({}, S.session, { blend: reply.blend });
  S.blend.plan = null;
  if (reply.message) agentSays(reply.message);
  setStage("blend");
}

const blendOf = () => Object.assign({ loras: [], generations: config.blend.generations,
                                      population: config.blend.population, questions: config.blend.questions },
                                    S.session.blend || {});
function setBlend(change) {
  S.session = Object.assign({}, S.session, { blend: Object.assign(blendOf(), change) });
  S.blend.plan = null;
  save();
  drawAction(); drawBoard();
}

function toggleLora(id, on) {
  const loras = blendOf().loras.filter((one) => one !== id);
  if (on) loras.push(id);
  setBlend({ loras });
}

function planBlendNow() {
  const names = blendOf().loras.map((id) => (S.blend.available.find((one) => one.id === id) || {}).name).filter(Boolean);
  userSays(names.length ? `Plan a search over ${names.join(", ")}.` : "Plan the search.");
  step(planBlend);
}

// The search, planned by the agent: the POST /jobs body, read back before it starts.
async function planBlend() {
  const prefer = S.loras.map((one) => one.id);
  let reply;
  try {
    reply = await api("POST", "/agent/blend/plan", { session: session(), mock: mock(), prefer,
                                                     dataset: S.dataset && (S.dataset.file || S.dataset.text) ? S.dataset : undefined });
  } catch (error) {
    if (error.status === 400) { agentSays(plain(error.message)); setStage("blend"); return; }
    throw error;
  }
  S.blend.plan = reply;
  S.session = Object.assign({}, S.session, { blend: reply.blend });
  agentSays(reply.message);
  setStage("blend_confirm");
}

function changeBlend() {
  userSays("Let me change the search.");
  S.blend.plan = null;
  setStage("blend");
}

function startBlend() {
  userSays("Start the search!");
  step(queueBlend);
}

// The plan on screen, sent to the API's own POST /jobs.
async function queueBlend() {
  const plan = S.blend.plan;
  event(`queueing the search ${plan.label}`);
  let reply;
  try {
    reply = await api("POST", "/jobs", plan.job);
  } catch (error) {
    agentSays(plain(`I couldn't queue the search: ${error.message}`));
    setStage("blend");
    return;
  }
  Object.assign(S.blend, { job: { id: reply.job.id, label: reply.job.label, queue_position: reply.job.queue_position },
                           status: { job: reply.job, progress: null }, result: null,
                           startedAt: Date.now(), finishedAt: null, debriefed: false });
  jobDetail = null; jobLog = [];
  marker(`search queued · job ${reply.job.id}`);
  setStage("blending");
  const said = await api("POST", "/agent/blend/started", { agent: agentChoice(), job: S.blend.job, plan,
                                                           history: pastTurns() });
  agentSays(said.message);
  pollBlend();
}

function stopBlendNow() {
  userSays("Please stop the search.");
  step(stopBlend);
}

async function stopBlend() {
  if (!S.blend.job) return;
  try { await api("POST", `/jobs/${S.blend.job.id}/cancel`); } catch (error) { event(`search: ${error.message}`); }
  agentSays(plain(words("blend_stopped")));
  pollBlend();
}

async function pollBlend() {
  clearTimeout(blendTimer);
  const job = S.blend.job;
  if (!job) return;
  let status;
  try {
    status = await api("GET", `/jobs/${job.id}/status`);
  } catch (error) {
    if (error.status === 404) { S.blend.status = { job: { status: "deleted" }, progress: null }; drawBoard(); return; }
    blendTimer = setTimeout(pollBlend, 4000);
    return;
  }
  const before = S.blend.status && S.blend.status.progress;
  const was = S.blend.status && S.blend.status.job.status;
  S.blend.status = status;
  if (was && was !== status.job.status) event(`search: ${was} → ${status.job.status}`);
  const scored = (status.progress || {}).generations_scored;
  if (!jobDetail || !before || before.generations_scored !== scored || JOB_FINAL.includes(status.job.status)) {
    try { jobDetail = (await api("GET", `/jobs/${job.id}`)).results; } catch (_) { /* not yet */ }
  }
  try { jobLog = (await api("GET", `/jobs/${job.id}/log?lines=120`)).lines; } catch (_) { /* gone */ }
  save();
  drawBoard();
  if (S.stage === "blending") drawAction();
  if (JOB_FINAL.includes(status.job.status)) {
    if (!S.blend.debriefed) { if (busy) blendTimer = setTimeout(pollBlend, 1000); else blendDebrief(); }
    return;
  }
  blendTimer = setTimeout(pollBlend, 2000);
}

async function blendDebrief() {
  S.blend.debriefed = true;
  S.blend.finishedAt = S.blend.finishedAt || Date.now();
  marker("search finished");
  await step(async () => {
    const reply = await api("POST", "/agent/blend/debrief", { agent: agentChoice(), job: S.blend.job.id,
                                                              history: pastTurns() });
    S.blend.result = reply.result;
    // What comes after is about this search: the chat's tools read its blends.
    setRelease({ job: S.blend.job.id, individual: null, questions: null, count: null });
    agentSays(reply.message);
    setStage("blended");
  });
}

// Forget the last search (not the LoRAs chosen, nor its size) -- and with it
// what was tested, verified and put live from it.
function resetBlend() {
  clearTimeout(blendTimer);
  const available = S.blend.available, estimate = S.blend.estimate;
  S.blend = Object.assign(freshBlend(), { available, estimate });
  S.stamps.blending = null; S.stamps.blended = null;
  jobDetail = null; jobLog = [];
  resetRelease();
  S.session = Object.assign({}, S.session, { release: {} });
}

function resetRelease() {
  clearTimeout(testTimer); clearTimeout(verifyTimer);
  S.release = freshRelease();
  for (const stage of ["testing", "verifying", "live"]) S.stamps[stage] = null;
  testForm = null; verifyLog = [];
}

// --- the third part: testing the blends, verifying one, putting one live ----------------------

const releaseOf = () => Object.assign({ job: null, individual: null, questions: null, count: null },
                                      S.session.release || {});
const releaseJob = () => releaseOf().job || (S.blend.job && S.blend.job.id);
function setRelease(change) {
  S.session = Object.assign({}, S.session, { release: Object.assign(releaseOf(), change) });
  save();
  drawAction(); drawBoard();
}
const pickedBlend = () => ((S.release.found || {}).blends || []).find((one) => one.number === releaseOf().individual);

function testAll() {
  userSays("Test all the blends on questions the search never saw.");
  step(startTesting);
}

// POST /jobs/{id}/test: every blend of the search, on its testing split.
async function startTesting() {
  const job = releaseJob();
  if (!job) return;
  setRelease({ job });
  let reply;
  try {
    reply = await api("POST", `/jobs/${job}/test`, {});
  } catch (error) {
    if (error.status !== 400 && error.status !== 409) throw error;
    agentSays(plain(`I can't test the blends: ${error.message}`));
    if (!S.release.found && searchFinished()) await loadBlends();
    return;
  }
  S.release.testing = { startedAt: Date.now(), finishedAt: null, debriefed: false, job: reply.job };
  testForm = null; jobLog = [];
  marker(`testing queued · job ${job}`);
  setStage("testing");
  const said = await api("POST", "/agent/test/started", { agent: agentChoice(), history: pastTurns(),
                                                          job: { id: job, queue_position: reply.job.queue_position } });
  agentSays(said.message);
  pollTest();
}

function stopTestingNow() {
  userSays("Please stop the testing.");
  step(stopTesting);
}

async function stopTesting() {
  const job = releaseJob();
  if (!job) return;
  try { await api("POST", `/jobs/${job}/cancel`); } catch (error) { event(`testing: ${error.message}`); }
  agentSays(plain(words("test_stopped")));
  pollTest();
}

async function pollTest() {
  clearTimeout(testTimer);
  const job = releaseJob(), T = S.release.testing;
  if (!job || !T) return;
  let status;
  try {
    status = await api("GET", `/jobs/${job}/status`);
  } catch (error) {
    testTimer = setTimeout(pollTest, 4000);
    return;
  }
  const was = T.job && T.job.status;
  T.job = status.job;
  if (was && was !== status.job.status) event(`testing: ${was} → ${status.job.status}`);
  try { testForm = await api("GET", `/jobs/${job}/test`); } catch (_) { /* gone */ }
  try { jobLog = (await api("GET", `/jobs/${job}/log?lines=120`)).lines; } catch (_) { /* gone */ }
  save();
  drawBoard();
  if (S.stage === "testing") drawAction();
  if (JOB_FINAL.includes(status.job.status)) {
    if (!T.debriefed) { if (busy) testTimer = setTimeout(pollTest, 1000); else testDebrief(); }
    return;
  }
  testTimer = setTimeout(pollTest, 2000);
}

async function testDebrief() {
  S.release.testing.debriefed = true;
  S.release.testing.finishedAt = Date.now();
  marker("testing finished");
  await step(loadBlends);
}

function skipTesting() {
  userSays("Skip the testing — let me pick a blend.");
  step(loadBlends);
}

// Every blend of the search, tested or not, and the one to start from.
async function loadBlends() {
  const reply = await api("POST", "/agent/test/debrief", { agent: agentChoice(), job: releaseJob(),
                                                           session: session(), history: pastTurns() });
  S.release.found = reply.result;
  S.session = Object.assign({}, S.session, { release: reply.release });
  agentSays(reply.message);
  setStage("tested");
}

function pickBlend(number) {
  if (busy || !["tested", "verified", "live"].includes(S.stage)) return;
  setRelease({ individual: number });
}

function verifyNow() {
  const one = pickedBlend();
  userSays(one ? `Verify blend #${one.number} against its LoRAs.` : "Verify the blend.");
  step(startVerification);
}

// The verification, planned by the agent and sent as it is to POST /jobs/{id}/verify.
async function startVerification() {
  let plan, reply;
  try {
    plan = await api("POST", "/agent/verify/plan", { session: session() });
    reply = await api("POST", `/jobs/${releaseJob()}/verify`, plan.body);
  } catch (error) {
    if (error.status !== 400 && error.status !== 409) throw error;
    agentSays(plain(`I couldn't start the verification: ${error.message}`));
    return;
  }
  S.session = Object.assign({}, S.session, { release: plan.release });
  Object.assign(S.release, { plan, report: null,
                             verification: { id: reply.verification.id, row: reply.verification,
                                             startedAt: Date.now(), debriefed: false } });
  verifyLog = [];
  agentSays(plan.message);
  marker(`verification queued · #${reply.verification.id}`);
  setStage("verifying");
  pollVerify();
}

async function pollVerify() {
  clearTimeout(verifyTimer);
  const V = S.release.verification;
  if (!V) return;
  try {
    V.row = (await api("GET", `/verifications/${V.id}`)).verification;
  } catch (error) {
    verifyTimer = setTimeout(pollVerify, 4000);
    return;
  }
  try { verifyLog = (await api("GET", `/verifications/${V.id}/log?lines=120`)).lines; } catch (_) { /* gone */ }
  save();
  drawBoard();
  if (["done", "failed"].includes(V.row.status)) {
    if (!V.debriefed) { if (busy) verifyTimer = setTimeout(pollVerify, 1000); else verifyDebrief(); }
    return;
  }
  verifyTimer = setTimeout(pollVerify, 2000);
}

async function verifyDebrief() {
  const V = S.release.verification;
  V.debriefed = true;
  marker("verification finished");
  await step(async () => {
    const reply = await api("POST", "/agent/verify/debrief", { agent: agentChoice(), verification: V.id,
                                                               history: pastTurns() });
    S.release.report = reply.result;
    agentSays(reply.message);
    setStage("verified");
  });
}

function goLiveNow() {
  const one = pickedBlend();
  userSays(one ? `Put blend #${one.number} live.` : "Put it live.");
  step(goLive);
}

// POST /jobs/{id}/live: the token comes back once and stays in this page --
// the guide is told the deployment, never its key.
async function goLive() {
  let reply;
  try {
    reply = await api("POST", `/jobs/${releaseJob()}/live`, { individual: releaseOf().individual });
  } catch (error) {
    if (error.status !== 400 && error.status !== 409) throw error;
    agentSays(plain(`I couldn't put it live: ${error.message}`));
    return;
  }
  S.release.live = { token: reply.token, deployment: reply.deployment, formula: null,
                     prompt: "", answer: null, asking: false };
  marker(`blend #${reply.deployment.individual} is live · deployment ${reply.deployment.id}`);
  setStage("live");
  const said = await api("POST", "/agent/live/started", { agent: agentChoice(), history: pastTurns(),
                                                          deployment: reply.deployment.id });
  S.release.live.formula = said.formula;
  agentSays(said.message);
}

// POST /infer with the deployment's token, the answer drawn as it streams in.
async function askLive() {
  const L = S.release.live, box = $("livePrompt");
  const prompt = box ? box.value.trim() : "";
  if (!L || !prompt || L.asking) return;
  Object.assign(L, { prompt, answer: "", asking: true });
  drawAction(); drawBoard();
  const entry = { at: Date.now(), method: "POST", path: "/infer", status: null, ms: null };
  activity.push(entry); drawActivity();
  const started = performance.now();
  try {
    const response = await fetch("/infer", { method: "POST", headers: { "Content-Type": "application/json" },
                                             body: JSON.stringify({ token: L.token, prompt }) });
    entry.status = response.status;
    if (!response.ok) {
      let data = null;
      try { data = await response.json(); } catch (_) { /* no body */ }
      throw new Error((data && data.error) || response.status + " " + response.statusText);
    }
    const reader = response.body.getReader(), decoder = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      L.answer += decoder.decode(value, { stream: true });
      drawBoard();
    }
  } catch (error) {
    L.answer = (L.answer || "") + `\n[${error.message}]`;
    if (entry.status === null) entry.status = "down";
  } finally {
    entry.ms = performance.now() - started;
    L.asking = false;
    drawActivity(); save(); drawAction(); drawBoard();
  }
}

function takeDown() {
  userSays("Take it down.");
  step(async () => {
    const L = S.release.live;
    if (L) {
      try { await api("DELETE", `/live/${L.deployment.id}`); } catch (error) { event(`live: ${error.message}`); }
      marker(`deployment ${L.deployment.id} taken down`);
    }
    S.release.live = null;
    setStage(S.release.report ? "verified" : "tested");
  });
}

function chooseAgain() {
  userSays("Let me choose another blend.");
  setStage(S.release.report ? "verified" : "tested");
}

function verifyAnother() {
  userSays("Let me verify another blend.");
  setStage("tested");
}

function blendAgain() {
  userSays("Let's run another search.");
  resetBlend();
  setStage("blend");
}

// --- watching the training ------------------------------------------------------------------

async function poll() {
  clearTimeout(pollTimer);
  if (!S.loras.length) return;
  for (const one of S.loras) {
    const known = details[one.id];
    if (known && FINAL.includes(known.status) && known._settled) continue;
    try {
      const { lora } = await api("GET", `/loras/${one.id}`);
      const before = known && known.status;
      // One more read after it settles: the worker closes the training row a moment later.
      lora._settled = FINAL.includes(lora.status) && before === lora.status;
      details[one.id] = lora;
      if (before && before !== lora.status) {
        event(`${one.name}: ${before} → ${lora.status}`);
        if (lora.status === "training" && logFor !== one.id && (!details[logFor] || FINAL.includes(details[logFor].status))) logFor = one.id;
      }
    } catch (error) {
      if (error.status === 404) details[one.id] = { status: "missing", _settled: true, name: one.name };
    }
  }
  if (logFor !== null) {
    try { logText[logFor] = (await api("GET", `/loras/${logFor}/log?lines=120`)).lines; } catch (_) { /* gone */ }
  }
  const queued = S.loras.every((one) => (details[one.id] || {}).status === "queued");
  queuedSince = queued ? (queuedSince || Date.now()) : null;
  drawBoard();
  const done = S.loras.every((one) => details[one.id] && FINAL.includes(details[one.id].status));
  // The debrief waits its turn if the guide is busy answering something else.
  if (done && !S.debriefed) { if (busy) pollTimer = setTimeout(poll, 1000); else debrief(); return; }
  if (!done) pollTimer = setTimeout(poll, 1500);
}

// Time: elapsed since the plan was queued, and what is left -- the running
// LoRA's own pace for its remaining steps, the estimate for the ones behind it.
function timing() {
  if (!S.startedAt) return { elapsed: null, left: null, fraction: 0 };
  const now = S.finishedAt || Date.now();
  let left = 0, doneSteps = 0, allSteps = 0;
  const est = S.estimate || {};
  for (const one of S.loras) {
    const d = details[one.id] || {}, p = d.progress || {};
    const of = p.of || d.max_steps || est.steps || 1;
    allSteps += of;
    if (FINAL.includes(d.status)) { doneSteps += of; continue; }
    const step = p.step || 0;
    doneSteps += step;
    if (d.status === "training" && step > 0 && p.seconds) left += p.seconds / step * (of - step);
    else left += est.seconds_per_lora || 0;
  }
  const fraction = allSteps ? doneSteps / allSteps : 0;
  return { elapsed: (now - S.startedAt) / 1000, left: S.finishedAt ? 0 : left, fraction };
}

// --- the left side: what the current step asks for ----------------------------------------------

function drawAction() {
  const box = $("action");
  if (!key || !config) return box.replaceChildren();
  const lock = busy;
  const ask = (text) => el("div", { class: "ask" }, text, qm("controls", text),
    busy ? el("span", { class: "typing" }, el("i"), el("i"), el("i")) : null);
  const stage = S.stage;
  let content = [];
  if (!S.transcript.length) content = [];
  else if (stage === "intro") content = [ask("Ready to start?"),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: yes, disabled: lock }, "Yes, let's start"),
      S.readyLoras ? el("button", { class: "lg", onclick: goBlend, disabled: lock }, "Blend my LoRAs") : null,
      el("button", { class: "lg", onclick: notYet, disabled: lock }, "Not yet"))];
  else if (stage === "dataset") content = datasetControls(lock, ask);
  else if (stage === "analysis") content = [ask("Happy with this dataset?"),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: () => askWait(), disabled: lock }, "Use this dataset"),
      el("button", { class: "lg", onclick: anotherDataset, disabled: lock }, "Choose another")),
    el("p", { class: "help" }, words("chat_hint"))];
  else if (stage === "wait") content = [ask("How long can you wait?"),
    el("div", { class: "options" }, (S.choices || []).map((choice) =>
      el("button", { type: "button", class: "option choice", disabled: lock, onclick: () => chooseWait(choice) },
        el("b", {}, choice.label, S.recommended === choice.id ? el("span", { class: "tag rec", style: "margin-left:8px" }, "suggested") : null),
        el("span", { class: "time" }, choice.time),
        el("span", { class: "sub" }, `${choice.epochs} epochs · ${choice.estimate.steps} steps per LoRA — ${choice.blurb}`)))),
    el("p", { class: "help" }, "…or type your own answer below, like “about an hour” or “5 epochs”.")];
  else if (stage === "confirm") content = [ask("Start the training?"),
    nameControls(lock),
    el("div", { class: "buttons" },
      el("button", { class: "primary lg", onclick: startTraining, disabled: lock }, "Start training"),
      el("button", { class: "lg", onclick: changeWait, disabled: lock }, "Change")),
    el("p", { class: "help" }, words("chat_hint"))];
  else if (stage === "training") {
    const { fraction } = timing();
    content = [ask("Training — nothing to do but watch"),
      el("div", { class: "meter big live" }, el("i", { style: `width:${Math.max(2, fraction * 100)}%` })),
