<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual guide · GEP LoRA</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f7; --panel: #ffffff; --panel-2: #f8f9fb; --ink: #161a23; --ink-2: #394150;
    --muted: #626b7a; --faint: #8b93a1; --line: #e3e6eb; --line-2: #d2d7df;
    --accent: #4c5fd5; --accent-ink: #ffffff; --accent-soft: #eceffd;
    --ok: #1e8449; --warn: #b45309; --bad: #c8322f;
    --code: #f1f3f6; --log-bg: #11151f; --log-ink: #cdd5e2;
    --c1: #4c5fd5; --c2: #0e7490; --c3: #c2410c; --c4: #a21caf; --c5: #15803d;
    --me: #eceffd; --me-ink: #1d2766;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --radius: 12px; --top: 56px;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
    /* The three folds, as the report page draws them (generate_html_db_stats.py). */
    --cat: #4b5ee4; --svd: #7b5ce4; --lin: #2596a8;
    /* The LoRAs, one colour each, going round. */
    --l1: #2f7fd6; --l2: #1f9d63; --l3: #d99a1e; --l4: #d2568c; --l5: #0e7490; --l6: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e1117; --panel: #161a22; --panel-2: #1b2029; --ink: #e7eaf0; --ink-2: #c3c9d4;
      --muted: #99a2b1; --faint: #6f7888; --line: #262c38; --line-2: #343b4a;
      --accent: #8b9cff; --accent-ink: #0c0f1f; --accent-soft: #1f2547;
      --ok: #5fd08a; --warn: #f0b454; --bad: #ff7b72;
      --code: #1d222c; --log-bg: #0a0d13; --log-ink: #c3cbd8;
      --c1: #8b9cff; --c2: #5ccfe6; --c3: #fb923c; --c4: #e879f9; --c5: #5fd08a;
      --me: #232a4f; --me-ink: #dfe4ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      --cat: #6f7ff0; --svd: #9a7cf0; --lin: #2aa9bd;
      --l1: #4d95e6; --l2: #2fb577; --l3: #d9a53a; --l4: #e070a3; --l5: #2aa0b8; --l6: #e0703a;
    }
  }

  /* --- base: the guide's ----------------------------------------------------------- */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  h2 { font-size: 13px; margin: 0; }
  h3 { font-size: 13px; margin: 0; font-weight: 600; }
  p { margin: 0 0 8px; }
  a { color: var(--accent); }
  code { font-family: var(--mono); font-size: 12px; background: var(--code); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin: 0 0 4px; }
  input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--panel);
           border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; min-height: 34px;
           transition: border-color .12s, box-shadow .12s; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent);
           box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  textarea { font-family: var(--mono); font-size: 12px; resize: vertical; line-height: 1.45; }
  input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; min-height: 0; margin: 0; }
  button { font: inherit; font-weight: 500; border: 1px solid var(--line-2); background: var(--panel);
           color: var(--ink); border-radius: 8px; padding: 0 12px; min-height: 32px; cursor: pointer;
           white-space: nowrap; transition: background .12s, border-color .12s, color .12s; }
  button:hover:not(:disabled) { background: var(--panel-2); border-color: var(--faint); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); border-color: transparent; }
  button.danger { color: var(--bad); }
  button.ghost { border-color: transparent; background: transparent; }
  button.sm { min-height: 28px; padding: 0 10px; font-size: 13px; }
  button.lg { min-height: 38px; padding: 0 18px; }
  button:disabled { opacity: .45; cursor: default; }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 13px;
                font-weight: 400; margin: 0; cursor: pointer; }
  .help { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 4px; }
  .help:empty { display: none; }
  .help.error { color: var(--bad); }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px 1px 7px; border-radius: 999px;
          font-size: 12px; font-weight: 500; line-height: 1.6; color: var(--muted);
          background: color-mix(in srgb, currentColor 11%, transparent); white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-ok, .s-done { color: var(--ok); } .s-BAD, .s-failed { color: var(--bad); }
  .s-running { color: var(--accent); } .s-queued, .s-incomplete { color: var(--muted); }
  .s-running::before { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .tag { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
         padding: 1px 6px; border-radius: 5px; color: var(--muted); background: var(--code); vertical-align: 1px; }
  .tag.mock { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }

  /* --- the two halves ----------------------------------------------------------------- */
  .halves { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); height: calc(100vh - var(--top)); }
  .agent { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  .board { overflow-y: auto; padding: 20px 22px 40px; min-width: 0; }
  @media (max-width: 960px) {
    .halves { grid-template-columns: minmax(0, 1fr); height: auto; }
    .agent { height: 70vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .board { overflow: visible; padding: 16px; }
  }
  @media (max-width: 560px) { .agent-head { flex-wrap: wrap; row-gap: 4px; } .model-chip { max-width: 100%; order: 5; } }

  .agent-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .agent-head h2 { font-size: 14px; white-space: nowrap; }
  .agent-head > :not(.model-chip):not(.spacer) { flex: none; }
  .spacer { flex: 1; }
  .model-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 9px; font-size: 12px;
                max-width: 230px; min-width: 0; flex: 0 1 auto; border-radius: 999px; color: var(--muted); }
  .model-chip span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .model-chip::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .model-chip.up::before { background: var(--ok); }
  .model-chip.down::before { background: var(--warn); }
  .settings { padding: 12px 16px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); display: grid; gap: 10px; }
  .settings .row { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
  .settings .inline { display: flex; gap: 6px; }

  .transcript { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px; }
  .msg .who { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
  .msg .who .by { font-weight: 400; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bubble { padding: 10px 13px; border-radius: 4px 12px 12px 12px; background: var(--panel-2);
            border: 1px solid var(--line); overflow-wrap: anywhere; }
  .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 20px; }
  .msg.me { align-self: flex-end; max-width: 85%; }
  .msg.me .who { justify-content: flex-end; }
  .msg.me .bubble { background: var(--me); color: var(--me-ink); border-color: transparent; border-radius: 12px 4px 12px 12px; }
  .msg .note { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .msg .note.warn { color: var(--warn); }
  .msg.event { align-self: center; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .msg.event::before, .msg.event::after { content: ""; width: 24px; height: 1px; background: var(--line-2); }
  .msg.event.tool { align-self: flex-start; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; }
  .msg.event.tool::before, .msg.event.tool::after { display: none; }
  .msg.event.tool.failed { color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, var(--panel)); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .action { border-top: 1px solid var(--line); padding: 12px 16px; background: var(--panel); }
  .action:empty { display: none; }
  .action .ask { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .action .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  .composer textarea { font-family: inherit; font-size: 14px; min-height: 38px; max-height: 140px; resize: none; }
  .composer button { min-height: 38px; }
  .gate { margin: auto 0; padding: 24px 20px; }
  .gate h3 { font-size: 16px; margin-bottom: 6px; }

  /* --- the board ------------------------------------------------------------------------ */
  .board-inner { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-head .side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .empty-state { text-align: center; padding: 30px 20px; color: var(--muted); }
  .empty-state b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
  .seg button { border: 0; background: transparent; min-height: 26px; color: var(--muted); font-size: 13px; }
  .seg button.active { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }

  /* The row of pieces: the user's LoRAs and the three folds. */
  .palette { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .palette .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .palette .divider { width: 1px; background: var(--line); margin: 2px 4px; }
  .piece { display: inline-grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; align-items: center; text-align: left;
           padding: 6px 12px 6px 8px; min-height: 42px; border-radius: 10px; cursor: grab; user-select: none; font-weight: 400;
           max-width: 240px; background: var(--panel); border: 1px solid var(--line-2); transition: transform .12s, box-shadow .12s, border-color .12s; }
  .piece:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--faint); }
  .piece:active { cursor: grabbing; }
  .piece .dot { grid-row: span 2; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
                font: 700 10px var(--mono); color: #fff; }
  .piece b { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .piece span { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .piece.fold .dot { width: 34px; border-radius: 7px; }
  /* A fold is not a LoRA: outlined in its own colour, where a LoRA has the plain grey. */
  .piece.fold { border: 1.5px solid var(--fold); background: color-mix(in srgb, var(--fold) 8%, var(--panel)); }
  .piece.fold:hover:not(:disabled) { border-color: var(--fold); background: color-mix(in srgb, var(--fold) 14%, var(--panel)); }
  .piece.dragging { opacity: .45; }
  .palette-note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .model-filter { font-size: 12px; color: var(--muted); }
  .lora-search { width: 190px; min-height: 28px; padding: 2px 10px; font-size: 12px; font-family: inherit; }
  .palette-none { align-self: center; padding: 8px 4px; }
  .model-filter select { width: auto; max-width: 320px; min-height: 28px; padding: 2px 8px; font-size: 12px; }

  /* The tree. */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; margin-bottom: 10px;
             background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; min-height: 46px; }
  .toolbar .what { font-size: 13px; color: var(--ink-2); margin-right: auto; min-width: 0; }
  .toolbar select { width: auto; min-height: 28px; padding: 2px 8px; font-size: 13px; }
  .treewrap { overflow-x: auto; padding: 6px 0 4px; border-radius: 10px;
              background-image: radial-gradient(color-mix(in srgb, var(--line-2) 70%, transparent) 1px, transparent 1px);
              background-size: 16px 16px; }
  svg.tree { display: block; margin: 0 auto; max-width: none; height: auto; font-family: var(--mono); }
  svg.tree .edge { fill: none; stroke: var(--line-2); stroke-width: 1.8; }
  svg.tree .edge.to-empty { stroke-dasharray: 4 4; }
  svg.tree .tnode { cursor: pointer; }
  svg.tree .tnode rect.body { stroke-width: 1.5; transition: filter .12s; }
  svg.tree .tnode:hover rect.body { filter: brightness(1.08); }
  svg.tree text { font-size: 13px; fill: #fff; pointer-events: none; }
  svg.tree .leaf text.name { font-size: 12.5px; font-weight: 600; font-family: system-ui, sans-serif; }
  svg.tree .leaf text.wt, svg.tree .op text.rank { font-size: 10.5px; opacity: .9; }
  svg.tree .op text.sym { font-weight: 700; }
  svg.tree .op-cat rect.body { fill: var(--cat); stroke: var(--cat); }
  svg.tree .op-svd rect.body { fill: var(--svd); stroke: var(--svd); }
  svg.tree .op-lin rect.body { fill: var(--lin); stroke: var(--lin); }
  svg.tree rect.halo { fill: none; stroke-width: 1.6; }
  svg.tree .op-cat rect.halo { stroke: var(--cat); }
  svg.tree .op-svd rect.halo { stroke: var(--svd); }
  svg.tree .op-lin rect.halo { stroke: var(--lin); }
  svg.tree .broken rect.halo { stroke: var(--bad); }
  svg.tree .broken rect.body { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 5 3; }
  svg.tree .broken text.rank { font-weight: 700; }
  svg.tree .empty rect.body { fill: var(--panel); stroke: var(--faint); stroke-dasharray: 5 4; }
  svg.tree .empty text { fill: var(--muted); font-family: system-ui, sans-serif; font-size: 11.5px; }
  svg.tree .empty:hover rect.body, svg.tree .over rect.body { stroke: var(--accent); fill: var(--accent-soft); }
  svg.tree .over rect.body { stroke-width: 3; }
  svg.tree rect.ring { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 3 3; }
  svg.tree .next rect.body { stroke: var(--accent); }
  .verdict { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-top: 12px; font-size: 13px; }
  .verdict .formula { color: var(--ink-2); overflow-wrap: anywhere; }
  .problems { margin: 6px 0 0; padding-left: 18px; color: var(--bad); font-size: 13px; }

  .weights { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin-top: 8px; }
  .weight { padding: 5px 8px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px;
            font-variant-numeric: tabular-nums; }
  .weight b { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 600; margin-right: 4px; }
  .weight i { display: block; height: 3px; margin-top: 4px; border-radius: 3px; background: var(--faint); }
  .weight.used { border-color: var(--accent); background: var(--accent-soft); }
  .weight.used i { background: var(--accent); }
  .seedrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seedrow input { width: 150px; min-height: 30px; font-family: var(--mono); font-size: 12px; }
  .sub { display: flex; align-items: center; gap: 6px; margin: 16px 0 4px; }

  /* The test. */
  .test-grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: end; }
  @media (max-width: 760px) { .test-grid { grid-template-columns: minmax(0, 1fr); } }
  .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center;
          min-height: 80px; border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 12px; cursor: pointer;
          color: var(--muted); font-size: 13px; background: var(--panel-2); }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop b { color: var(--ink); }
  .go { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }

  /* The result. */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; background: var(--panel-2); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  svg.chart { fill: var(--muted); font-size: 12px; max-width: 640px; font-family: system-ui, sans-serif; width: 100%; height: auto; display: block; }
  pre.log { background: var(--log-bg); color: var(--log-ink); border-radius: 8px; margin: 10px 0 0; padding: 12px 14px;
            font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto; }
  details.answers { margin-top: 12px; }
  details.answers summary { cursor: pointer; font-size: 13px; font-weight: 600; }
  .qa { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .qa:last-child { border-bottom: 0; }
  .qa .q { font-weight: 600; margin-bottom: 6px; }
  .qa .a { display: grid; grid-template-columns: 130px minmax(0, 1fr) 48px; gap: 8px; font-size: 13px; padding: 3px 0; }
  .qa .a .who { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qa .a .text { white-space: pre-wrap; color: var(--ink-2); max-height: 7.5em; overflow: auto; }
  .qa .a .score { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .qa .a.blend .who { color: var(--accent); font-weight: 600; }

  /* "What is this?" -- the guide's question marks (ui_help.py). */
  button.qm { display: inline-grid; place-items: center; width: 20px; height: 20px; min-height: 0; padding: 0;
              margin-left: 6px; border: 0; border-radius: 50%; background: transparent; color: var(--faint);
              vertical-align: -5px; cursor: help; }
  button.qm svg { width: 16px; height: 16px; display: block; }
  button.qm:hover:not(:disabled), button.qm:focus-visible { color: var(--accent); background: var(--accent-soft); }
  .explained { animation: explained 1.8s ease-out; border-radius: 10px; }
  @keyframes explained { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); }
                         25% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 25%, transparent); }
                         100% { box-shadow: 0 0 0 0 transparent; } }
  .fresh { animation: arrive .4s ease-out; }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
<script src="/themes/themes.js"></script>
</head>
<body>
<header class="topbar" id="nav" data-page="visual" data-about="draw a blend of your LoRAs, and test it"></header>
<script src="/nav.js"></script>

<div class="halves">
  <!-- left: the guide -->
  <section class="agent" aria-label="The guide">
    <div class="agent-head">
      <h2>Your guide<span id="guideHelp"></span></h2>
      <span id="mockTag" class="tag mock" hidden>practice run</span>
      <span class="spacer"></span>
      <button type="button" class="sm ghost model-chip" id="modelChip" title="Which model the guide talks through"><span>…</span></button>
      <button type="button" class="sm ghost" id="restart" title="Forget this conversation and this drawing, and start again">Start over</button>
    </div>
    <div class="settings" id="settings" hidden>
      <div class="row">
        <div>
          <label for="provider">Provider</label>
          <select id="provider"></select>
        </div>
        <div>
          <label for="model">Model</label>
          <div class="inline">
            <input id="model" list="modelList" placeholder="the provider's default" autocomplete="off">
            <button type="button" class="sm" id="refreshModels" title="Ask the provider which models it has">↻</button>
          </div>
          <datalist id="modelList"></datalist>
        </div>
      </div>
      <div id="baseUrlRow">
        <label for="baseUrl">Endpoint</label>
        <input id="baseUrl" placeholder="http://host:1234/v1" autocomplete="off">
      </div>
      <p class="help" id="providerHelp"></p>
      <label class="check"><input type="checkbox" id="mock"> Practice run — load nothing, random scores, done in seconds</label>
    </div>
    <div class="transcript" id="transcript" aria-live="polite"></div>
    <div class="action" id="action"></div>
    <form class="composer" id="composer">
      <textarea id="say" rows="1" placeholder="Tell me what to draw, or ask anything…" aria-label="Message"></textarea>
      <button type="submit" class="primary" id="send">Send</button>
    </form>
  </section>

  <!-- right: the pieces, the tree, the test -->
  <main class="board" aria-label="The blend">
    <div class="board-inner" id="board"></div>
  </main>
</div>

<script>
"use strict";

// --- state -------------------------------------------------------------------------
//
// The page holds the drawing and the conversation; the server keeps neither.
// S.session is what the chat's tools act on (async_api_agent/visual.py) and what
// POST /blends/check reads: the tree, the weight seed, the test's questions and
// size, and the practice-run switch. Saved to this browser after every change.

const WEIGHTS = ["w1", "w2", "w3", "w4", "w5", "w6", "w7", "w8", "w9", "w10"];
const FOLDS = ["CAT", "SVD", "LIN"];
const LORA_COLOURS = 6;

let key = "";
let config = null;          // GET /agent/config: providers, demo datasets
let visual = null;          // GET /agent/visual/config: the LoRAs, the folds, the page's words
let helpBlocks = {};
let S = fresh();
let busy = false;
let undo = [];              // earlier drawings, for Ctrl+Z; not kept across reloads
let checkTimer = null, checkSeq = 0, pollTimer = null;
let dragged = null;         // the piece being dragged
let datasetMode = "demo";

function conversationId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
}

function emptyTree() { return { op: "CAT", children: [null, null] }; }

function fresh() {
  return { conversation: conversationId(), stage: "drawing", transcript: [],
           session: { tree: emptyTree(), seed: null, questions: null, count: 20, mock: false },
           given: null,          // {text, name}: a dataset pasted or uploaded, sent with the test
           baseModel: null,      // the Pieces filter: a base model, "*" for all, null to follow the blend
           loraQuery: "",        // the Pieces search box: words a LoRA's name must hold
           check: null,          // the last POST /blends/check
           selected: null,       // the path of the place clicked
           test: null,           // {job, verification, check, source, at}: the test asked for
           result: null,         // GET /verifications/{id}: its row and report
           log: [] };
}

const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    if (name === "class") node.className = value;
    else if (name === "html") node.innerHTML = value;
    else if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
    else node.setAttribute(name, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : String(child));
  }
  return node;
}

function remember(name, value) {
  try { localStorage.setItem("gep-visual-" + name, typeof value === "string" ? value : JSON.stringify(value)); } catch (_) { /* private mode */ }
}
function recall(name, parse = false) {
  try {
    const raw = localStorage.getItem("gep-visual-" + name);
    return parse ? (raw ? JSON.parse(raw) : null) : (raw || "");
  } catch (_) { return parse ? null : ""; }
}
const recallKey = gepNav.recallKey, rememberKey = gepNav.rememberKey;

// Kept per API key, as the guide keeps its conversation: a hash of the key, never the key.
function sessionName() {
  let hash = 0x811c9dc5;
  for (let i = 0; i < key.length; i++) hash = Math.imul(hash ^ key.charCodeAt(i), 0x01000193) >>> 0;
  return "session-" + hash.toString(16);
}

function save() {
  const copy = Object.assign({}, S, { log: [] });
  if (copy.given && copy.given.text && copy.given.text.length > 1e6) copy.given = null;
  if (key) remember(sessionName(), copy);
}

const fmt = (value, digits = 3) => (value === null || value === undefined || Number.isNaN(value)) ? "–" : Number(value).toFixed(digits);
const clock = (date) => new Date(date || Date.now()).toTimeString().slice(0, 5);
const pill = (status, text) => el("span", { class: "pill s-" + status }, text || status);

async function api(method, path, body) {
  let response, data = null;
  try {
    response = await fetch(path, {
      method,
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    try { data = await response.json(); } catch (_) { /* empty body */ }
  } catch (_) {
    throw new Error("The API server cannot be reached. Is it running? (run_api_server.bat)");
  }
  if (!response.ok) {
    const stale = response.status === 404 && data && /^no such endpoint/.test(data.error || "");
    const error = new Error(stale ? `${data.error} — the API server is older than this page. Restart it and try again.`
                                  : (data && data.error) || response.status + " " + response.statusText);
    error.status = response.status;
    throw error;
  }
  return data;
}

// --- light Markdown, as the guide renders it ---------------------------------------------

const mdEscape = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mdInline = (s) => mdEscape(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, "$1<i>$2</i>");

function md(text) {
  const out = [];
  let list = null, para = [];
  const flush = () => {
    if (para.length) out.push("<p>" + para.map(mdInline).join("<br>") + "</p>");
    para = [];
    if (list) out.push(`<${list.tag}>` + list.items.map((i) => "<li>" + mdInline(i) + "</li>").join("") + `</${list.tag}>`);
    list = null;
  };
  for (const raw of String(text || "").replace(/\r/g, "").split("\n")) {
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/), number = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (!line.trim()) { flush(); continue; }
    if (bullet || number) {
      const tag = bullet ? "ul" : "ol";
      if (para.length || (list && list.tag !== tag)) flush();
      if (!list) list = { tag, items: [] };
      list.items.push((bullet || number)[1]);
      continue;
    }
    if (list) flush();
    para.push(line.replace(/^#+\s*/, ""));
  }
  flush();
  return out.join("");
}

// --- the transcript ---------------------------------------------------------------------

function agentSays(message, extra = {}) {
  S.transcript.push(Object.assign({ who: "agent", text: message.text, by: message.by, note: message.note,
                                    warn: Boolean(message.fallback && message.note), at: Date.now() }, extra));
  save(); drawTranscript();
}
function userSays(text) { S.transcript.push({ who: "me", text, at: Date.now() }); save(); drawTranscript(); }
function marker(text) { S.transcript.push({ who: "event", text, at: Date.now() }); save(); drawTranscript(); }
function toolMarker(done) {
  S.transcript.push({ who: "event", tool: true, ok: done.ok, text: done.summary, at: Date.now() });
  save(); drawTranscript();
}
const words = (name) => (visual && visual.words && visual.words[name]) || "";
const plain = (text) => ({ text, by: "built-in wording", note: null });

function pastTurns() {
  return S.transcript.filter((m) => m.who !== "event")
    .map((m) => ({ role: m.who === "me" ? "user" : "assistant", content: m.text }));
}

let thinking = false;
function drawTranscript() {
  const box = $("transcript");
  box.replaceChildren(...S.transcript.map((m) => {
    if (m.who === "event") return el("div", { class: "msg event" + (m.tool ? " tool" : "") + (m.tool && !m.ok ? " failed" : "") },
      m.tool ? el("span", { "aria-hidden": "true" }, "⚙") : null, m.text);
    const me = m.who === "me";
    return el("div", { class: "msg" + (me ? " me" : "") },
      el("div", { class: "who" }, me ? "You" : "Guide",
         !me && m.by ? el("span", { class: "by", title: m.by }, "· " + m.by) : null,
         el("span", { class: "by" }, clock(m.at))),
      el("div", { class: "bubble", html: md(m.text) }),
      m.note ? el("div", { class: "note" + (m.warn ? " warn" : "") }, m.note) : null);
  }), ...(thinking ? [el("div", { class: "msg" }, el("div", { class: "who" }, "Guide"),
    el("div", { class: "bubble" }, el("span", { class: "typing", "aria-label": "thinking" }, el("i"), el("i"), el("i"))))] : []));
  box.scrollTop = box.scrollHeight;
}

// One thing at a time: nothing else can be asked while the guide is answering.
async function step(work) {
  if (busy) return;
  busy = true; thinking = true;
  drawTranscript(); drawAction(); $("send").disabled = true;
  try {
    await work();
  } catch (error) {
    agentSays(plain("Something went wrong: " + error.message), { note: "It can be tried again.", warn: true });
  } finally {
    busy = false; thinking = false;
    $("send").disabled = false;
    drawTranscript(); drawAction(); drawBoard();
  }
}

function setStage(stage) { S.stage = stage; save(); drawAction(); drawBoard(); }

// --- "what is this?" --------------------------------------------------------------------

const QM_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true">' +
  '<circle cx="8" cy="8" r="7" fill="currentColor" opacity=".12"/>' +
  '<circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.3"/>' +
  '<path d="M6.2 6.3a1.85 1.85 0 1 1 2.6 1.7c-.5.25-.8.6-.8 1.15v.35" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
  '<circle cx="8" cy="11.5" r=".95" fill="currentColor"/></svg>';

function qm(block, title) {
  if (!helpBlocks[block]) return null;
  const question = `What is “${title}”?`;
  return el("button", { type: "button", class: "qm", title: question, "aria-label": question, disabled: busy, html: QM_SVG,
                        onclick: (e) => { e.stopPropagation(); explain(block, title, e.currentTarget); } });
}

// A card with its question mark in the heading.
function helped(block, node) {
  const head = node.querySelector(".card-head h3");
  const button = head && qm(block, head.textContent);
  if (button) head.append(button);
  return node;
}

function explain(block, title, button) {
  if (busy || !config) return;
  const box = button.closest("section.card") || button.closest(".sub")?.parentElement || button.closest(".agent-head");
  const shown = box ? [box.innerText || "", ...[...box.querySelectorAll("svg title")].map((one) => one.textContent)].join("\n").trim() : "";
  if (box) { box.classList.remove("explained"); void box.offsetWidth; box.classList.add("explained"); }
  const past = pastTurns();
  userSays(`What is “${title}”?`);
  step(async () => {
    const reply = await api("POST", "/agent/help", { agent: agentChoice(), block, title, shown, stage: "visual_" + S.stage, history: past });
    agentSays(reply.message);
  });
}

// --- the drawing ------------------------------------------------------------------------
//
// The same edits the chat's tools make (visual.py's Toolbox), done here for the
// buttons, the clicks and the drops. A place is a path: "" the top, "0" its
// left side, "1.0" the right side's left side.

function at(tree, path) {
  let parent = null, index = null, node = tree;
  for (const part of path ? path.split(".") : []) {
    if (!node || !node.op) return null;
    parent = node; index = Number(part); node = node.children[index];
  }
  return { parent, index, node };
}

function places(tree) {
  const out = [], queue = [["", tree]];
  while (queue.length) {
    const [path, node] = queue.shift();
    out.push([path, node]);
    if (node && node.op) node.children.forEach((child, i) => queue.push([path === "" ? String(i) : path + "." + i, child]));
  }
  return out;
}

const firstEmpty = (tree) => (places(tree).find(([, node]) => node === null) || [null])[0];
// A place in words, as drawn.place() says it: "the top", "right › left".
const where = (path) => path === "" ? "the top" : path.split(".").map((p) => p === "0" ? "left" : "right").join(" › ");
const loraById = (id) => (visual ? visual.loras : []).find((one) => one.id === id);
const loraName = (id) => (loraById(id) || {}).name || `LoRA #${id}`;
// A LoRA only attaches to the model it was trained on, so one blend is one base model.
const ALL_MODELS = "*";
const modelOf = (one) => (one && one.base_model) || "unknown base model";
// The base models the drawing already uses, leaving out the place at `except`.
function blendModels(tree, except = null) {
  return [...new Set(places(tree).filter(([path, n]) => n && n.lora !== undefined && path !== except)
    .map(([, n]) => modelOf(loraById(n.lora))))];
}
// Which base model the Pieces show: the one chosen, else the blend's, else the one
// most of the user's LoRAs are on.
function shownModel() {
  const loras = (visual && visual.loras) || [];
  const known = new Set(loras.map(modelOf));
  if (S.baseModel === ALL_MODELS || (S.baseModel && known.has(S.baseModel))) return S.baseModel;
  const used = blendModels(S.session.tree);
  if (used.length) return used[0];
  const counts = {};
  for (const one of loras) counts[modelOf(one)] = (counts[modelOf(one)] || 0) + 1;
  return Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))[0] || ALL_MODELS;
}

const loraColour = (id) => {
  const index = (visual ? visual.loras : []).findIndex((one) => one.id === id);
  return `var(--l${((index < 0 ? 0 : index) % LORA_COLOURS) + 1})`;
};

function nextWeight(tree) {
  const used = new Set(places(tree).filter(([, n]) => n && n.lora !== undefined).map(([, n]) => n.weight));
  return WEIGHTS.find((w) => !used.has(w)) || "w1";
}

// Change the drawing: remembered for undo, saved, and read again by the server.
function edit(change, note) {
  const before = JSON.stringify(S.session.tree);
  const tree = JSON.parse(before);
  const outcome = change(tree);
  if (outcome === false) return false;
  undo.push(before);
  if (undo.length > 100) undo.shift();
  // A change at the top hands back the new top, since it cannot be changed in place.
  S.session.tree = outcome && outcome.tree !== undefined ? outcome.tree : tree;
  if (outcome && outcome.select !== undefined) S.selected = outcome.select;
  save(); drawBoard(); drawAction();
  scheduleCheck();
  if (note) flash(note);
  return true;
}

function undoLast() {
  if (!undo.length) return;
  S.session.tree = JSON.parse(undo.pop());
  if (S.selected !== null && !at(S.session.tree, S.selected)) S.selected = null;
  save(); drawBoard(); scheduleCheck();
}

let flashText = "";
function flash(text) { flashText = text; drawBoard(); setTimeout(() => { if (flashText === text) { flashText = ""; drawBoard(); } }, 2600); }

// A LoRA put at a place: an empty one, or over a LoRA (keeping its weight); on
// a fold, into its first empty side. At the top, that makes a blend of one LoRA.
function putLora(path, id) {
  return edit((tree) => {
    let found = at(tree, path);
    if (!found) return false;
    if (found.node && found.node.op) {
      const i = found.node.children.findIndex((child) => child === null);
      if (i < 0) { flash(`The ${found.node.op} at ${where(path)} is full — click one of its sides first.`); return false; }
      path = path === "" ? String(i) : path + "." + i;
      found = { parent: found.node, index: i, node: null };
    }
    const others = blendModels(tree, path), mine = modelOf(loraById(id));
    if (others.length && !others.includes(mine)) {
      flash(`${loraName(id)} was trained on ${mine}, and your blend is on ${others.join(", ")} — `
            + "a blend needs all its LoRAs on one base model.");
      return false;
    }
    const weight = found.node && found.node.lora !== undefined ? found.node.weight : nextWeight(tree);
    const made = { lora: id, weight };
    if (!found.parent) return { tree: made, select: "" };
    found.parent.children[found.index] = made;
    const next = firstEmpty(tree);
    return { select: next };
  });
}

// A fold put at a place: an empty one gets two empty sides, a fold changes
// kind, and a LoRA is folded with a new empty place beside it. The top too.
function putFold(path, op) {
  return edit((tree) => {
    const found = at(tree, path);
    if (!found) return false;
    if (found.node && found.node.op) {
      if (found.node.op === op) return false;
      found.node.op = op;
      return { select: firstEmpty(tree) ?? path };
    }
    const made = { op, children: [found.node, null] };
    if (!found.parent) return { tree: made, select: firstEmpty(made) ?? path };
    found.parent.children[found.index] = made;
    return { select: firstEmpty(tree) ?? path };
  });
}

function setWeight(path, weight) {
  edit((tree) => { const found = at(tree, path); if (!found || !found.node || found.node.lora === undefined) return false; found.node.weight = weight; });
}
function clearPlace(path) {
  edit((tree) => {
    const found = at(tree, path);
    if (!found || found.node === null) return false;
    if (!found.parent) return { tree: null, select: "" };     // the top: nothing drawn
    found.parent.children[found.index] = null;
    return { select: path };
  });
}
function swapSides(path) {
  edit((tree) => { const found = at(tree, path); if (!found || !found.node || !found.node.op) return false; found.node.children.reverse(); });
}
function startDrawingOver() {
  undo.push(JSON.stringify(S.session.tree));
  S.session.tree = emptyTree(); S.selected = "0";
  save(); drawBoard(); drawAction(); scheduleCheck();
}

// A piece pressed in the palette: at the place selected, else the first empty one.
function usePiece(piece, path = null) {
  const target = path ?? S.selected ?? firstEmpty(S.session.tree);
  if (target === null || target === undefined) { flash("Every place is filled — click a node to replace it, or a fold to change it."); return; }
  if (piece.kind === "lora") putLora(target, piece.id);
  else putFold(target, piece.op);
}

// --- asking the server what the drawing is --------------------------------------------------

function scheduleCheck(now = false) {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(runCheck, now ? 0 : 250);
}

async function runCheck() {
  const seq = ++checkSeq;
  const sentTree = JSON.stringify(S.session.tree), sentSeed = S.session.seed;
  try {
    const found = await api("POST", "/blends/check", { tree: S.session.tree, seed: S.session.seed });
    // Only the reading of the drawing on screen: an answer about an older one is dropped.
    if (seq !== checkSeq || sentTree !== JSON.stringify(S.session.tree)
        || (sentSeed !== null && sentSeed !== S.session.seed)) return;
    S.check = found;
    if (S.session.seed === null) S.session.seed = found.seed;     // a seed drawn once, then kept
    S.checkError = null;
  } catch (error) {
    if (seq !== checkSeq) return;
    S.checkError = error.message;
  }
  save(); drawBoard(); drawAction();
}

function newWeights(seed = null) {
  S.session.seed = seed;
  save(); scheduleCheck(true);
}

// --- the board ------------------------------------------------------------------------------

function card(title, side, ...body) {
  return el("section", { class: "card" },
    el("div", { class: "card-head" }, el("h3", {}, title), side ? el("div", { class: "side" }, side) : null), ...body);
}

// The board is redrawn whole, and a redraw replaces every control on it -- which
// closes a drop-down someone has open and drops a field they are typing in. So
// while a control on the board has the focus, a redraw from the background (a
// check coming back, a poll, a message timing out) waits until it is left; one
// caused by a choice made in that control goes ahead at once.
let boardWaiting = false, boardChanged = false;
const holdingBoard = () => {
  const active = document.activeElement;
  return Boolean(active && /^(SELECT|INPUT|TEXTAREA)$/.test(active.tagName) && $("board").contains(active));
};
// Set before the control's own handler runs (capture), cleared once it has.
$("board").addEventListener("change", () => { boardChanged = true; setTimeout(() => { boardChanged = false; }, 0); }, true);
const catchUp = () => { if (boardWaiting && !holdingBoard()) drawBoard(); };
$("board").addEventListener("focusout", () => setTimeout(catchUp, 0));
// And a look every half second, since a window without the focus gets no focus events.
setInterval(catchUp, 500);

function drawBoard() {
  if (key && visual && holdingBoard() && !boardChanged) { boardWaiting = true; return; }
  boardWaiting = false; boardChanged = false;
  if (!key || !visual) return $("board").replaceChildren(card("Nothing yet", null, el("div", { class: "empty-state" },
    el("b", {}, "Waiting for your API key"), el("p", {}, "Paste it on the left to begin."))));
  const scroll = document.querySelector(".treewrap")?.scrollLeft || 0;
  const log = document.querySelector("pre.log");
  const stuck = log ? log.scrollTop + log.clientHeight >= log.scrollHeight - 20 : true;
  const cards = [helped("visual_palette", paletteCard()), helped("visual_tree", treeCard()), helped("visual_test", testCard())];
  if (S.test) cards.push(helped("visual_result", resultCard()));
  $("board").replaceChildren(...cards);
  const wrap = document.querySelector(".treewrap");
  if (wrap) wrap.scrollLeft = scroll;
  const again = document.querySelector("pre.log");
  if (again && stuck) again.scrollTop = again.scrollHeight;
}

// The row of pieces: every ready LoRA of theirs, then the three folds.
// Every word typed must appear in the LoRA's name, rank ("r16") or base model.
const loraText = (one) => `${one.name} r${one.rank ?? ""} ${modelOf(one)}`.toLowerCase();
const matchesQuery = (one) => (S.loraQuery || "").toLowerCase().split(/\s+/).filter(Boolean)
  .every((word) => loraText(one).includes(word));

// The search box filters the pieces already drawn -- hiding, not redrawing -- so
// the box keeps the cursor while you type.
function applyLoraQuery() {
  const pieces = [...document.querySelectorAll(".palette .piece[data-lora]")];
  let visible = 0;
  for (const node of pieces) {
    const ok = matchesQuery(loraById(Number(node.dataset.lora)) || {});
    node.hidden = !ok;
    visible += ok;
  }
  const none = document.querySelector(".palette-none");
  if (none) none.hidden = visible > 0 || !pieces.length;
  const count = document.querySelector(".palette-count");
  if (count) count.textContent = countText(visible, (visual.loras || []).length);
}
const countText = (visible, total) => visible === total ? `${total} LoRA(s) of yours` : `${visible} of your ${total} LoRAs`;

function paletteCard() {
  const all = visual.loras, shown = shownModel();
  const loras = shown === ALL_MODELS ? all : all.filter((one) => modelOf(one) === shown);
  const used = blendModels(S.session.tree);
  const counts = {};
  for (const one of all) counts[modelOf(one)] = (counts[modelOf(one)] || 0) + 1;
  const models = Object.keys(counts).sort();
  const filter = models.length > 1 ? el("label", { class: "check model-filter" }, "Base model",

// The drawing, laid out the way the report draws a chromosome
// (generate_html_db_stats.tree_svg): a LoRA and its weight are one leaf, each
// leaf or empty place takes the next spot along, a fold sits over its sides.
function treeSvg() {
  const ns = "http://www.w3.org/2000/svg";
  const make = (tag, attrs = {}, text) => {
    const node = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const step = 150, level = 96, opW = 100, opH = 44, leafW = 134, leafH = 50, mx = 20, my = 16;
  const nodes = (S.check || {}).nodes || {};
  const weights = (S.check || {}).weights || {};
  const placed = [];
  let counter = 0, deepest = 0;
  const visit = (node, path, depth) => {
    deepest = Math.max(deepest, depth);
    let entry;
    if (node && node.op) {
      const kids = node.children.map((child, i) => visit(child, path === "" ? String(i) : path + "." + i, depth + 1));
      entry = { kind: "op", node, path, depth, kids, x: kids.reduce((s, k) => s + k.x, 0) / kids.length };
    } else {
      entry = { kind: node ? "leaf" : "empty", node, path, depth, kids: [], x: mx + counter * step + step / 2 };
      counter += 1;
    }
    placed.push(entry);
    return entry;
  };
  visit(S.session.tree, "", 0);
  const width = mx * 2 + Math.max(1, counter) * step, height = my * 2 + deepest * level + leafH + 6;
  const svg = make("svg", { class: "tree", viewBox: `0 0 ${width} ${height}`, width, role: "img",
                            "aria-label": "the blend, as a tree" });
  const y = (entry) => my + entry.depth * level;
  const next = firstEmpty(S.session.tree);
  for (const entry of placed) {
    if (entry.kind !== "op") continue;
    for (const kid of entry.kids) {
      const sy = y(entry) + opH, ey = y(kid), mid = (sy + ey) / 2;
      svg.append(make("path", { class: "edge" + (kid.kind === "empty" ? " to-empty" : ""),
        d: `M${entry.x} ${sy} C ${entry.x} ${mid}, ${kid.x} ${mid}, ${kid.x} ${ey}` }));
    }
  }
  for (const entry of placed) {
    const info = nodes[entry.path] || {};
    const top = y(entry);
    const g = make("g", { class: "tnode " + entry.kind + (entry.kind === "op" ? " op-" + entry.node.op.toLowerCase() : "")
                     + (info.broken ? " broken" : "") + (entry.path === next && entry.kind === "empty" ? " next" : ""),
                     tabindex: "0", "data-path": entry.path });
    const w = entry.kind === "op" ? opW : leafW, h = entry.kind === "op" ? opH : leafH;
    const x0 = entry.x - w / 2;
    let title;
    if (entry.kind === "op") {
      g.append(make("rect", { class: "halo", x: x0 - 4, y: top - 4, width: w + 8, height: h + 8, rx: 13 }));
      g.append(make("rect", { class: "body", x: x0, y: top, width: w, height: h, rx: 10 }));
      g.append(make("text", { class: "sym", x: entry.x, y: top + 19, "text-anchor": "middle" }, entry.node.op));
      g.append(make("text", { class: "rank", x: entry.x, y: top + 35, "text-anchor": "middle" },
        info.rank !== undefined ? (info.broken ? "ranks differ" : `rank ${info.rank}`) : "rank ?"));
      title = `${entry.node.op} at ${where(entry.path)} — ${visual.folds[entry.node.op]}` + (info.rank !== undefined ? `, rank ${info.rank}` : "")
        + (info.broken ? ". PEFT cannot build this: its two sides have different ranks." : "");
    } else if (entry.kind === "leaf") {
      const name = loraName(entry.node.lora);
      // A LoRA alone at the top has no fold to apply its weight: it runs at full strength.
      const alone = entry.path === "";
      const value = weights[entry.node.weight];
      const body = make("rect", { class: "body", x: x0, y: top, width: w, height: h, rx: 10 });
      body.style.fill = loraColour(entry.node.lora); body.style.stroke = loraColour(entry.node.lora);
      g.append(body);
      g.append(make("text", { class: "name", x: entry.x, y: top + 21, "text-anchor": "middle" }, name.length > 17 ? name.slice(0, 16) + "…" : name));
      g.append(make("text", { class: "wt", x: entry.x, y: top + 38, "text-anchor": "middle" },
        `${alone ? "full strength" : entry.node.weight + (value !== undefined ? " = " + fmt(value, 3) : "")}${info.rank !== undefined ? " · r" + info.rank : ""}`));
      title = alone ? `${name} alone, at full strength${info.rank !== undefined ? ", rank " + info.rank : ""} — fold it with something to weight it`
        : `${name} at ${entry.node.weight}${value !== undefined ? " = " + fmt(value, 4) : ""}${info.rank !== undefined ? ", rank " + info.rank : ""}`;
    } else {
      g.append(make("rect", { class: "body", x: x0, y: top, width: w, height: h, rx: 10 }));
      g.append(make("text", { x: entry.x, y: top + 22, "text-anchor": "middle" }, "+"));
      g.append(make("text", { x: entry.x, y: top + 38, "text-anchor": "middle" }, words("empty_place")));
      title = `An empty place at ${where(entry.path)}`;
    }
    g.append(make("title", {}, title));
    const pad = entry.kind === "op" ? 8 : 5;
    if (entry.path === S.selected) g.append(make("rect", { class: "ring", x: x0 - pad, y: top - pad, width: w + 2 * pad, height: h + 2 * pad, rx: 10 + pad }));
    const pick = () => { S.selected = S.selected === entry.path ? null : entry.path; flashText = ""; save(); drawBoard(); };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    g.addEventListener("dragover", (e) => { if (!dragged) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; g.classList.add("over"); });
    g.addEventListener("dragleave", () => g.classList.remove("over"));
    g.addEventListener("drop", (e) => {
      e.preventDefault(); g.classList.remove("over");
      let data = dragged;
      try { data = data || JSON.parse(e.dataTransfer.getData("text/plain")); } catch (_) { /* not a piece */ }
      dragged = null;
      if (data && (data.kind === "lora" || data.kind === "fold")) usePiece(data, entry.path);
    });
    svg.append(g);
  }
  return svg;
}

function setQuestions(questions) { S.session.questions = questions; save(); drawBoard(); drawAction(); }

function useGiven(text, name) {
  S.given = { text, name };
  setQuestions({ given: name });
}

async function readFile(file) {
  if (file.size > 20 * 1024 * 1024) return flash("That file is over 20 MB — pick a smaller one.");
  useGiven(await file.text(), file.name);
}

function startTest() {
  if (busy) return;
  step(async () => {
    const planned = await api("POST", "/agent/visual/plan", { session: session() });
    const body = Object.assign({}, planned.test);
    if (body.dataset && body.dataset.given) {
      if (!S.given) throw new Error("the dataset you gave is no longer in this browser — give it again");
      body.dataset = { text: S.given.text, name: S.given.name };
    }
    agentSays(planned.message);
    const reply = await api("POST", "/blends/test", body);
    S.test = { job: reply.job, verification: reply.verification, check: reply.blend, source: planned.source, at: Date.now() };
    linkToJob();
    S.result = null; S.log = [];
    marker(`test queued · verification ${reply.verification.id}`);
    agentSays(plain(words("started")));
    setStage("testing");
    poll();
  });
}

const session = () => Object.assign({}, S.session, { mock: $("mock").checked });

async function poll() {
  clearTimeout(pollTimer);
  if (!S.test || !key) return;
  const id = S.test.verification.id;
  try {
    const reply = await api("GET", `/verifications/${id}`);
    S.result = reply.verification;
    try { S.log = (await api("GET", `/verifications/${id}/log?lines=60`)).lines || []; } catch (_) { /* no log yet */ }
  } catch (error) {
    if (error.status === 404) { S.test = null; S.result = null; setStage("drawing"); return; }
  }
  save(); drawBoard();
  const status = S.result && S.result.status;
  if (status === "done" || status === "failed") {
    if (S.stage === "testing") {
      setStage("tested");
      step(async () => {
        const reply = await api("POST", "/agent/visual/debrief", { agent: agentChoice(), verification: id, history: pastTurns() });
        agentSays(reply.message);
      });
    }
    return;
  }
  pollTimer = setTimeout(poll, 3000);
}

// The tested blend's LoRAs by slot, so a result row is named, not "L2".

  const slots = (S.test && S.test.check && S.test.check.slots) || {};

function meansChart(rows) {
  const ns = "http://www.w3.org/2000/svg";
  const make = (tag, attrs = {}, text) => { const n = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text !== undefined) n.textContent = text; return n; };
  const bar = 20, gap = 7, left = 130, width = 440, height = rows.length * (bar + gap) + 10;
  const svg = make("svg", { class: "chart", viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": "average score of each contestant" });
  rows.forEach((one, i) => {
    const top = 4 + i * (bar + gap), w = Math.max(2, (width - left - 60) * (one.mean || 0));
    svg.append(make("text", { x: left - 8, y: top + 15, "text-anchor": "end", fill: "var(--ink-2)", "font-weight": one.key === "blend" ? 700 : 400 }, contestantName(one.key)));
    const r = make("rect", { x: left, y: top, width: w, height: bar, rx: 5, fill: one.key === "blend" ? "var(--accent)" : "var(--faint)" });
    r.append(make("title", {}, `${contestantName(one.key)}: ${fmt(one.mean)}`));
    svg.append(r);
    svg.append(make("text", { x: left + w + 6, y: top + 15, fill: "var(--ink)" }, fmt(one.mean)));
  });
  return svg;
}

function answersBlock(report) {
  const keys = ["blend", ...Object.keys(report.answers).filter((k) => k !== "blend").sort()];
  const count = (report.answers.blend || []).length;
  return el("details", { class: "answers" }, el("summary", {}, `Every answer, question by question (${count})`),
    ...Array.from({ length: count }, (_, i) => el("div", { class: "qa" },
      el("div", { class: "q" }, `${i + 1}. ${(report.answers.blend[i] || {}).question || ""}`),
      ...keys.map((k) => { const one = (report.answers[k] || [])[i] || {};
        return el("div", { class: "a" + (k === "blend" ? " blend" : ""), title: one.reason || "" },
          el("span", { class: "who" }, contestantName(k)), el("span", { class: "text" }, one.answer || "—"),
          el("span", { class: "score" }, fmt(one.quality, 2))); }))));
}

// --- the left: what to do now ---------------------------------------------------------------

function drawAction() {
  if (!key || !visual) return $("action").replaceChildren();
  const instruction = (visual.words.instructions || {})[S.stage] || "";
  const ready = S.check && S.check.state === "ok" && S.session.questions && S.stage !== "testing";
  $("action").replaceChildren(el("div", { class: "ask" }, S.stage === "testing" ? "Testing" : S.stage === "tested" ? "Tested" : "Drawing"),
    el("div", { class: "small", html: md(instruction) }),
    el("div", { class: "buttons" },
      el("button", { type: "button", class: "primary", onclick: startTest, disabled: busy || !ready }, "Test this blend"),
      el("button", { type: "button", class: "sm ghost", onclick: undoLast, disabled: busy || !undo.length }, "Undo")),
    el("p", { class: "help" }, words("hint")));
}

// --- the chat ---------------------------------------------------------------------------------

function agentChoice() {
  return { provider: $("provider").value, model: $("model").value.trim() || undefined,
           base_url: $("baseUrlRow").hidden ? undefined : ($("baseUrl").value.trim() || undefined),
           conversation: S.conversation };
}

function chatContext() {
  const report = S.result && S.result.report;
  if (!report) return {};
  return { result: { formula: S.test.check.formula, questions: report.meta.questions,
                     means: Object.fromEntries(report.summary.map((one) => [contestantName(one.key), one.mean])) } };
}

async function send(text) {
  userSays(text);
  let wantsTest = false;
  await step(async () => {
    const before = JSON.stringify(S.session.tree);
    const reply = await api("POST", "/agent/visual/chat", {
      agent: agentChoice(), message: text, stage: S.stage, session: session(), context: chatContext(),
      history: pastTurns().slice(0, -1) });
    for (const done of reply.steps || []) toolMarker(done);
    if (reply.session) {
      if (JSON.stringify(reply.session.tree) !== before) { undo.push(before); S.selected = null; }
      S.session = reply.session;
      $("mock").checked = S.session.mock; drawChip();
      if (S.session.questions && S.session.questions.given && !S.given) S.session.questions = null;
    }
    if (reply.check) S.check = reply.check;
    agentSays(reply.message);
    save(); drawBoard();
    wantsTest = (reply.actions || []).some((action) => action.type === "test");
  });
  // Started once the reply is in, through the button's own path.
  if (wantsTest) startTest();
}

// --- the model the guide talks through: the guide's own picker -------------------------------

function fillProviders() {
  const saved = JSON.parse(localStorage.getItem("gep-agent-agent") || "null") || {};
  $("provider").replaceChildren(...config.providers.map((p) =>
    el("option", { value: p.name }, p.label + (p.ready ? "" : ` — needs ${p.key_env}`))));
  $("provider").value = config.providers.some((p) => p.name === saved.provider) ? saved.provider : config.default.provider;
  $("model").value = saved.provider === $("provider").value ? (saved.model || "") : (config.default.model || "");
  $("baseUrl").value = saved.provider === $("provider").value ? (saved.base_url || "") : "";
  $("mock").checked = Boolean(S.session.mock);
  providerChanged(false);
}

function provider() { return config.providers.find((p) => p.name === $("provider").value); }

function providerChanged(clear = true) {
  const p = provider();
  if (clear) { $("model").value = ""; $("baseUrl").value = ""; }
  $("baseUrlRow").hidden = !(p.local && p.kind === "openai");
  $("baseUrl").placeholder = p.base_url || "";
  $("model").placeholder = p.model ? p.model : p.kind === "scripted" ? "no model" : "the first model it lists";
  $("model").disabled = p.kind === "scripted";
  $("refreshModels").disabled = p.kind === "scripted";
  rememberAgent();
  loadModels();
}

// The same choice the guide remembers, so both guides talk through one model.
function rememberAgent() {
  try { localStorage.setItem("gep-agent-agent", JSON.stringify({ provider: $("provider").value, model: $("model").value.trim(), base_url: $("baseUrl").value.trim() })); } catch (_) { /* private mode */ }
  drawChip();
}

let modelState = { ok: null, text: "" };
async function loadModels() {
  const p = provider();
  if (p.kind === "scripted") { modelState = { ok: true, text: "The guide uses its built-in wording; no model is asked." }; return drawChip(); }
  if (!p.ready) { modelState = { ok: false, text: `Set ${p.key_env} in the environment the API server runs in, then restart it. Until then the guide uses its built-in wording.` }; return drawChip(); }
  modelState = { ok: null, text: "Asking for its models…" }; drawChip();
  const query = new URLSearchParams({ provider: p.name });
  if (!$("baseUrlRow").hidden && $("baseUrl").value.trim()) query.set("base_url", $("baseUrl").value.trim());
  try {
    const reply = await api("GET", "/agent/models?" + query);
    $("modelList").replaceChildren(...reply.models.map((m) => el("option", { value: m })));
    const using = $("model").value.trim() || reply.default || reply.models[0];
    modelState = { ok: true, using, text: `${reply.models.length} model(s) at ${reply.base_url}.` + (using ? ` Talking to ${using}.` : "") };
  } catch (error) {
    modelState = { ok: false, text: error.message + " — the guide falls back to its built-in wording." };
  }
  drawChip();
}

function drawChip() {
  const p = config && provider();
  if (!p) return;
  const model = $("model").value.trim() || (p.kind === "scripted" ? "" : modelState.using || p.model || "auto");
  $("modelChip").querySelector("span").textContent = p.label.replace(/ \(.*\)$/, "") + (model ? " · " + model : "");
  $("modelChip").className = "sm ghost model-chip " + (modelState.ok === true ? "up" : modelState.ok === false ? "down" : "");
  $("modelChip").title = modelState.text;
  $("providerHelp").textContent = modelState.text;
  $("providerHelp").className = "help" + (modelState.ok === false ? " error" : "");
  $("mockTag").hidden = !$("mock").checked;
}

// --- key, start ---------------------------------------------------------------------------------

function keyGate(message) {
  clearTimeout(pollTimer);
  $("action").replaceChildren();
  $("transcript").replaceChildren(el("div", { class: "gate" },
    el("h3", {}, "Hi! Let's get you connected"),
    el("p", { class: "muted" }, "I build blends of your own LoRAs through this server's API, so I need your API key. Create one on the server with ",
      el("code", {}, "python -m async_api.users add <name>"), "."),
    el("form", { onsubmit: (e) => { e.preventDefault(); useKey($("keyInput").value.trim()); } },
      el("label", { for: "keyInput" }, "API key"),
      el("div", { style: "display:flex;gap:8px" },
        el("input", { id: "keyInput", type: "password", autocomplete: "off", placeholder: "paste it here" }),
        el("button", { class: "primary", type: "submit" }, "Connect"))),
    el("p", { class: message ? "help error" : "help" }, message || "It is kept in this browser only, shared with the other pages.")));
  $("composer").hidden = true;
  $("changeKey").hidden = true;
  key = ""; visual = null;
  drawBoard();
  setTimeout(() => $("keyInput") && $("keyInput").focus(), 0);
}

async function useKey(value) {
  key = value;
  if (!key) return keyGate("Paste a key first.");
  try {
    [config, visual] = await Promise.all([api("GET", "/agent/config"), api("GET", "/agent/visual/config")]);
  } catch (error) {
    key = "";
    return keyGate(error.status === 401 ? "That key is not known to this server." : error.message);
  }
  try { helpBlocks = (await api("GET", "/agent/help")).blocks || {}; } catch (_) { helpBlocks = {}; }
  $("guideHelp").replaceChildren(...[qm("visual_guide", "Your guide")].filter(Boolean));
  rememberKey(key);
  $("changeKey").hidden = false;
  $("composer").hidden = false;
  const saved = recall(sessionName(), true);
  if (saved && saved.transcript && saved.transcript.length) {
    S = Object.assign(fresh(), saved);
    S.session = Object.assign(fresh().session, S.session || {});
  } else {
    S = fresh();
  }
  undo = [];
  fillProviders();
  drawTranscript(); drawAction(); drawBoard();
  scheduleCheck(true);
  if (S.test && S.stage === "testing") { marker("reconnected — watching the test again"); poll(); }
  else if (S.test) poll();
  const wanted = linkedJob();
  if (wanted && !(S.test && S.test.job.id === wanted)) await openJob(wanted);
  else linkToJob();
  if (!S.transcript.length) intro();
}

// The address says which drawn blend's test is on screen (/visual_guide.html?job=N),
// so a reload, a bookmark or the runs page brings it back.
function linkToJob() {
  const url = new URL(location.href), id = S.test && S.test.job && S.test.job.id;
  if (String(id || "") === (url.searchParams.get("job") || "")) return;
  if (id) url.searchParams.set("job", id); else url.searchParams.delete("job");
  history.replaceState(null, "", url);
}

const linkedJob = () => {
  const id = Number(new URLSearchParams(location.search).get("job"));
  return Number.isInteger(id) && id > 0 ? id : null;
};

// /visual_guide.html?job=N: that drawn blend of the user's, drawn again with its test.
async function openJob(id) {
  let found;
  try {
    found = await api("GET", `/blends/${id}`);
  } catch (error) {
    agentSays(plain(error.status === 404 ? `There is no blend ${id} of yours to open.` : error.message));
    linkToJob();
    return false;
  }
  undo.push(JSON.stringify(S.session.tree));
  Object.assign(S.session, { tree: found.tree, seed: found.seed, count: found.count || S.session.count });
  // Asked on a demo dataset: the same questions again, ready to test once more.
  if (((config && config.datasets) || []).some((one) => one.file === found.questions)) S.session.questions = { file: found.questions };
  S.selected = null;
  checkSeq += 1;                      // whatever check is in flight was about the drawing before
  const check = await api("POST", "/blends/check", { tree: found.tree, seed: found.seed });
  S.check = check;
  S.test = found.verification ? { job: { id: found.job }, verification: { id: found.verification, status: "queued" },
                                  check, source: found.questions || "its questions", at: Date.now() } : null;
  S.result = null; S.log = [];
  marker(`opened drawn blend · job ${found.job}`);
  setStage(S.test ? "testing" : "drawing");
  linkToJob();
  if (S.test) poll();
  return true;
}

function intro() {
  step(async () => {
    const reply = await api("POST", "/agent/visual/intro", { agent: agentChoice(), session: session() });
    agentSays(reply.message);
    S.selected = firstEmpty(S.session.tree);
  });
}

function startOver() {
  clearTimeout(pollTimer);
  S = fresh();
  linkToJob();
  S.session.mock = $("mock").checked;
  undo = [];
  save(); drawTranscript(); drawAction(); drawBoard(); scheduleCheck(true);
  intro();
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("say").value.trim();
  if (!text || busy || !config) return;
  $("say").value = ""; $("say").style.height = "";
  send(text);
});
$("say").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); } });
$("say").addEventListener("input", () => { $("say").style.height = ""; $("say").style.height = Math.min(140, $("say").scrollHeight) + "px"; });
$("modelChip").addEventListener("click", () => { $("settings").hidden = !$("settings").hidden; });
$("provider").addEventListener("change", () => providerChanged(true));
$("model").addEventListener("change", () => { rememberAgent(); loadModels(); });
$("baseUrl").addEventListener("change", () => { rememberAgent(); loadModels(); });
$("refreshModels").addEventListener("click", loadModels);
$("mock").addEventListener("change", () => { S.session.mock = $("mock").checked; save(); drawChip(); drawBoard(); });
$("restart").addEventListener("click", () => { if (!busy) startOver(); });
$("changeKey").addEventListener("click", () => keyGate());

// The keyboard, when no field has it: Delete empties the place selected, Ctrl+Z undoes, Esc lets go.
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "");
  if (typing || !visual) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undoLast(); }
  else if ((e.key === "Delete" || e.key === "Backspace") && S.selected !== null) { e.preventDefault(); clearPlace(S.selected); }
  else if (e.key === "Escape") { S.selected = null; flashText = ""; drawBoard(); }
});

const stored = recallKey();
if (stored) useKey(stored); else keyGate();
</script>
