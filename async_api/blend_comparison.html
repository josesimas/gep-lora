        el("th", { class: "num" }, "Ties"), el("th", { class: "num" }, "Loses"), el("th", { class: "num" }, "p"))),
      el("tbody", {}, ...rows.map((one) => el("tr", {},
        el("td", {}, one.key === "blend" ? el("b", {}, contestantName(side, one.key)) : contestantName(side, one.key)),
        el("td", { class: "num" }, fmt(one.mean)),
        el("td", { class: "num" }, one.key === "blend" ? "" : one.wins),
        el("td", { class: "num" }, one.key === "blend" ? "" : one.ties),
        el("td", { class: "num" }, one.key === "blend" ? "" : one.losses),
        el("td", { class: "num" }, one.key === "blend" ? "" : fmt(one.p))))))),
    el("p", { class: "muted small", style: "margin-top:8px" },
      `${report.meta.questions} question(s), graded by ${report.meta.evaluator} (${report.meta.judge})`),
    answersBlock(side, report));
}

function meansChart(side, rows) {
  const ns = "http://www.w3.org/2000/svg";
  const make = (tag, attrs = {}, text) => { const n = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text !== undefined) n.textContent = text; return n; };
  const bar = 18, gap = 6, left = 130, width = 420, height = rows.length * (bar + gap) + 8;
  const svg = make("svg", { class: "chart", viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": `average score of blend ${side} and each of its LoRAs` });
  rows.forEach((one, i) => {
    const top = 4 + i * (bar + gap), w = Math.max(2, (width - left - 50) * (one.mean || 0));
    const label = contestantName(side, one.key);
    svg.append(make("text", { x: left - 8, y: top + 13, "text-anchor": "end", fill: "var(--ink-2)", "font-weight": one.key === "blend" ? 700 : 400 },
      label.length > 20 ? label.slice(0, 19) + "…" : label));
    const r = make("rect", { x: left, y: top, width: w, height: bar, rx: 5, fill: one.key === "blend" ? sideVar(side) : "var(--faint)" });
    r.append(make("title", {}, `${label}: ${fmt(one.mean)}`));
    svg.append(r);
    svg.append(make("text", { x: left + w + 6, y: top + 13, fill: "var(--ink)" }, fmt(one.mean)));
  });
  return svg;
}

function answersBlock(side, report) {
  const keys = ["blend", ...Object.keys(report.answers).filter((k) => k !== "blend").sort()];
  const count = (report.answers.blend || []).length;
  return el("details", { class: "answers" }, el("summary", {}, `Every answer, question by question (${count})`),
    ...Array.from({ length: count }, (_, i) => el("div", { class: "qa" },
      el("div", { class: "q" }, `${i + 1}. ${(report.answers.blend[i] || {}).question || ""}`),
      ...keys.map((k) => { const one = (report.answers[k] || [])[i] || {};
        return el("div", { class: "a" + (k === "blend" ? " blend" : ""), title: one.reason || "" },
          el("span", { class: "who" }, contestantName(side, k)), el("span", { class: "text" }, one.answer || "—"),
          el("span", { class: "score" }, fmt(one.quality, 2))); }))));
}

// A against B: computed by the server (compare.head_to_head), drawn here.
function duelCard(duel) {
  const verdict = duel.a_is === "better" ? ["A", "Blend A is clearly the better of the two."]
    : duel.a_is === "worse" ? ["B", "Blend B is clearly the better of the two."]
    : [null, "Neither is clearly better — with this many questions the difference could be luck."];
  const scored = duel.a_wins + duel.ties + duel.b_wins;
  const part = (n) => scored ? `${(100 * n / scored).toFixed(2)}%` : "0";
  const tile = (cls, k, v, s) => el("div", { class: "tile " + cls }, el("div", { class: "k" }, k), el("div", { class: "v" }, v), s ? el("div", { class: "s" }, s) : null);
  return card("A against B", el("span", { class: "muted small" }, `${duel.questions} question(s) both answered`),
    el("div", { class: "tiles" },
      tile("a", "Blend A", fmt(duel.a_mean), "average score"),
      tile("b", "Blend B", fmt(duel.b_mean), "average score"),
      tile("", "A − B", duel.delta === null ? "–" : (duel.delta >= 0 ? "+" : "") + fmt(duel.delta), "per question, on average"),
      tile("", "p", fmt(duel.p), duel.p < 0.05 ? "unlikely to be luck" : "could be luck")),
    el("div", { class: "tally", role: "img", "aria-label": `A won ${duel.a_wins}, tied ${duel.ties}, B won ${duel.b_wins}` },
      duel.a_wins ? el("div", { class: "aw", style: { width: part(duel.a_wins) }, title: `A won ${duel.a_wins}` }, `A ${duel.a_wins}`) : null,
      duel.ties ? el("div", { class: "tie", style: { width: part(duel.ties) }, title: `${duel.ties} tie(s)` }, `= ${duel.ties}`) : null,
      duel.b_wins ? el("div", { class: "bw", style: { width: part(duel.b_wins) }, title: `B won ${duel.b_wins}` }, `B ${duel.b_wins}`) : null),
    el("div", { class: "tally-legend" }, el("span", {}, "questions A scored higher"), el("span", {}, "ties"), el("span", {}, "questions B scored higher")),
    duelDots(duel),
    el("p", { class: "verdict-line" }, verdict[0] ? el("b", { style: `color:${sideVar(verdict[0])}` }, verdict[1]) : verdict[1]),
    duel.same_grader ? null : el("p", { class: "warnline" }, `They were graded differently (A: ${duel.graders[0].evaluator} / ${duel.graders[0].judge}, B: ${duel.graders[1].evaluator} / ${duel.graders[1].judge}), so read this with care.`),
    duel.only_a || duel.only_b ? el("p", { class: "warnline" }, `${duel.only_a} question(s) only A answered and ${duel.only_b} only B answered are left out.`) : null,
    el("details", { class: "pairs" }, el("summary", {}, `Every question, A beside B (${duel.rows.length})`),
      ...duel.rows.map((one, i) => {
        const a = one.A.quality, b = one.B.quality;
        const won = (side) => a !== null && b !== null && (side === "A" ? a > b : b > a);
        const half = (side) => el("div", { class: "one" + (won(side) ? " won" : ""), style: `--side:${sideVar(side)}`, title: one[side].reason || "" },
          el("div", { class: "who" }, el("span", {}, `Blend ${side}${won(side) ? " ✓" : ""}`), el("span", {}, fmt(one[side].quality, 2))),
          el("div", { class: "text" }, one[side].answer || "—"));
        return el("div", { class: "pair" }, el("div", { class: "q" }, `${i + 1}. ${one.question || ""}`),
          el("div", { class: "ab" }, half("A"), half("B")));
      })));
}

// Each question as a line from A's score to B's: which way, and how far.
function duelDots(duel) {
  const ns = "http://www.w3.org/2000/svg";
  const make = (tag, attrs = {}, text) => { const n = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text !== undefined) n.textContent = text; return n; };
  const rows = duel.rows.filter((one) => one.A.quality !== null && one.B.quality !== null);
  if (!rows.length) return null;
  const step = rows.length > 60 ? 6 : rows.length > 30 ? 10 : 16, left = 34, right = 14, width = 640;
  const height = 22 + rows.length * step + 8;
  const x = (v) => left + (width - left - right) * v;
  const svg = make("svg", { class: "dots", viewBox: `0 0 ${width} ${height}`, role: "img",
                            "aria-label": "each question's score for A and for B" });
  for (const tick of [0, 0.25, 0.5, 0.75, 1]) {
    svg.append(make("line", { x1: x(tick), x2: x(tick), y1: 14, y2: height - 4, stroke: "var(--line)" }));
    svg.append(make("text", { x: x(tick), y: 10, "text-anchor": "middle" }, String(tick)));
  }
  rows.forEach((one, i) => {
    const cy = 22 + i * step + step / 2, a = one.A.quality, b = one.B.quality;
    const g = make("g", {});
    g.append(make("line", { x1: x(a), x2: x(b), y1: cy, y2: cy, stroke: a > b ? "var(--side-a)" : a < b ? "var(--side-b)" : "var(--faint)", "stroke-width": 2, opacity: .7 }));
    g.append(make("circle", { cx: x(a), cy, r: Math.min(5, step / 2.4), fill: "var(--side-a)" }));
    g.append(make("circle", { cx: x(b), cy, r: Math.min(5, step / 2.4), fill: "var(--side-b)" }));
    if (step >= 14) g.append(make("text", { x: left - 6, y: cy + 4, "text-anchor": "end" }, String(i + 1)));
    g.append(make("title", {}, `${i + 1}. ${(one.question || "").slice(0, 120)} — A ${fmt(a, 2)}, B ${fmt(b, 2)}`));
    svg.append(g);
  });
  return el("div", { class: "scroll", style: "margin:10px 0 4px" }, svg);
}

// --- the left: what to do now ---------------------------------------------------------------

function drawAction() {
  if (!key || !visual) return $("action").replaceChildren();
  const instruction = (visual.words.instructions || {})[S.stage] || "";
  const ready = !whyNot();
  $("action").replaceChildren(el("div", { class: "ask" }, S.stage === "testing" ? "Testing" : S.stage === "tested" ? "Compared" : "Choosing"),
    el("div", { class: "small", html: md(instruction) }),
    el("div", { class: "buttons" },
      el("button", { type: "button", class: "primary", onclick: startTest, disabled: busy || !ready }, "Test both blends"),
      el("button", { type: "button", class: "sm ghost", onclick: () => undoLast(), disabled: busy || !undo.length }, "Undo")),
    el("p", { class: "help" }, words("hint")));
}

// --- the chat ---------------------------------------------------------------------------------

function agentChoice() {
  return { provider: $("provider").value, model: $("model").value.trim() || undefined,
           base_url: $("baseUrlRow").hidden ? undefined : ($("baseUrl").value.trim() || undefined),
           conversation: S.conversation };
}

function chatContext() {
  if (!S.duel) return {};
  const side = (one) => one && one.report ? { formula: one.report.formula, mean: one.report.blend_mean } : { status: one && one.status };
  const duel = S.duel.head_to_head;
  return { result: { A: side(S.duel.A), B: side(S.duel.B),
                     head_to_head: duel ? { a_wins: duel.a_wins, ties: duel.ties, b_wins: duel.b_wins, p: duel.p, a_is: duel.a_is } : null } };
}

async function send(text) {
  userSays(text);
  let wantsTest = false;
  await step(async () => {
    const before = { A: JSON.stringify(blendOf("A")), B: JSON.stringify(blendOf("B")) };
    const reply = await api("POST", "/agent/compare/chat", {
      agent: agentChoice(), message: text, stage: S.stage, session: session(), context: chatContext(),
      history: pastTurns().slice(0, -1) });
    for (const done of reply.steps || []) toolMarker(done);
    if (reply.session) {
      for (const side of SIDES) {
        if (JSON.stringify(reply.session.blends[side]) !== before[side]) {
          undo.push({ side, blend: before[side] });
          if (S.selected && S.selected.side === side) S.selected = null;
        }
      }
      S.session = reply.session;
      $("mock").checked = S.session.mock; drawChip();
      if (S.session.questions && S.session.questions.given && !S.given) S.session.questions = null;
    }
    if (reply.checks) S.checks = { A: reply.checks.A, B: reply.checks.B };
    agentSays(reply.message);
    linkToBlends();
    save(); drawBoard();
    wantsTest = (reply.actions || []).some((action) => action.type === "test");
  });
  if (wantsTest) startTest();
}

// --- the model the guide talks through: the guide's own picker -------------------------------

function fillProviders() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("gep-agent-agent") || "null") || {}; } catch (_) { /* private mode */ }
  $("provider").replaceChildren(...config.providers.map((p) =>
    el("option", { value: p.name }, p.label + (p.ready ? "" : ` — needs ${p.key_env}`))));
  $("provider").value = config.providers.some((p) => p.name === saved.provider) ? saved.provider : config.default.provider;
  $("model").value = saved.provider === $("provider").value ? (saved.model || "") : (config.default.model || "");
  $("baseUrl").value = saved.provider === $("provider").value ? (saved.base_url || "") : "";
  $("mock").checked = Boolean(S.session.mock);
  providerChanged(false);
}

function provider() { return config.providers.find((p) => p.name === $("provider").value); }

function providerChanged(clear = true) {
  const p = provider();
  if (clear) { $("model").value = ""; $("baseUrl").value = ""; }
  $("baseUrlRow").hidden = !(p.local && p.kind === "openai");
  $("baseUrl").placeholder = p.base_url || "";
  $("model").placeholder = p.model ? p.model : p.kind === "scripted" ? "no model" : "the first model it lists";
  $("model").disabled = p.kind === "scripted";
  $("refreshModels").disabled = p.kind === "scripted";
  rememberAgent();
  loadModels();
}

// The same choice the other guides remember, so every guide talks through one model.
function rememberAgent() {
  try { localStorage.setItem("gep-agent-agent", JSON.stringify({ provider: $("provider").value, model: $("model").value.trim(), base_url: $("baseUrl").value.trim() })); } catch (_) { /* private mode */ }
  drawChip();
}

let modelState = { ok: null, text: "" };
async function loadModels() {
  const p = provider();
  if (p.kind === "scripted") { modelState = { ok: true, text: "The guide uses its built-in wording; no model is asked." }; return drawChip(); }
  if (!p.ready) { modelState = { ok: false, text: `Set ${p.key_env} in the environment the API server runs in, then restart it. Until then the guide uses its built-in wording.` }; return drawChip(); }
  modelState = { ok: null, text: "Asking for its models…" }; drawChip();
  const query = new URLSearchParams({ provider: p.name });
  if (!$("baseUrlRow").hidden && $("baseUrl").value.trim()) query.set("base_url", $("baseUrl").value.trim());
  try {
    const reply = await api("GET", "/agent/models?" + query);
    $("modelList").replaceChildren(...reply.models.map((m) => el("option", { value: m })));
    const using = $("model").value.trim() || reply.default || reply.models[0];
    modelState = { ok: true, using, text: `${reply.models.length} model(s) at ${reply.base_url}.` + (using ? ` Talking to ${using}.` : "") };
  } catch (error) {
    modelState = { ok: false, text: error.message + " — the guide falls back to its built-in wording." };
  }
  drawChip();
}

function drawChip() {
  const p = config && provider();
  if (!p) return;
  const model = $("model").value.trim() || (p.kind === "scripted" ? "" : modelState.using || p.model || "auto");
  $("modelChip").querySelector("span").textContent = p.label.replace(/ \(.*\)$/, "") + (model ? " · " + model : "");
  $("modelChip").className = "sm ghost model-chip " + (modelState.ok === true ? "up" : modelState.ok === false ? "down" : "");
  $("modelChip").title = modelState.text;
  $("providerHelp").textContent = modelState.text;
  $("providerHelp").className = "help" + (modelState.ok === false ? " error" : "");
  $("mockTag").hidden = !$("mock").checked;
}

// --- key, start ---------------------------------------------------------------------------------

function keyGate(message) {
  clearTimeout(pollTimer);
  $("action").replaceChildren();
  $("transcript").replaceChildren(el("div", { class: "gate" },
    el("h3", {}, "Hi! Let's get you connected"),
    el("p", { class: "muted" }, "I compare blends of your own LoRAs through this server's API, so I need your API key. Create one on the server with ",
      el("code", {}, "python -m async_api.users add <name>"), "."),
    el("form", { onsubmit: (e) => { e.preventDefault(); useKey($("keyInput").value.trim()); } },
      el("label", { for: "keyInput" }, "API key"),
      el("div", { style: "display:flex;gap:8px" },
        el("input", { id: "keyInput", type: "password", autocomplete: "off", placeholder: "paste it here" }),
        el("button", { class: "primary", type: "submit" }, "Connect"))),
    el("p", { class: message ? "help error" : "help" }, message || "It is kept in this browser only, shared with the other pages.")));
  $("composer").hidden = true;
  $("changeKey").hidden = true;
  key = ""; visual = null;
  drawBoard();
  setTimeout(() => $("keyInput") && $("keyInput").focus(), 0);
}

async function useKey(value) {
  key = value;
  if (!key) return keyGate("Paste a key first.");
  try {
    [config, visual] = await Promise.all([api("GET", "/agent/config"), api("GET", "/agent/compare/config")]);
  } catch (error) {
    key = "";
    return keyGate(error.status === 401 ? "That key is not known to this server." : error.message);
  }
  try { helpBlocks = (await api("GET", "/agent/help")).blocks || {}; } catch (_) { helpBlocks = {}; }
  $("guideHelp").replaceChildren(...[qm("compare_guide", "Your guide")].filter(Boolean));
  rememberKey(key);
  $("changeKey").hidden = false;
  $("composer").hidden = false;
  const saved = recall(sessionName(), true);
  if (saved && saved.transcript && saved.transcript.length) {
    S = Object.assign(fresh(), saved);
    S.session = Object.assign(fresh().session, S.session || {});
    S.session.blends = Object.assign({ A: emptySide(), B: emptySide() }, S.session.blends || {});
  } else {
    S = fresh();
  }
  undo = [];
  fillProviders();
  drawTranscript(); drawAction(); drawBoard();
  SIDES.forEach((side) => scheduleCheck(side, true));
  loadSources();
  if (S.tests) { if (S.stage === "testing") marker("reconnected — watching the tests again"); poll(); }
  await openLinked();
  if (!S.transcript.length) intro();
}

// The address says which blends are on screen (?a=JOB.N&b=JOB.N, as opened
// from a job), so a reload, a bookmark or a shared link brings them back.
function linkToBlends() {
  const url = new URL(location.href);
  for (const side of SIDES) {
    const from = blendOf(side).from, name = side.toLowerCase();
    if (from) url.searchParams.set(name, `${from.job}.${from.individual}`); else url.searchParams.delete(name);
  }
  if (url.href !== location.href) history.replaceState(null, "", url);
}

async function openLinked() {
  const query = new URLSearchParams(location.search);
  for (const side of SIDES) {
    const wanted = (query.get(side.toLowerCase()) || "").match(/^(\d+)(?:\.(\d+))?$/);
    if (!wanted) continue;
    const [job, number] = [Number(wanted[1]), wanted[2] ? Number(wanted[2]) : null];
    const from = blendOf(side).from;
    if (from && from.job === job && (number === null || from.individual === number)) continue;
    try { await openBlend(side, job, number); }
    catch (error) { agentSays(plain(error.status === 404 ? `There is no job ${job} of yours to open into ${side}.` : `${side}: ${error.message}`)); }
  }
  linkToBlends();
}

function intro() {
  step(async () => {
    const reply = await api("POST", "/agent/compare/intro", { agent: agentChoice(), session: session() });
    agentSays(reply.message);
  });
}

function startOver() {
  clearTimeout(pollTimer);
  S = fresh();
  picking = { A: null, B: null };
  S.session.mock = $("mock").checked;
  undo = [];
  linkToBlends();
  save(); drawTranscript(); drawAction(); drawBoard();
  SIDES.forEach((side) => scheduleCheck(side, true));
  intro();
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("say").value.trim();
  if (!text || busy || !config) return;
  $("say").value = ""; $("say").style.height = "";
  send(text);
});
$("say").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); } });
$("say").addEventListener("input", () => { $("say").style.height = ""; $("say").style.height = Math.min(140, $("say").scrollHeight) + "px"; });
$("modelChip").addEventListener("click", () => { $("settings").hidden = !$("settings").hidden; });
$("provider").addEventListener("change", () => providerChanged(true));
$("model").addEventListener("change", () => { rememberAgent(); loadModels(); });
$("baseUrl").addEventListener("change", () => { rememberAgent(); loadModels(); });
$("refreshModels").addEventListener("click", loadModels);
$("mock").addEventListener("change", () => { S.session.mock = $("mock").checked; save(); drawChip(); drawBoard(); });
$("restart").addEventListener("click", () => { if (!busy) startOver(); });
$("changeKey").addEventListener("click", () => keyGate());

// The keyboard, when no field has it: Delete empties the place selected, Ctrl+Z undoes, Esc lets go.
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "");
  if (typing || !visual) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undoLast(S.selected ? S.selected.side : null); }
  else if ((e.key === "Delete" || e.key === "Backspace") && S.selected) { e.preventDefault(); clearPlace(S.selected.side, S.selected.path); }
  else if (e.key === "Escape") { S.selected = null; flashText = { A: "", B: "" }; drawBoard(); }
});

const stored = recallKey();
if (stored) useKey(stored); else keyGate();
</script>
